      const sortedArray = [...safeArray].sort((a, b) => new Date(a?.date || 0) - new Date(b?.date || 0));
      const counts = {};
      const renumberedArray = sortedArray.map(item => {
        const year = item?.date ? item.date.substring(0, 4) : new Date().getFullYear().toString();
        let prefix = basePrefix;
        if (hasPpn) {
          prefix = item?.usePpn ? `${basePrefix}-PPN` : `${basePrefix}-NON`;
        }
        const key = `${year}-${prefix}`;
        if (!counts[key]) counts[key] = 0;
        counts[key]++;

        const seq = counts[key].toString().padStart(4, '0');
        const newId = `${seq}/${prefix}/NVP/APK-SERT/${year}`;
        return { ...item, id: newId };
      });
      return renumberedArray.sort((a, b) => new Date(b?.date || 0) - new Date(a?.date || 0));

    // =====================================================================
    // PORTAL FINANCE & ADMIN (kode akunting asli — logika & struktur data tidak diubah)
    // =====================================================================
    function App({ onBackToSite }) {
      // CRITICAL FIX: ALL HOOKS DECLARED SERIALLY AT TOP LEVEL SCOPE
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);

      // PENGAMAN DATA: auto-save hanya aktif jika data lama berhasil dibaca,
      // supaya kegagalan koneksi tidak menimpa data di Drive dengan data kosong.
      const saveAllowedRef = useRef(false);
      const [loadError, setLoadError] = useState('');

      // MODE HOSTING:
      //  - isGAS : dibuka dari Google Apps Script (google.script.run) — seperti versi lama
      //  - isAPI : dibuka dari GitHub Pages, data lewat Web App Apps Script (apps-script/Api.gs)
      //  - lainnya: mode lokal, data hanya di localStorage browser ini
      const isGAS = typeof google !== 'undefined' && !!google.script;
      const isAPI = !isGAS && !!API_URL;
      const apiCredsRef = useRef(null);
      const lastSavedRef = useRef(null);
      const [syncError, setSyncError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const restoreInputRef = useRef(null);
      const [restorePreview, setRestorePreview] = useState(null);

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginFormState, setLoginFormState] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      const [printData, setPrintData] = useState(null);
      const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');

      const [penawaran, setPenawaran] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [suratJalan, setSuratJalan] = useState([]);
      const [kwitansi, setKwitansi] = useState([]);

      const [editingId, setEditingId] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState(null);

      const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
      const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());

      const defaultPnwNotes = "1. Harga dapat berubah sewaktu-waktu tanpa pemberitahuan sebelumnya jika masa berlaku telah habis.\n2. Sistem pembayaran dan termin waktu dapat didiskusikan lebih lanjut.";
      const emptyPenawaranForm = { date: '', validUntil: '', customer: '', usePpn: true, items: [], signerName: '', signerRole: 'Marketing Dept.', notes: defaultPnwNotes };
      const emptyInvoiceForm = { date: '', customer: '', usePpn: true, items: [], signerName: '', signerRole: 'Finance Dept.' };
      const emptyExpenseForm = { date: '', desc: '', category: 'Operasional', amount: 0 };
      const emptySjForm = { date: '', customer: '', driver: '', vehicle: '', items: [], signerName: '', signerRole: 'Warehouse Dept.' };
      const emptyKwitansiForm = { date: '', receivedFrom: '', amount: 0, purpose: '', signerName: '', signerRole: 'Finance Dept.' };

      const [penawaranForm, setPenawaranForm] = useState(emptyPenawaranForm);
      const [invoiceForm, setInvoiceForm] = useState(emptyInvoiceForm);
      const [expenseForm, setExpenseForm] = useState(emptyExpenseForm);
      const [sjForm, setSjForm] = useState(emptySjForm);
      const [kwitansiForm, setKwitansiForm] = useState(emptyKwitansiForm);

      const [filterPrintPnw, setFilterPrintPnw] = useState('all');
      const [filterPrintInv, setFilterPrintInv] = useState('all');

      const [isPenawaranModalOpen, setPenawaranModalOpen] = useState(false);
      const [isInvoiceModalOpen, setInvoiceModalOpen] = useState(false);
      const [isExpenseModalOpen, setExpenseModalOpen] = useState(false);
      const [isSJModalOpen, setSJModalOpen] = useState(false);
      const [isKwitansiModalOpen, setKwitansiModalOpen] = useState(false);

      const currentYearStr = new Date().getFullYear().toString();
      const prevYearStr = (new Date().getFullYear() - 1).toString();
      const [selectedTaxYear, setSelectedTaxYear] = useState(currentYearStr);

      // --- MEMOIZED CALCULATIONS WITH Lap. KONSOLIDASI LABA RUGI TOTAL ---
      const kasMasukPPN = useMemo(() => (invoices||[]).filter(inv => inv?.usePpn).reduce((sum, inv) => sum + (inv?.total || 0), 0), [invoices]);
      const kasMasukNonPPN = useMemo(() => (invoices||[]).filter(inv => inv && !inv.usePpn).reduce((sum, inv) => sum + (inv?.total || 0), 0), [invoices]);
      const totalKasMasuk = kasMasukPPN + kasMasukNonPPN;

      const pendapatanResmiLabaRugi = useMemo(() => (invoices||[]).filter(inv => inv?.usePpn).reduce((sum, inv) => sum + (inv?.subtotal || 0), 0), [invoices]);
      const pendapatanBebasLabaRugi = useMemo(() => (invoices||[]).filter(inv => !inv?.usePpn).reduce((sum, inv) => sum + (inv?.subtotal || 0), 0), [invoices]);
      const totalHPP = useMemo(() => (expenses||[]).filter(e => e?.category === 'HPP').reduce((sum, e) => sum + (e?.amount || 0), 0), [expenses]);
      const totalOperasional = useMemo(() => (expenses||[]).filter(e => e?.category === 'Operasional').reduce((sum, e) => sum + (e?.amount || 0), 0), [expenses]);

      const labaKotorResmi = pendapatanResmiLabaRugi - totalHPP;
      const labaBersihResmi = labaKotorResmi - totalOperasional;

      // Perhitungan Laba Rugi Keseluruhan (Konsolidasi Total)
      const totalPendapatanKonsolidasi = pendapatanResmiLabaRugi + pendapatanBebasLabaRugi;
      const labaKotorKonsolidasi = totalPendapatanKonsolidasi - totalHPP;
      const labaBersihKonsolidasi = labaKotorKonsolidasi - totalOperasional;

      const availableYears = useMemo(() => {
        const years = new Set([currentYearStr]);
        (invoices||[]).forEach(inv => { if(inv?.date) years.add(inv.date.substring(0, 4)) });
        (expenses||[]).forEach(exp => { if(exp?.date) years.add(exp.date.substring(0, 4)) });
        return Array.from(years).sort((a, b) => parseInt(b) - parseInt(a));
      }, [invoices, expenses, currentYearStr]);

      const monthlyRevenueData = useMemo(() => {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
        const data = months.map(m => ({ month: m, curr: 0, prev: 0 }));
        (invoices||[]).forEach(inv => {
          if(!inv?.date) return;
          const date = new Date(inv.date);
          if (date.getFullYear().toString() === currentYearStr) data[date.getMonth()].curr += (inv.total || 0);
          else if (date.getFullYear().toString() === prevYearStr) data[date.getMonth()].prev += (inv.total || 0);
        });
        return data;
      }, [invoices]);

      const maxChartValue = Math.max(...monthlyRevenueData.flatMap(d => [d.curr, d.prev]), 10000000);

      const singleYearTaxReport = useMemo(() => {
        let pendapatan = 0, ppn = 0, hpp = 0, operasional = 0;
        (invoices||[]).forEach(inv => {
          if (inv?.usePpn && inv?.date?.substring(0, 4) === selectedTaxYear) {
            pendapatan += (inv.subtotal || 0); ppn += (inv.ppn || 0);
          }
        });
        (expenses||[]).forEach(exp => {
          if (exp?.date?.substring(0, 4) === selectedTaxYear) {
            if (exp.category === 'HPP') hpp += (exp.amount || 0);
            else if (exp.category === 'Operasional') operasional += (exp.amount || 0);
          }
        });
        const labaBruto = pendapatan - hpp;
        return { year: selectedTaxYear, pendapatan, ppn, hpp, operasional, labaBruto, GridNeto: labaBruto - operasional };
      }, [invoices, expenses, selectedTaxYear]);

      const calendarEvents = useMemo(() => {
        const events = {};
        (invoices||[]).forEach(inv => {
          if(!inv?.date) return;
          if (!events[inv.date]) events[inv.date] = [];
          events[inv.date].push(inv);
        });
        return events;
      }, [invoices]);

      // --- DATA LOADING & SYNCING (kunci & format data sama persis dengan versi lama) ---
      const applyLoadedData = (data) => {
        if (data.penawaran && Array.isArray(data.penawaran)) setPenawaran(data.penawaran);
        if (data.invoices && Array.isArray(data.invoices)) setInvoices(data.invoices);
        if (data.expenses && Array.isArray(data.expenses)) setExpenses(data.expenses);
        if (data.suratJalan && Array.isArray(data.suratJalan)) setSuratJalan(data.suratJalan);
        if (data.kwitansi && Array.isArray(data.kwitansi)) setKwitansi(data.kwitansi);
      };

      // --- API (GitHub Pages -> Google Apps Script Web App) ---
      // Body dikirim sebagai text/plain agar tidak memicu CORS preflight.
      const callApi = async (payload) => {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      };

      const saveToServer = (dataObj) => {
        const json = JSON.stringify(dataObj);
        setIsSyncing(true);
        return callApi({ action: 'save', ...apiCredsRef.current, data: dataObj })
          .then(r => {
            if (!r || !r.ok) throw new Error((r && r.error) || 'respon tidak valid');
            lastSavedRef.current = json;
            setSyncError('');
            return true;
          })
          .catch(err => {
            setSyncError('Gagal menyimpan ke server (' + err.message + '). Perubahan terakhir belum tersimpan.');
            return false;
          })
          .finally(() => setIsSyncing(false));
      };

      useEffect(() => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(function(response) {
              if (response) {
                try {
                  applyLoadedData(JSON.parse(response));
                  saveAllowedRef.current = true;
                } catch (e) {
                  console.error(e);
                  setLoadError('Data di Google Drive tidak dapat dibaca. Penyimpanan otomatis dinonaktifkan agar data lama tidak tertimpa.');
                }
              } else {
                saveAllowedRef.current = true; // belum ada data sama sekali
              }
              setIsDataLoaded(true);
            })
            .withFailureHandler(function() {
              setLoadError('Gagal terhubung ke Google Drive. Penyimpanan otomatis dinonaktifkan agar data lama tidak tertimpa — muat ulang halaman.');
              setIsDataLoaded(true);
            })
            .loadDataFromDrive();
        } else if (isAPI) {
          // Data dimuat setelah login — server memeriksa username & password.
          setIsDataLoaded(true);
        } else {
          let localData = null;
          try { localData = localStorage.getItem('nvp_data_fallback'); } catch (e) {}
          if (localData) {
            try {
              applyLoadedData(JSON.parse(localData));
              saveAllowedRef.current = true;
            } catch (e) {
              setLoadError('Data lokal tidak dapat dibaca. Penyimpanan otomatis dinonaktifkan agar data lama tidak tertimpa.');
            }
          } else {
            saveAllowedRef.current = true;
          }
          setIsDataLoaded(true);
        }
      }, []);

      useEffect(() => {
        if (!isDataLoaded || !saveAllowedRef.current) return;
        const dataToSave = { penawaran, invoices, expenses, suratJalan, kwitansi };
        if (isAPI && JSON.stringify(dataToSave) === lastSavedRef.current) { setIsSyncing(false); return; } // tidak ada perubahan
        setIsSyncing(true);
        const timeoutId = setTimeout(() => {
          if (isAPI) {
            saveToServer(dataToSave);
          } else if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(() => setIsSyncing(false))
              .withFailureHandler(() => setIsSyncing(false))
              .saveDataToDrive(JSON.stringify(dataToSave));
          } else {
             try { localStorage.setItem('nvp_data_fallback', JSON.stringify(dataToSave)); } catch (e) { console.error(e); }
             setIsSyncing(false);
          }
        }, 1500);
        return () => clearTimeout(timeoutId);
      }, [penawaran, invoices, expenses, suratJalan, kwitansi, isDataLoaded]);

      const handleDownloadPDF = () => {
        const element = document.getElementById('print-container');
        if (!element) return;

        setIsGeneratingPDF(true);
        const fileName = printData.item && !Array.isArray(printData.item)
            ? `${printData.item.id.replace(/\//g, '-')}.pdf`
            : `Dokumen_${printData.type}_Kolektif.pdf`;

        const opt = {
          margin:       [12, 12, 12, 12],
          filename:     fileName,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, logging: false },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
          setIsGeneratingPDF(false);
        });
      };

      useEffect(() => {
        if (printData && printData.autoDownload) {
          setTimeout(() => {
            handleDownloadPDF();
            setPrintData(prev => ({...prev, autoDownload: false}));
          }, 800);
        }
      }, [printData]);

      useEffect(() => {
        if (!isSyncing && !syncError) return;
        const warn = (e) => { e.preventDefault(); e.returnValue = ''; };
        window.addEventListener('beforeunload', warn);
        return () => window.removeEventListener('beforeunload', warn);
      }, [isSyncing, syncError]);

      // --- LOGIC FUNCTIONS ---
      const validUsers = [
        { username: 'admin', password: 'admin123', name: 'Administrator', initial: 'A' },
        { username: 'staff', password: 'staff123', name: 'Staff Finance', initial: 'S' }
      ];

      const loginViaApi = async () => {
        setIsLoggingIn(true); setLoginError('');
        const creds = { username: loginFormState.username.trim(), password: loginFormState.password };
        try {
          const r = await callApi({ action: 'load', ...creds });
          if (!r || !r.ok) {
            setLoginError(r && r.error === 'AUTH' ? 'Username atau password salah!' : 'Server: ' + ((r && r.error) || 'respon tidak valid'));
            return;
          }
          let data = {};
          if (r.data) {
            try { data = typeof r.data === 'string' ? JSON.parse(r.data) : r.data; }
            catch (e) { setLoginError('Data di Google Drive tidak dapat dibaca. Hubungi admin.'); return; }
          }
          const arr = (x) => Array.isArray(x) ? x : [];
          lastSavedRef.current = JSON.stringify({ penawaran: arr(data.penawaran), invoices: arr(data.invoices), expenses: arr(data.expenses), suratJalan: arr(data.suratJalan), kwitansi: arr(data.kwitansi) });
          applyLoadedData(data);
          apiCredsRef.current = creds;
          saveAllowedRef.current = true;
          setLoadError(''); setSyncError('');
          const u = r.user || {};
          setCurrentUser({ username: u.username || creds.username, name: u.name || creds.username, initial: u.initial || (creds.username[0] || '?').toUpperCase() });
          setIsLoggedIn(true);
        } catch (err) {
          setLoginError('Tidak dapat terhubung ke server data. Periksa koneksi internet dan API_URL di config.js.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (isAPI) { loginViaApi(); return; }
        const user = validUsers.find(
          u => u.username === loginFormState.username && u.password === loginFormState.password
        );
        if (user) { setIsLoggedIn(true); setCurrentUser(user); setLoginError(''); }
        else { setLoginError('Username atau password salah!'); }
      };

      const handleLogout = async () => {
        if (isAPI && apiCredsRef.current) {
          // Simpan dulu perubahan yang belum terkirim, baru kosongkan data dari memori browser.
          const pending = { penawaran, invoices, expenses, suratJalan, kwitansi };
          if (saveAllowedRef.current && JSON.stringify(pending) !== lastSavedRef.current) {
            const ok = await saveToServer(pending);
            if (!ok) return; // tetap login agar data tidak hilang
          }
          saveAllowedRef.current = false;
          apiCredsRef.current = null;
          lastSavedRef.current = null;
          setPenawaran([]); setInvoices([]); setExpenses([]); setSuratJalan([]); setKwitansi([]);
          setActiveTab('dashboard');
        }
        setIsLoggedIn(false); setCurrentUser(null); setLoginFormState({ username: '', password: '' });
      };

      const executeDelete = () => {
        if (!deleteConfirm) return;
        const { type, id } = deleteConfirm;
        if (type === 'penawaran') setPenawaran(renumberDocuments((penawaran||[]).filter(i => i?.id !== id), 'PNW', true));
        else if (type === 'invoice') setInvoices(renumberDocuments((invoices||[]).filter(i => i?.id !== id), 'INV', true));
        else if (type === 'sj') setSuratJalan(renumberDocuments((suratJalan||[]).filter(i => i?.id !== id), 'SJ', false));
        else if (type === 'kwitansi') setKwitansi(renumberDocuments((kwitansi||[]).filter(i => i?.id !== id), 'KWT', false));
        else if (type === 'expense') setExpenses((expenses||[]).filter(i => i?.id !== id));
        setDeleteConfirm(null);
      };

      const handleEdit = (type, item) => {
        setEditingId(item.id);
        if (type === 'penawaran') { setPenawaranForm({...emptyPenawaranForm, ...item, items: item.items||[]}); setPenawaranModalOpen(true); }
        else if (type === 'invoice') { setInvoiceForm({...emptyInvoiceForm, ...item, items: item.items||[]}); setInvoiceModalOpen(true); }
        else if (type === 'sj') { setSjForm({...emptySjForm, ...item, items: item.items||[]}); setSJModalOpen(true); }
        else if (type === 'kwitansi') { setKwitansiForm({...emptyKwitansiForm, ...item}); setKwitansiModalOpen(true); }
        else if (type === 'expense') { setExpenseForm({...emptyExpenseForm, ...item}); setExpenseModalOpen(true); }
      };

      const openNewModal = (type) => {
        setEditingId(null);
        if (type === 'penawaran') { setPenawaranForm(emptyPenawaranForm); setPenawaranModalOpen(true); }
        else if (type === 'invoice') { setInvoiceForm(emptyInvoiceForm); setInvoiceModalOpen(true); }
        else if (type === 'sj') { setSjForm(emptySjForm); setSJModalOpen(true); }
        else if (type === 'kwitansi') { setKwitansiForm(emptyKwitansiForm); setKwitansiModalOpen(true); }
        else if (type === 'expense') { setExpenseForm(emptyExpenseForm); setExpenseModalOpen(true); }
      };

      const handleSavePenawaran = () => {
        const subtotal = (penawaranForm.items||[]).reduce((sum, item) => sum + ((item?.qty||0) * (item?.price||0)), 0);
        const ppn = penawaranForm.usePpn ? subtotal * 0.11 : 0;
        const total = subtotal + ppn;
        const completeItem = { ...penawaranForm, subtotal, ppn, total };
        let newArray = editingId ? (penawaran||[]).map(p => p?.id === editingId ? { ...completeItem, id: p.id } : p) : [...(penawaran||[]), { ...completeItem, id: 'temp' }];
        setPenawaran(renumberDocuments(newArray, 'PNW', true));
        setPenawaranModalOpen(false);
      };

      const handleSaveInvoice = () => {
        const subtotal = (invoiceForm.items||[]).reduce((sum, item) => sum + ((item?.qty||0) * (item?.price||0)), 0);
        const ppn = invoiceForm.usePpn ? subtotal * 0.11 : 0;
        const total = subtotal + ppn;
        const completeItem = { ...invoiceForm, subtotal, ppn, total };
        let newArray = editingId ? (invoices||[]).map(i => i?.id === editingId ? { ...completeItem, id: i.id } : i) : [...(invoices||[]), { ...completeItem, id: 'temp' }];
        setInvoices(renumberDocuments(newArray, 'INV', true));
        setInvoiceModalOpen(false);
      };

      const handleSaveSJ = () => {
        let newArray = editingId ? (suratJalan||[]).map(s => s?.id === editingId ? { ...sjForm, id: s.id } : s) : [...(suratJalan||[]), { ...sjForm, id: 'temp' }];
        setSuratJalan(renumberDocuments(newArray, 'SJ', false));
        setSJModalOpen(false);
      };

      const handleSaveKwitansi = () => {
        const completeItem = { ...kwitansiForm, amount: Number(kwitansiForm.amount) || 0 };
        let newArray = editingId ? (kwitansi||[]).map(k => k?.id === editingId ? { ...completeItem, id: k.id } : k) : [...(kwitansi||[]), { ...completeItem, id: 'temp' }];
        setKwitansi(renumberDocuments(newArray, 'KWT', false));
        setKwitansiModalOpen(false);
      };

      const handleSaveExpense = () => {
        const completeItem = { ...expenseForm, amount: Number(expenseForm.amount) || 0 };
        if (editingId) { setExpenses((expenses||[]).map(e => e?.id === editingId ? { ...completeItem, id: e.id } : e)); }
        else {
          const newId = `EXP-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;
          setExpenses([{ ...completeItem, id: newId }, ...(expenses||[])].sort((a,b) => new Date(b?.date||0) - new Date(a?.date||0)));
        }
        setExpenseModalOpen(false);
      };

      const handlePrintAllPenawaran = (downloadPdf = false) => {
        let filtered = penawaran || [];
        if (filterPrintPnw === 'ppn') filtered = filtered.filter(p => p?.usePpn);
        if (filterPrintPnw === 'non_ppn') filtered = filtered.filter(p => p && !p.usePpn);
        setPrintData({ type: 'penawaran', item: filtered, autoDownload: downloadPdf });
      };

      const handlePrintAllInvoice = (downloadPdf = false) => {
        let filtered = invoices || [];
        if (filterPrintInv === 'ppn') filtered = filtered.filter(i => i?.usePpn);
        if (filterPrintInv === 'non_ppn') filtered = filtered.filter(i => i && !i.usePpn);
        setPrintData({ type: 'invoice', item: filtered, autoDownload: downloadPdf });
      };

      // --- BACKUP & PULIHKAN DATA (file JSON) ---
      const handleBackup = (label) => {
        const data = { penawaran, invoices, expenses, suratJalan, kwitansi };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nvp-backup-${new Date().toISOString().slice(0, 10)}${typeof label === 'string' ? '-' + label : ''}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      const handleRestoreFile = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const d = JSON.parse(reader.result);
            const keys = ['penawaran', 'invoices', 'expenses', 'suratJalan', 'kwitansi'];
            if (!d || !keys.some(k => Array.isArray(d[k]))) throw new Error('format');
            setRestorePreview({ fileName: file.name, data: d });
          } catch (err) {
            setSyncError('File tidak valid. Pilih file backup JSON dari portal ini (berisi penawaran, invoices, expenses, suratJalan, kwitansi).');
          }
        };
        reader.readAsText(file);
      };

      const applyRestore = () => {
        if (!restorePreview) return;
        const d = restorePreview.data;
        const arr = (x) => Array.isArray(x) ? x : [];
        handleBackup('sebelum-pulihkan'); // cadangan otomatis data saat ini
        setPenawaran(arr(d.penawaran)); setInvoices(arr(d.invoices)); setExpenses(arr(d.expenses));
        setSuratJalan(arr(d.suratJalan)); setKwitansi(arr(d.kwitansi));
        saveAllowedRef.current = true;
        setLoadError('');
        setRestorePreview(null);
      };

      // --- EARLY RETURNS (Tampilan Layar Tunggal) ---
      if (!isDataLoaded) {
        return (
          <div className="min-h-screen bg-[#f8fafc] flex flex-col items-center justify-center p-4 font-sans text-slate-800">
             <div className="w-12 h-12 border-4 border-t-red-600 border-slate-200 rounded-full animate-spin mb-5"></div>
             <h2 className="text-xl font-bold tracking-tight">Terhubung ke Google Drive...</h2>
             <p className="text-sm text-slate-500 mt-2 font-medium">Sinkronisasi data sistem keuangan PT Nuri Vira Pratama.</p>
          </div>
        );
      }

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen hero-bg relative flex items-center justify-center p-4 font-sans">
            <div className="absolute inset-0 grid-lines pointer-events-none"></div>
            <button onClick={onBackToSite} className="absolute top-5 left-5 flex items-center gap-2 text-slate-300 hover:text-white text-sm font-bold bg-white/5 border border-white/10 px-4 py-2 rounded-xl">
              <IconChevronLeft size={16}/> Kembali ke Website
            </button>
            <div className="relative bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
              <div className="text-center mb-8">
                <div className="w-24 h-24 bg-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-sm border border-slate-100">
                  <img src={LOGO_URL} alt="Logo" className="w-16 h-16 object-contain" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_FALLBACK; }} />
                </div>
                <h1 className="text-2xl font-black text-slate-800 tracking-tight leading-tight">PT NURI VIRA PRATAMA</h1>
                <p className="text-red-600 font-bold text-[10px] tracking-[0.25em] uppercase mt-2">Finance & Admin Portal</p>
              </div>
              {loginError && (
                <div className="bg-rose-50 text-rose-600 px-4 py-3 rounded-xl text-sm mb-6 border border-rose-100 flex items-center justify-center font-medium">
                  {loginError}
                </div>
              )}
              <form onSubmit={handleLogin} className="space-y-5">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">Username</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><IconUser size={18} /></div>
                    <input type="text" required value={loginFormState.username} onChange={(e) => setLoginFormState({...loginFormState, username: e.target.value})} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500 outline-none" placeholder="Masukkan username" />
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">Password</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><IconLock size={18} /></div>
                    <input type="password" required value={loginFormState.password} onChange={(e) => setLoginFormState({...loginFormState, password: e.target.value})} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500 outline-none" placeholder="••••••••" />
                  </div>
                </div>
                <button type="submit" disabled={isLoggingIn} className="w-full bg-red-600 text-white font-bold py-3.5 rounded-xl hover:bg-red-700 disabled:opacity-60 disabled:cursor-wait transition-all duration-200 mt-6">{isLoggingIn ? 'Memeriksa akun...' : 'Masuk ke Portal'}</button>
              </form>
              {isAPI ? (
                <div className="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 text-center font-medium flex items-center justify-center gap-2">
                  <IconLock size={14}/> Terhubung ke server data perusahaan (Google Drive)
                </div>
              ) : (
                <div className="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 text-center font-medium">
                  {!isGAS && (
                    <div className="mb-4 text-left bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 leading-relaxed">
                      <b>Mode lokal:</b> data hanya tersimpan di browser ini. Isi <code className="bg-amber-100 px-1 rounded">API_URL</code> di <code className="bg-amber-100 px-1 rounded">config.js</code> untuk memakai data Google Drive.
                    </div>
                  )}
                  <p>Akun Demo Tersedia:</p>
                  <div className="flex justify-center gap-3 mt-3">
                    <span className="bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">admin / admin123</span>
                    <span className="bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">staff / staff123</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // === TAMPILAN KHUSUS CETAK & PDF ===
      if (printData) {
        const { type, item } = printData;
        if (type === 'tax_report') {
          return (
            <div className="min-h-screen bg-slate-200 py-8 font-sans relative">
              {isGeneratingPDF && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white">
                  <div className="w-12 h-12 border-4 border-t-blue-500 border-white rounded-full animate-spin mb-5"></div>
                  <h2 className="text-2xl font-bold">Menyiapkan Dokumen PDF...</h2>
                </div>
              )}
              <div className="max-w-4xl mx-auto mb-6 flex justify-between items-center no-print px-4 md:px-0">
                <button onClick={() => setPrintData(null)} className="px-5 py-2.5 bg-slate-700 text-white font-semibold rounded-xl flex items-center gap-2"><IconX size={18} /> Tutup</button>
                <div className="flex gap-3">
                  <button onClick={handleDownloadPDF} className="px-6 py-2.5 bg-rose-600 text-white font-bold rounded-xl flex items-center gap-2 shadow-md"><IconDownload size={18} /> Unduh PDF</button>
                  <button onClick={() => window.print()} className="px-6 py-2.5 bg-blue-700 text-white font-bold rounded-xl flex items-center gap-2 shadow-md"><IconPrinter size={18} /> Cetak</button>
                </div>
              </div>

              <div id="print-container" className="bg-white print-area">
                <div className="max-w-4xl mx-auto p-4 text-slate-800 bg-white">
                  <div className="flex justify-between items-center border-b-[3px] border-slate-900 pb-3 mb-4">
                    <div className="w-[65%] flex items-center gap-4">
                      <img src={LOGO_URL} alt="Logo" className="w-16 h-16 object-contain shrink-0" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_FALLBACK; }} />
                      <div>
                        <h1 className="text-xl font-black text-slate-900 leading-tight">PT NURI VIRA PRATAMA</h1>
                        <p className="text-[10px] text-slate-800 font-bold uppercase tracking-wider mt-0.5">Suplier Peralatan Proteksi Kebakaran dan Sertifikasi</p>
                        <p className="text-[9px] text-slate-600 font-medium mt-1">Jln. Raya Penggilingan, Komp. Pasar Lama Komarudin, Kec. Cakung , Jakarta Timur</p>
                        <p className="text-[9px] text-slate-600 font-medium">Telp : 0856-7725-758 | Email : ptnurivirapratama@gmail.com</p>
                      </div>
                    </div>
                    <div className="w-[35%] text-right"><h2 className="text-lg font-black text-slate-300">LAPORAN SPT</h2></div>
                  </div>
                  <div className="mb-4 text-center">
                    <h3 className="font-black text-base text-slate-900">LAMPIRAN I - PENGHITUNGAN PENGHASILAN NETO KOMERSIAL</h3>
                    <p className="text-[11px] font-bold text-blue-800 mt-0.5">TAHUN PAJAK: {item.year}</p>
                  </div>
                  <table className="w-full text-left mb-4 border-collapse text-[11px]">
                    <thead className="border-y-2 border-slate-900 bg-slate-50">
                      <tr><th className="py-1.5 px-2 font-bold w-10 text-center">No.</th><th className="py-1.5 px-2 font-bold">Elemen Keuangan</th><th className="py-1.5 px-2 font-bold text-right w-48">Nominal Rupiah (Rp)</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      <tr className="avoid-break"><td className="py-2 px-2 text-center">1</td><td className="py-2 px-2 font-medium">Peredaran Usaha (Pendapatan Resmi)</td><td className="py-2 px-2 text-right font-bold text-slate-800">{formatIDR(item.pendapatan)}</td></tr>
                      <tr className="avoid-break"><td className="py-2 px-2 text-center">2</td><td className="py-2 px-2 font-medium">Harga Pokok Penjualan (HPP)</td><td className="py-2 px-2 text-right text-rose-600 font-bold">({formatIDR(item.hpp)})</td></tr>
                      <tr className="bg-slate-50 font-bold border-y-2 avoid-break"><td className="py-2 px-2 text-center">3</td><td className="py-2 px-2">Laba Bruto (1 - 2)</td><td className="py-2 px-2 text-right text-blue-700">{formatIDR(item.labaBruto)}</td></tr>
                      <tr className="avoid-break"><td className="py-2 px-2 text-center">4</td><td className="py-2 px-2 font-medium">Biaya Usaha Lainnya (Operasional)</td><td className="py-2 px-2 text-right text-rose-600 font-bold">({formatIDR(item.operasional)})</td></tr>
                      <tr className="border-y-2 border-slate-900 bg-emerald-50/50 font-bold avoid-break"><td className="py-3 px-2 text-center">5</td><td className="py-3 px-2">Penghasilan Neto Komersial (3 - 4)</td><td className={`py-3 px-2 text-right text-sm ${item.GridNeto >= 0 ? 'text-emerald-700':'text-rose-700'}`}>{formatIDR(item.GridNeto)}</td></tr>
                    </tbody>
                  </table>
                  <div className="text-[10px] text-slate-600 bg-slate-50 p-3 rounded-lg border avoid-break">
                    <p className="font-bold text-slate-800 mb-1">Informasi Tambahan:</p>
                    <p className="font-semibold">Total PPN Keluaran (11%) Terpungut: <span className="text-slate-900 font-bold text-xs ml-1">{formatIDR(item.ppn)}</span></p>
                  </div>
                  <div className="mt-8 flex justify-end avoid-break"><div className="text-center w-40 border-b border-slate-400 pb-1 text-[11px] font-bold text-slate-800 uppercase tracking-wider">Direktur Keuangan</div></div>
                </div>
              </div>
            </div>
          );
        }

        const docsToPrint = Array.isArray(item) ? item : [item];
        if (docsToPrint.length === 0) {
           return (
            <div className="min-h-screen bg-slate-100 py-8 font-sans flex flex-col items-center justify-center">
              <div className="bg-white p-10 rounded-2xl shadow-xl text-center max-w-md border border-slate-100">
                <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-5"><IconFilter size={36} className="text-slate-400" /></div>
                <h3 className="text-xl font-bold text-slate-800 tracking-tight">Data Tidak Ditemukan</h3>
                <button onClick={() => setPrintData(null)} className="mt-6 px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl w-full">Kembali</button>
              </div>
            </div>
           )
        }

        return (
          <div className="min-h-screen bg-slate-200 py-8 font-sans relative">
            {isGeneratingPDF && (
              <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white">
                <div className="w-12 h-12 border-4 border-t-blue-500 border-white rounded-full animate-spin mb-5"></div>
                <h2 className="text-2xl font-bold">Menyiapkan Dokumen PDF...</h2>
              </div>

            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 border">
                <div className="w-14 h-14 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mb-4 border border-amber-100"><IconUpload size={26} /></div>
                <h3 className="text-xl font-black text-slate-800">Pulihkan dari backup?</h3>
                <p className="text-sm text-slate-500 mt-1 break-all">{restorePreview.fileName}</p>
                <div className="grid grid-cols-2 gap-2 mt-4 text-sm">
                  {[['Penawaran', 'penawaran'], ['Invoice', 'invoices'], ['Surat Jalan', 'suratJalan'], ['Kwitansi', 'kwitansi'], ['Pengeluaran', 'expenses']].map(([label, k]) => (
                    <div key={k} className="flex justify-between bg-slate-50 border rounded-lg px-3 py-2"><span className="text-slate-500">{label}</span><b>{Array.isArray(restorePreview.data[k]) ? restorePreview.data[k].length : 0}</b></div>
                  ))}
                </div>
                <p className="text-xs text-rose-600 font-semibold mt-4">Semua data saat ini akan DIGANTI dengan isi file ini{isAPI ? ' dan disimpan ke Google Drive' : ''}. Data saat ini otomatis diunduh dulu sebagai cadangan.</p>
                <div className="flex gap-3 mt-6">
                  <button onClick={() => setRestorePreview(null)} className="flex-1 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm">Batal</button>
                  <button onClick={applyRestore} className="flex-1 py-2 bg-amber-600 text-white font-bold rounded-xl text-sm">Ganti Data</button>
                </div>
              </div>
            </div>
          )}

          <header className="bg-ink-900 border-b border-slate-800 h-16 flex items-center justify-between px-4 md:px-8 shadow-md z-30 sticky top-0">
            <div className="flex items-center gap-3">
              <img src={LOGO_URL} alt="Logo" className="w-10 h-10 object-contain bg-white rounded-md p-1 shadow-sm" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_FALLBACK; }} />
              <div>
                <h1 className="text-white text-sm font-black tracking-wider leading-tight">NURI VIRA PRATAMA</h1>
                <span className="text-red-400 text-[10px] font-bold uppercase tracking-widest">Finance & Admin</span>
              </div>
            </div>
            <div className="flex items-center gap-2 sm:gap-4">
              <button onClick={() => handleBackup()} className="flex items-center gap-1.5 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 hover:border-slate-500 px-2.5 sm:px-3 py-1.5 rounded-lg" title="Unduh backup data (JSON)">
                <IconDownload size={15}/> <span className="hidden lg:inline">Backup</span>
              </button>
              <button onClick={() => restoreInputRef.current && restoreInputRef.current.click()} className="flex items-center gap-1.5 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 hover:border-slate-500 px-2.5 sm:px-3 py-1.5 rounded-lg" title="Pulihkan data dari file backup">
                <IconUpload size={15}/> <span className="hidden lg:inline">Pulihkan</span>
              </button>
              <button onClick={onBackToSite} className="flex items-center gap-1.5 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 hover:border-slate-500 px-3 py-1.5 rounded-lg" title="Lihat Website">
                <IconGlobe size={15}/> <span className="hidden sm:inline">Website</span>
              </button>
              <div className="hidden sm:block text-right">
                <div className="flex items-center justify-end gap-2">
                  <p className="text-sm font-bold text-slate-100 leading-tight">{currentUser?.name}</p>
                  {isSyncing && <span className="text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full">Menyimpan...</span>}
                  {!isSyncing && syncError && <span className="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded-full">Belum tersimpan</span>}
                </div>
                <p className="text-xs font-medium text-slate-400">{currentUser?.username}</p>
              </div>
              <div className="w-9 h-9 bg-red-600 text-white rounded-full flex items-center justify-center font-bold border border-red-500">{currentUser?.initial}</div>
              <button onClick={handleLogout} className="text-slate-400 hover:text-rose-400 p-2 rounded-full hover:bg-slate-800" title="Keluar"><IconLogOut size={20} /></button>
            </div>
          </header>
          <div className="hazard h-1 sticky top-16 z-30"></div>

          <nav className="bg-white border-b border-slate-200 shadow-sm hidden md:flex items-center justify-center z-20 sticky top-[68px]">
            <div className="flex overflow-x-auto w-full max-w-7xl px-8 gap-2">
              <button onClick={() => setActiveTab('dashboard')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'dashboard' ? 'border-blue-600 text-blue-600 bg-blue-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconDashboard size={18}/> Dasbor Utama</button>
              <button onClick={() => setActiveTab('kalender')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'kalender' ? 'border-cyan-600 text-cyan-600 bg-cyan-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconCalendar size={18}/> Kalender Proyek</button>
              <button onClick={() => setActiveTab('penawaran')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'penawaran' ? 'border-indigo-600 text-indigo-600 bg-indigo-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconBriefcase size={18}/> Penawaran</button>
              <button onClick={() => setActiveTab('invoice')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'invoice' ? 'border-blue-600 text-blue-600 bg-blue-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconFileText size={18}/> Invoice</button>
              <button onClick={() => setActiveTab('suratjalan')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'suratjalan' ? 'border-emerald-600 text-emerald-600 bg-emerald-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconTruck size={18}/> Surat Jalan</button>
              <button onClick={() => setActiveTab('kwitansi')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'kwitansi' ? 'border-amber-600 text-amber-600 bg-amber-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconReceipt size={18}/> Kwitansi</button>
              <button onClick={() => setActiveTab('pengeluaran')} className={`flex items-center gap-2 px-4 py-3.5 border-b-2 font-bold whitespace-nowrap ${activeTab === 'pengeluaran' ? 'border-rose-600 text-rose-600 bg-rose-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconTrendingDown size={18}/> Pengeluaran</button>
            </div>
          </nav>

          <main className="flex-1 overflow-auto p-4 md:p-8 pb-24 md:pb-8">
            <div className="max-w-7xl mx-auto">
              {syncError && (
                <div className="mb-6 flex flex-col sm:flex-row sm:items-center gap-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 text-sm font-semibold">
                  <div className="flex items-start gap-3 flex-1"><IconAlertCircle size={20}/> <span>{syncError}</span></div>
                  <div className="flex gap-2">
                    {isAPI && <button onClick={() => saveToServer({ penawaran, invoices, expenses, suratJalan, kwitansi })} disabled={isSyncing} className="px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold disabled:opacity-60">{isSyncing ? 'Menyimpan...' : 'Coba simpan lagi'}</button>}
                    <button onClick={() => setSyncError('')} className="px-3 py-2 bg-white border border-rose-200 rounded-xl text-xs font-bold">Tutup</button>
                  </div>
                </div>
              )}
              {loadError && (
                <div className="mb-6 flex items-start gap-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 text-sm font-semibold">
                  <IconAlertCircle size={20}/> <span>{loadError}</span>
                </div>
              )}
              {activeTab === 'dashboard' && renderDashboard()}
              {activeTab === 'kalender' && renderKalender()}
              {activeTab === 'penawaran' && renderPenawaran()}
              {activeTab === 'invoice' && renderInvoice()}
              {activeTab === 'suratjalan' && renderSuratJalan()}
              {activeTab === 'kwitansi' && renderKwitansi()}
              {activeTab === 'pengeluaran' && renderPengeluaran()}
            </div>
          </main>

          <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex overflow-x-auto gap-2 p-2 z-40 text-[10px] font-bold shadow-[0_-4px_6px_-1px_rgb(0,0,0,0.05)] pb-[env(safe-area-inset-bottom)] custom-scrollbar">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'dashboard' ? 'text-blue-600 bg-blue-50':'text-slate-400'}`}><IconDashboard size={20}/> Dasbor</button>
            <button onClick={() => setActiveTab('kalender')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'kalender' ? 'text-cyan-600 bg-cyan-50':'text-slate-400'}`}><IconCalendar size={20}/> Kalender</button>
            <button onClick={() => setActiveTab('penawaran')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'penawaran' ? 'text-indigo-600 bg-indigo-50':'text-slate-400'}`}><IconBriefcase size={20}/> PNW</button>
            <button onClick={() => setActiveTab('invoice')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'invoice' ? 'text-blue-600 bg-blue-50':'text-slate-400'}`}><IconFileText size={20}/> INV</button>
            <button onClick={() => setActiveTab('suratjalan')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'suratjalan' ? 'text-emerald-600 bg-emerald-50':'text-slate-400'}`}><IconTruck size={20}/> SJ</button>
            <button onClick={() => setActiveTab('kwitansi')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'kwitansi' ? 'text-amber-600 bg-amber-50':'text-slate-400'}`}><IconReceipt size={20}/> KWT</button>
            <button onClick={() => setActiveTab('pengeluaran')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'pengeluaran' ? 'text-rose-600 bg-rose-50':'text-slate-400'}`}><IconTrendingDown size={20}/> Beban</button>
          </nav>
        </div>
      );
    }

    // =====================================================================
    // ROOT — Website publik + Portal dalam satu file
    // Portal tetap ter-mount setelah dibuka, supaya auto-save yang sedang
    // berjalan tidak terputus saat pengguna kembali ke website.
    // =====================================================================
    function Root() {
      const startInPortal = (window.location.hash || '').toLowerCase() === '#portal';
      const [mode, setMode] = useState(startInPortal ? 'portal' : 'site');
      const [portalMounted, setPortalMounted] = useState(startInPortal);

      const openPortal = () => { setPortalMounted(true); setMode('portal'); window.scrollTo(0, 0); };
      const backToSite = () => { setMode('site'); window.scrollTo(0, 0); };

      return (
        <>
          <div style={{ display: mode === 'site' ? 'block' : 'none' }}>
            <Website onOpenPortal={openPortal} />
          </div>
          {portalMounted && (
            <div style={{ display: mode === 'portal' ? 'block' : 'none' }}>
              <App onBackToSite={backToSite} />
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
