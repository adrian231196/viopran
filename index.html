                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <p className="text-xs text-slate-500">Lupa password karyawan? Klik ikon ubah lalu isi password baru. Perubahan menu berlaku saat akun tersebut masuk lagi.</p>
                {renderBotWa()}
              </>
            )}

            {f && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-hidden flex flex-col border border-slate-100">
                  <div className="flex justify-between items-center p-6 border-b border-slate-100 bg-slate-50/50">
                    <h3 className="text-xl font-black text-slate-800">{f.isNew ? 'Tambah Akun' : `Ubah Akun: ${f.username}`}</h3>
                    <button onClick={() => setUserForm(null)} className="p-2 text-slate-400 hover:text-slate-700 rounded-full"><IconX size={24} /></button>
                  </div>
                  <div className="p-6 overflow-y-auto space-y-5">
                    <div className="grid sm:grid-cols-2 gap-4">
                      <label className="block"><span className="block text-sm font-bold text-slate-700 mb-1">Username</span>
                        <input type="text" value={f.username} disabled={!f.isNew} autoComplete="off" placeholder="mis. gudang1" onChange={(e) => setUserForm({ ...f, username: e.target.value.toLowerCase().replace(/\s/g, '') })} className={`${inputCls} disabled:opacity-60`} /></label>
                      <label className="block"><span className="block text-sm font-bold text-slate-700 mb-1">Nama lengkap</span>
                        <input type="text" value={f.name} onChange={(e) => setUserForm({ ...f, name: e.target.value })} className={inputCls} placeholder="mis. Budi Santoso" /></label>
                      <label className="block sm:col-span-2"><span className="block text-sm font-bold text-slate-700 mb-1">No. WhatsApp <span className="font-normal text-slate-500">— untuk pesan Bot WA (boleh dikosongkan)</span></span>
                        <input type="tel" inputMode="tel" value={f.wa} onChange={(e) => setUserForm({ ...f, wa: e.target.value })} className={inputCls} placeholder="mis. 0812 3456 7890" /></label>
                    </div>
                    <div>
                      <span className="block text-sm font-bold text-slate-700 mb-2">Peran</span>
                      <div className="grid sm:grid-cols-2 gap-3">
                        {[['staff', 'Staff portal', 'Portal keuangan: hanya menu yang dicentang di bawah'], ['admin', 'Admin portal', 'Semua menu, kelola pengguna, backup & pulihkan'],
                          ['teknisi', 'Teknisi', 'Aplikasi: tugas pemeriksaan, lapor kerja, pengajuan gaji'], ['manager', 'Manager Operasional', 'Aplikasi: buat tugas, periksa gaji, pantau progres'],
                          ['direktur', 'Direktur', 'Aplikasi: bayar pengajuan, kas keluar, pantau pemeriksaan']].map(([v, l, d]) => (
                          <label key={v} className={`flex items-start gap-3 p-3 rounded-xl border cursor-pointer ${f.role === v ? 'border-red-500 bg-red-50/50' : 'border-slate-200'} ${!f.isNew && currentUser && f.username === currentUser.username && v !== 'admin' ? 'opacity-40 pointer-events-none' : ''}`}>
                            <input type="radio" name="peran" checked={f.role === v} onChange={() => setUserForm({ ...f, role: v })} className="mt-1" />
                            <span><b className="block text-sm text-slate-800">{l}</b><span className="text-xs text-slate-500">{d}</span></span>
                          </label>
                        ))}
                      </div>
                    </div>
                    {PERAN_APLIKASI.includes(f.role) && <p className="text-xs bg-blue-50 border border-blue-100 text-blue-800 rounded-xl p-3">Akun ini dipakai di aplikasi <b>NVP Operasional</b> (viopran.com/app) dan tidak bisa membuka portal keuangan. Pembayaran yang ditandai Direktur di aplikasi otomatis tercatat di menu Pengeluaran.</p>}
                    {f.role === 'staff' && (
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-sm font-bold text-slate-700">Menu yang boleh dibuka</span>
                          <span className="text-xs font-bold space-x-3"><button onClick={() => setUserForm({ ...f, menus: [...MENU_KEYS] })} className="text-blue-600 hover:underline">Pilih semua</button><button onClick={() => setUserForm({ ...f, menus: [] })} className="text-slate-500 hover:underline">Kosongkan</button></span>
                        </div>
                        <div className="grid sm:grid-cols-2 gap-2">
                          {MENU_DEF.map(([k, l, d]) => (
                            <label key={k} className={`flex items-start gap-3 p-3 rounded-xl border cursor-pointer ${f.menus.includes(k) ? 'border-slate-400 bg-slate-50' : 'border-slate-200'}`}>
                              <input type="checkbox" aria-label={l} checked={f.menus.includes(k)} onChange={(e) => setUserForm({ ...f, menus: e.target.checked ? MENU_KEYS.filter(x => x === k || f.menus.includes(x)) : f.menus.filter(x => x !== k) })} className="w-4 h-4 mt-0.5" />
                              <span><b className="block text-sm text-slate-800">{l}</b><span className="text-xs text-slate-500">{d}</span></span>
                            </label>
                          ))}
                        </div>
                        <p className="text-xs text-slate-500 mt-2">Dasbor selalu tersedia. Menu Laba Rugi, Neraca, dan Pajak hanya untuk melihat; mengubah saldo awal, aset, dan transaksi kas memerlukan menu Data Keuangan.</p>
                      </div>
                    )}
                    <div>
                      <label className="block"><span className="block text-sm font-bold text-slate-700 mb-1">{f.isNew ? 'Password (min. 8 karakter)' : 'Password baru — kosongkan jika tidak diubah'}</span>
                        <input type={f.showPw ? 'text' : 'password'} autoComplete="new-password" value={f.password} onChange={(e) => setUserForm({ ...f, password: e.target.value })} className={inputCls} /></label>
                      <label className="inline-flex items-center gap-2 mt-2 text-xs text-slate-600 cursor-pointer"><input type="checkbox" checked={f.showPw} onChange={(e) => setUserForm({ ...f, showPw: e.target.checked })} /> Tampilkan password</label>
                    </div>
                  </div>
                  <div className="p-4 border-t bg-slate-50 flex flex-wrap items-center justify-end gap-2">
                    {userMsg && <p className="text-sm text-rose-600 font-semibold mr-auto">{userMsg}</p>}
                    <button onClick={() => setUserForm(null)} className="px-4 py-2 font-bold text-slate-600 rounded-xl">Batal</button>
                    <button onClick={saveUserForm} disabled={userBusy} className="px-5 py-2 bg-red-600 text-white font-bold rounded-xl disabled:opacity-60">{userBusy ? 'Menyimpan...' : 'Simpan Akun'}</button>
                  </div>
                </div>
              </div>
            )}

            {userDel && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 text-center border">
                  <div className="w-16 h-16 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-100"><IconAlertCircle size={32} /></div>
                  <h3 className="text-xl font-black text-slate-800 mb-1">Hapus akun?</h3>
                  <p className="text-sm text-slate-500 mb-6">Akun <b>{userDel}</b> tidak bisa masuk lagi. Data dokumen yang pernah dibuatnya tetap ada.</p>
                  <div className="flex gap-3">
                    <button onClick={() => setUserDel(null)} className="flex-1 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm">Batal</button>
                    <button onClick={hapusUser} disabled={userBusy} className="flex-1 py-2 bg-rose-600 text-white font-bold rounded-xl text-sm disabled:opacity-60">Hapus</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };


      // ===================== STOK BAHAN =====================
      const renderStok = () => {
        const db = dbKeuangan();
        const H = hitungStok(db, '9999-12-31');
        const box = 'bg-white rounded-2xl border border-slate-200 shadow-sm';
        const inputCls = 'w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-400';
        const dipakai = (id) => stok.mutasi.some(m => m.itemId === id) || (expenses || []).some(e => e && e.stokItem === id) || H.mutasi.some(m => m.itemId === id);
        const tambahBarang = () => {
          const f = stokForm;
          if (f.jenis === 'tabung' && !(num(f.kapasitas) > 0)) { setFormError('Isi kapasitas tabung (mis. 3,5 atau 6).'); return; }
          if (f.jenis !== 'tabung' && stok.items.some(i => i.jenis === f.jenis)) { setFormError(`${JENIS_STOK[f.jenis].label} sudah ada di daftar.`); return; }
          if (f.jenis === 'tabung' && stok.items.some(i => i.jenis === 'tabung' && i.media === f.media && Math.abs(i.kapasitas - num(f.kapasitas)) < 1e-9)) { setFormError('Tabung dengan jenis & kapasitas itu sudah ada.'); return; }
          const nama = String(f.nama || '').trim() || (f.jenis === 'tabung' ? `Tabung APAR ${f.media === 'dcp' ? 'DCP' : 'Foam'} ${fmtQty(f.kapasitas)} ${f.media === 'dcp' ? 'kg' : 'liter'}` : JENIS_STOK[f.jenis].label);
          setFormError('');
          setStok(st => ({ ...st, items: [...st.items, { id: `STK-${Date.now().toString(36).toUpperCase()}`, nama, jenis: f.jenis, media: f.jenis === 'tabung' ? f.media : '', kapasitas: f.jenis === 'tabung' ? num(f.kapasitas) : 0 }] }));
          setStokForm({ ...stokForm, kapasitas: '', nama: '' });
        };
        const catatMutasi = () => {
          const f = mutForm;
          if (!f.tgl || !stok.items.some(i => i.id === f.itemId) || !num(f.qty)) { setFormError('Lengkapi tanggal, barang, dan jumlah.'); return; }
          if (f.tipe === 'awal' && (!(num(f.qty) > 0) || !(num(f.nilai) >= 0))) { setFormError('Stok awal: jumlah harus positif dan isi nilainya (Rp).'); return; }
          setFormError('');
          setStok(st => ({ ...st, mutasi: [...st.mutasi, { id: `MUT-${Date.now().toString(36).toUpperCase()}`, tgl: f.tgl, itemId: f.itemId, tipe: f.tipe, qty: num(f.qty), nilai: f.tipe === 'awal' ? rp(f.nilai) : 0, ket: String(f.ket || '').trim() }] }));
          setMutForm({ ...mutForm, qty: '', nilai: '', ket: '' });
        };
        const kartu = H.mutasi.filter(m => m.itemId === kartuItem);
        const itemKartu = H.items.find(i => i.id === kartuItem) || H.items[0];
        const invById = Object.fromEntries((invoices || []).filter(Boolean).map(i => [i.id, i]));
        const pemakaian = Object.entries(H.hppInvoice).map(([id, h]) => ({ inv: invById[id], h })).filter(x => x.inv).sort((a, b) => String(b.inv.date).localeCompare(String(a.inv.date)));
        const opManual = num((ledger.opening || {}).persediaan);
        return (
          <div className="space-y-6" data-testid="halaman-stok">
            <div>
              <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Stok Bahan</h2>
              <p className="text-sm text-slate-500 mt-1 max-w-3xl">Stok bertambah dari <b>Pengeluaran</b> kategori HPP yang dihubungkan ke barang stok, dan berkurang otomatis dari <b>invoice</b> yang barisnya diberi jenis pekerjaan (isi ulang / pengadaan). Harga pokok memakai rata-rata tertimbang. Nilai stok per 31 Desember otomatis menjadi persediaan akhir di laporan.</p>
            </div>
            {(H.items.some(i => i.qty < -1e-9) || H.tanpaBarang.length > 0 || (opManual > 0 && !stok.mutasi.some(m => m.tipe === 'awal'))) && (
              <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 text-sm space-y-1">
                {H.items.filter(i => i.qty < -1e-9).map(i => <div key={i.id} className="flex items-start gap-2"><IconAlertCircle size={16}/> <span><b>{i.nama}</b> minus {fmtQty(-i.qty)} {i.satuan} — pemakaian melebihi stok. Catat pembeliannya di Pengeluaran (hubungkan ke stok) atau isi stok awal.</span></div>)}
                {[...new Set(H.tanpaBarang.map(t => t.label))].map(l => <div key={l} className="flex items-start gap-2"><IconAlertCircle size={16}/> <span>Invoice memakai <b>{l}</b> yang belum ada di daftar barang — tambahkan barangnya di bawah.</span></div>)}
                {opManual > 0 && !stok.mutasi.some(m => m.tipe === 'awal') && <div className="flex items-start gap-2"><IconAlertCircle size={16}/> <span>Persediaan awal {formatIDR(Math.round(opManual))} di Data Keuangan belum dirinci sebagai <b>stok awal</b> per barang. Isi stok awal di bawah agar persediaan & HPP akurat.</span></div>}
              </div>
            )}
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3" data-testid="ringkasan-stok">
              {H.items.map(i => (
                <div key={i.id} className={`${box} p-4 ${i.qty < -1e-9 ? 'border-rose-300 bg-rose-50/40' : ''}`}>
                  <div className="text-xs font-bold text-slate-500 uppercase tracking-wider truncate" title={i.nama}>{i.nama}</div>
                  <div className={`text-2xl font-black mt-1 tabular-nums ${i.qty < -1e-9 ? 'text-rose-600' : 'text-slate-900'}`}>{fmtQty(i.qty)} <span className="text-sm font-bold text-slate-500">{i.satuan}</span></div>
                  <div className="text-xs text-slate-500 mt-1">@ {formatIDR(Math.round(i.avg))} / {i.satuan} · nilai <b className="text-slate-700">{formatIDR(Math.round(i.nilai))}</b></div>
                </div>
              ))}
              <div className="rounded-2xl shadow-sm p-4 bg-slate-900 border border-slate-900 text-white">
                <div className="text-xs font-bold text-slate-300 uppercase tracking-wider">Total nilai persediaan</div>
                <div className="text-2xl font-black mt-1 tabular-nums">{formatIDR(Math.round(H.nilai))}</div>
                <div className="text-xs text-slate-400 mt-1">stok saat ini</div>
              </div>
            </div>

            <div className="grid lg:grid-cols-2 gap-6">
              <div className={`${box} p-6`}>
                <h3 className="text-lg font-black text-slate-900">Daftar barang stok</h3>
                <p className="text-sm text-slate-500 mt-1">Tabung dibedakan per jenis (DCP/Foam) dan kapasitas.</p>
                <div className="grid sm:grid-cols-4 gap-2 mt-4 items-end">
                  <label className="block sm:col-span-2"><span className="block text-xs font-bold text-slate-600 mb-1">Jenis barang</span><select aria-label="Jenis barang stok" value={stokForm.jenis} onChange={(e) => setStokForm({ ...stokForm, jenis: e.target.value })} className={inputCls}>{Object.entries(JENIS_STOK).map(([k, v]) => <option key={k} value={k}>{v.label} ({v.satuan})</option>)}</select></label>
                  {stokForm.jenis === 'tabung' && <>
                    <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Untuk APAR</span><select aria-label="Jenis APAR tabung" value={stokForm.media} onChange={(e) => setStokForm({ ...stokForm, media: e.target.value })} className={inputCls}><option value="dcp">DCP</option><option value="foam">Foam</option></select></label>
                    <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Kapasitas ({stokForm.media === 'dcp' ? 'kg' : 'liter'})</span><input aria-label="Kapasitas tabung" type="number" min="0" step="0.5" value={stokForm.kapasitas} onChange={(e) => setStokForm({ ...stokForm, kapasitas: e.target.value })} className={inputCls} /></label>
                  </>}
                </div>
                <button onClick={tambahBarang} className="mt-3 px-4 py-2 rounded-lg text-sm font-bold bg-slate-900 text-white flex items-center gap-2"><IconPlus size={16}/> Tambah barang</button>
                <table className="w-full text-sm mt-4"><tbody className="divide-y divide-slate-100">
                  {stok.items.map(i => (
                    <tr key={i.id}><td className="py-2 font-semibold">{i.nama}</td><td className="text-xs text-slate-500">{satuanStok(i)}</td>
                      <td className="text-right">{!dipakai(i.id) && <button onClick={() => setDeleteConfirm({ type: 'stokItem', id: i.id })} className="p-1.5 text-slate-400 hover:text-red-600"><IconTrash2 size={16}/></button>}</td></tr>
                  ))}
                </tbody></table>
              </div>
              <div className={`${box} p-6`}>
                <h3 className="text-lg font-black text-slate-900">Aturan pemakaian otomatis</h3>
                <p className="text-sm text-slate-500 mt-1">Dipakai saat baris invoice diberi jenis pekerjaan. Kapasitas = berat/isi APAR per tabung.</p>
                <table className="w-full text-sm mt-3"><tbody className="divide-y divide-slate-100">
                  <tr><td className="py-2 font-bold">Isi ulang APAR DCP</td><td className="py-2 text-slate-600">DCP = kapasitas × jumlah · N2</td></tr>
                  <tr><td className="py-2 font-bold">Isi ulang APAR Foam</td><td className="py-2 text-slate-600">Foam = kapasitas × jumlah · N2</td></tr>
                  <tr><td className="py-2 font-bold">Pengadaan APAR DCP</td><td className="py-2 text-slate-600">Tabung DCP (kapasitas sama) × jumlah · DCP · N2</td></tr>
                  <tr><td className="py-2 font-bold">Pengadaan APAR Foam</td><td className="py-2 text-slate-600">Tabung Foam (kapasitas sama) × jumlah · Foam · N2</td></tr>
                </tbody></table>
                <label className="block mt-4"><span className="block text-xs font-bold text-slate-600 mb-1">1 tabung gas N2 cukup untuk berapa APAR?</span>
                  <input aria-label="Kapasitas N2" type="number" min="1" value={stok.n2Kap} onChange={(e) => setStok(st => ({ ...st, n2Kap: num(e.target.value) > 0 ? num(e.target.value) : st.n2Kap }))} className={inputCls} /></label>
                <p className="text-xs text-slate-500 mt-1">Pemakaian N2 per APAR = 1 ÷ {fmtQty(stok.n2Kap)} tabung.</p>
              </div>
            </div>

            <div className={`${box} p-6`}>
              <h3 className="text-lg font-black text-slate-900">Stok awal & penyesuaian (stock opname)</h3>
              <p className="text-sm text-slate-500 mt-1"><b>Stok awal</b>: barang yang sudah ada sebelum pencatatan (isi jumlah & nilainya) — otomatis menjadi persediaan awal pembukuan. <b>Penyesuaian</b>: selisih hasil hitung fisik (isi minus jika barang kurang/rusak, plus jika lebih).</p>
              <div className="grid sm:grid-cols-2 lg:grid-cols-6 gap-2 mt-4 items-end">
                <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Tipe</span><select aria-label="Tipe mutasi" value={mutForm.tipe} onChange={(e) => setMutForm({ ...mutForm, tipe: e.target.value })} className={inputCls}><option value="awal">Stok awal</option><option value="penyesuaian">Penyesuaian (opname)</option></select></label>
                <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Barang</span><select aria-label="Barang mutasi" value={mutForm.itemId} onChange={(e) => setMutForm({ ...mutForm, itemId: e.target.value })} className={inputCls}>{stok.items.map(i => <option key={i.id} value={i.id}>{i.nama}</option>)}</select></label>
                <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Tanggal</span><input aria-label="Tanggal mutasi" type="date" value={mutForm.tgl} onChange={(e) => setMutForm({ ...mutForm, tgl: e.target.value })} className={inputCls} /></label>
                <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Jumlah ({satuanStok(stok.items.find(i => i.id === mutForm.itemId))})</span><input aria-label="Jumlah mutasi" type="number" step="0.01" value={mutForm.qty} onChange={(e) => setMutForm({ ...mutForm, qty: e.target.value })} className={inputCls} /></label>
                {mutForm.tipe === 'awal' ? <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Nilai total (Rp)</span><input aria-label="Nilai stok awal" type="number" min="0" value={mutForm.nilai} onChange={(e) => setMutForm({ ...mutForm, nilai: e.target.value })} className={inputCls} /></label>
                  : <label className="block"><span className="block text-xs font-bold text-slate-600 mb-1">Keterangan</span><input aria-label="Keterangan mutasi" type="text" value={mutForm.ket} onChange={(e) => setMutForm({ ...mutForm, ket: e.target.value })} placeholder="mis. hasil opname" className={inputCls} /></label>}
                <button onClick={catatMutasi} className="px-4 py-2 rounded-lg text-sm font-bold bg-slate-900 text-white flex items-center justify-center gap-2"><IconPlus size={16}/> Catat</button>
              </div>
              {stok.mutasi.length > 0 && <table className="w-full text-sm mt-4 min-w-[520px]"><tbody className="divide-y divide-slate-100">
                {stok.mutasi.map(m => { const it = stok.items.find(i => i.id === m.itemId) || { nama: m.itemId }; return (
                  <tr key={m.id}><td className="py-2 tabular-nums">{m.tgl}</td><td className="font-semibold">{m.tipe === 'awal' ? 'Stok awal' : 'Penyesuaian'}</td><td>{it.nama}</td><td className="text-right tabular-nums">{m.qty > 0 ? '+' : ''}{fmtQty(m.qty)} {satuanStok(it)}</td><td className="text-right tabular-nums">{m.tipe === 'awal' ? formatIDR(m.nilai) : (m.ket || '')}</td>
                    <td className="text-right"><button onClick={() => setDeleteConfirm({ type: 'stokMutasi', id: m.id })} className="p-1.5 text-slate-400 hover:text-red-600"><IconTrash2 size={16}/></button></td></tr>
                ); })}
              </tbody></table>}
            </div>

            <div className={`${box} p-6`}>
              <div className="flex flex-wrap items-center gap-3">
                <h3 className="text-lg font-black text-slate-900">Kartu stok</h3>
                <select aria-label="Kartu stok barang" value={itemKartu ? itemKartu.id : ''} onChange={(e) => setKartuItem(e.target.value)} className="text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 font-semibold">{H.items.map(i => <option key={i.id} value={i.id}>{i.nama}</option>)}</select>
              </div>
              <div className="overflow-x-auto mt-3">
                <table className="w-full text-sm min-w-[820px]" data-testid="kartu-stok">
                  <thead><tr className="text-left text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-200"><th className="py-2">Tanggal</th><th>Keterangan</th><th className="text-right">Masuk</th><th className="text-right">Keluar</th><th className="text-right">Saldo</th><th className="text-right">Harga rata-rata</th><th className="text-right">Nilai saldo</th></tr></thead>
                  <tbody className="divide-y divide-slate-100">
                    {kartu.length === 0 ? <tr><td colSpan="7" className="py-4 text-center text-slate-400">Belum ada mutasi.</td></tr> : kartu.map((m, n) => (
                      <tr key={n}>
                        <td className="py-2 tabular-nums whitespace-nowrap">{m.tipe === 'awal' ? 'Awal' : m.tgl}</td>
                        <td>{m.tipe === 'beli' ? `Pembelian — ${m.ket}` : m.tipe === 'pakai' ? `${m.ket} (${m.ref})` : m.tipe === 'awal' ? 'Stok awal' : `Penyesuaian${m.ket ? ' — ' + m.ket : ''}`}</td>
                        <td className="text-right tabular-nums text-emerald-700">{m.masuk ? fmtQty(m.masuk) : ''}</td>
                        <td className="text-right tabular-nums text-rose-600">{m.keluar ? fmtQty(m.keluar) : ''}</td>
                        <td className={`text-right tabular-nums font-bold ${m.saldoQty < -1e-9 ? 'text-rose-600' : ''}`}>{fmtQty(m.saldoQty)} {itemKartu ? itemKartu.satuan : ''}</td>
                        <td className="text-right tabular-nums">{formatIDR(Math.round(m.avg))}</td>
                        <td className="text-right tabular-nums">{formatIDR(Math.round(m.saldoNilai))}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className={`${box} p-6`}>
              <h3 className="text-lg font-black text-slate-900">HPP bahan per invoice</h3>
              <p className="text-sm text-slate-500 mt-1">Biaya bahan yang terpakai per invoice dan laba kotornya (pendapatan sebelum PPN − HPP bahan).</p>
              <div className="overflow-x-auto mt-3">
                <table className="w-full text-sm min-w-[720px]" data-testid="hpp-invoice">
                  <thead><tr className="text-left text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-200"><th className="py-2">Invoice</th><th>Tanggal</th><th>Pelanggan</th><th className="text-right">Pendapatan</th><th className="text-right">HPP bahan</th><th className="text-right">Laba kotor</th></tr></thead>
                  <tbody className="divide-y divide-slate-100">
                    {pemakaian.length === 0 ? <tr><td colSpan="6" className="py-4 text-center text-slate-400">Belum ada invoice yang memakai stok. Pilih jenis pekerjaan pada baris invoice.</td></tr> : pemakaian.map(({ inv, h }) => { const lk = num(inv.subtotal) - h.total; return (
                      <tr key={inv.id}><td className="py-2 font-semibold text-blue-700 whitespace-nowrap">{inv.id}</td><td className="tabular-nums">{inv.date}</td><td>{inv.customer}</td>
                        <td className="text-right tabular-nums">{formatIDR(inv.subtotal)}</td><td className="text-right tabular-nums text-rose-600">{formatIDR(Math.round(h.total))}</td>
                        <td className={`text-right tabular-nums font-bold ${lk < 0 ? 'text-rose-600' : 'text-emerald-700'}`}>{formatIDR(Math.round(lk))}{num(inv.subtotal) > 0 && <span className="text-[11px] font-semibold text-slate-400"> ({Math.round(lk / num(inv.subtotal) * 100)}%)</span>}</td></tr>
                    ); })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const renderPengeluaran = () => {
        const tahunExp = Array.from(new Set((expenses || []).map(e => (e?.date || '').slice(0, 4)).filter(Boolean))).sort().reverse();
        const pilihanJenis = expFilter.category === 'all' ? [...new Set([...JENIS_BIAYA.HPP, ...JENIS_BIAYA.Operasional])] : JENIS_BIAYA[expFilter.category];
        const daftar = (expenses || []).filter(e => e
          && (expFilter.year === 'all' || (e.date || '').startsWith(expFilter.year))
          && (expFilter.category === 'all' || (expFilter.category === 'HPP' ? e.category === 'HPP' : e.category !== 'HPP'))
          && (expFilter.jenis === 'all' || (e.jenis || JENIS_KOSONG) === expFilter.jenis));
        const totalDaftar = daftar.reduce((a, e) => a + num(e.amount), 0);
        const rekap = rekapJenis(daftar);
        const selCls = 'text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 font-semibold outline-none cursor-pointer';
        return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div><h2 className="text-2xl font-bold text-slate-800 tracking-tight">Catatan Pengeluaran</h2></div>
            <button onClick={() => openNewModal('expense')} className="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-lg font-semibold flex items-center gap-2"><IconPlus size={20} /> Catat Beban</button>
          </div>
          <div className="flex flex-wrap items-center gap-2 p-3 bg-white border border-slate-200 rounded-2xl shadow-sm">
            <IconFilter size={16} />
            <select aria-label="Filter tahun" value={expFilter.year} onChange={(e) => setExpFilter({ ...expFilter, year: e.target.value })} className={selCls}>
              <option value="all">Semua tahun</option>{tahunExp.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
            <select aria-label="Filter kategori" value={expFilter.category} onChange={(e) => setExpFilter({ ...expFilter, category: e.target.value, jenis: 'all' })} className={selCls}>
              <option value="all">Semua kategori</option><option value="Operasional">Beban operasional</option><option value="HPP">Pembelian (HPP)</option>
            </select>
            <select aria-label="Filter jenis biaya" value={expFilter.jenis} onChange={(e) => setExpFilter({ ...expFilter, jenis: e.target.value })} className={selCls}>
              <option value="all">Semua jenis biaya</option>{pilihanJenis.map(j => <option key={j} value={j}>{j}</option>)}<option value={JENIS_KOSONG}>{JENIS_KOSONG}</option>
            </select>
            <span className="ml-auto text-sm text-slate-500">{daftar.length} catatan · <b className="text-rose-600 tabular-nums">{formatIDR(totalDaftar)}</b></span>
          </div>
          {(() => {
            const tl = (expenses || []).filter(e => e && ['talangan', 'campuran'].includes(e.paymentStatus) && expTalanganNominal(e) > 0);
            if (!tl.length) return null;
            const gross = (e) => expTalanganNominal(e);
            const per = {};
            tl.forEach(e => { const k = String(e.talanganDari || '').trim() || 'Pihak ketiga (tanpa nama)'; const t = per[k] = per[k] || { nama: k, sisa: 0, kembali: 0, items: [] }; if (e.paidDate) t.kembali += gross(e); else { t.sisa += gross(e); t.items.push(e); } });
            const daftarPihak = Object.values(per).sort((a, b) => b.sisa - a.sisa);
            const totalSisa = daftarPihak.reduce((a, t) => a + t.sisa, 0);
            return (
              <div className="bg-white rounded-2xl border border-violet-200 shadow-sm p-5" data-testid="panel-talangan">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <h3 className="text-sm font-black text-violet-900 uppercase tracking-wider">Dana talangan pihak ketiga</h3>
                    <p className="text-xs text-slate-500 mt-1 max-w-xl">Pengeluaran PT yang dibayar dulu oleh pihak lain. Uang PT di bank belum berkurang; PT masih berutang sebesar sisa di bawah. Saat PT mengganti, catat tanggal pengembaliannya.</p>
                  </div>
                  <div className="text-right"><div className="text-[11px] font-bold text-slate-500 uppercase">Belum dikembalikan</div><div className="text-xl font-black text-violet-700 tabular-nums">{formatIDR(totalSisa)}</div></div>
                </div>
                <div className="flex flex-wrap items-center gap-2 mt-3 text-sm"><label className="font-semibold text-slate-600" htmlFor="tglKembali">Tanggal pengembalian:</label><input id="tglKembali" type="date" value={tglKembali} onChange={(e) => setTglKembali(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-sm" />
                  <label className="font-semibold text-slate-600 ml-2" htmlFor="kasKembali">dibayar dari:</label><select id="kasKembali" value={kasKembali} onChange={(e) => setKasKembali(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-semibold">{Object.entries(AKUN_KAS).map(([k, a]) => <option key={k} value={k}>{namaKas(k)}</option>)}</select></div>
                <div className="mt-3 divide-y divide-slate-100">
                  {daftarPihak.map(t => (
                    <div key={t.nama} className="py-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div><b className="text-slate-800">{t.nama}</b><span className="text-xs text-slate-500 ml-2">sisa <b className="text-violet-700 tabular-nums">{formatIDR(t.sisa)}</b>{t.kembali > 0 && <> · sudah dikembalikan {formatIDR(t.kembali)}</>}</span></div>
                        {t.items.length > 1 && <button onClick={() => kembalikanTalangan(t.items.map(e => e.id), tglKembali, kasKembali)} className="px-3 py-1.5 rounded-lg text-xs font-bold bg-violet-600 text-white">Kembalikan semua ({formatIDR(t.sisa)})</button>}
                      </div>
                      {t.items.length > 0 && <div className="mt-2 space-y-1">{t.items.map(e => (
                        <div key={e.id} className="flex flex-wrap items-center gap-2 text-xs bg-slate-50 rounded-lg px-3 py-2">
                          <span className="text-slate-500 tabular-nums">{e.date}</span><span className="flex-1 min-w-[140px] font-semibold text-slate-700">{e.desc}</span><span className="font-bold tabular-nums">{formatIDR(gross(e))}</span>
                          <button onClick={() => kembalikanTalangan([e.id], tglKembali, kasKembali)} className="px-2.5 py-1 rounded-md font-bold border border-violet-300 text-violet-700 hover:bg-violet-50">Tandai dikembalikan</button>
                        </div>))}</div>}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
          {rekap.length > 0 && (
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
              <h3 className="text-sm font-black text-slate-800 uppercase tracking-wider mb-3">Rekap per jenis biaya</h3>
              <div className="grid sm:grid-cols-2 gap-x-8 gap-y-2">
                {rekap.map(([j, v]) => (
                  <button key={j} onClick={() => setExpFilter({ ...expFilter, jenis: expFilter.jenis === j ? 'all' : j })} className={`text-left group ${expFilter.jenis === j ? 'opacity-100' : ''}`} title="Klik untuk menyaring">
                    <div className="flex justify-between text-sm"><span className={`font-semibold ${j === JENIS_KOSONG ? 'text-amber-700' : 'text-slate-700'} group-hover:underline`}>{j}</span><span className="tabular-nums font-bold text-slate-800">{formatIDR(v)}</span></div>
                    <div className="h-1.5 bg-slate-100 rounded-full mt-1"><div className={`h-1.5 rounded-full ${j === JENIS_KOSONG ? 'bg-amber-400' : 'bg-rose-500'}`} style={{ width: `${totalDaftar ? Math.max(2, v / totalDaftar * 100) : 0}%` }}></div></div>
                  </button>
                ))}
              </div>
              {rekap.some(([j]) => j === JENIS_KOSONG) && <p className="text-xs text-amber-700 mt-3">Catatan lama belum punya jenis biaya — buka Edit pada catatan tersebut dan pilih jenisnya.</p>}
            </div>
          )}
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden overflow-x-auto">
            <table className="w-full text-left min-w-[600px]">
              <thead className="bg-slate-50 border-b border-slate-200 text-slate-600">
                <tr>
                  <th className="px-6 py-4 text-xs font-bold uppercase">No. Ref</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase">Tanggal</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase">Deskripsi</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase">Kategori / Jenis biaya</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase text-right">Nominal Beban</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase text-right">PPN Masukan</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase">Pembayaran</th>
                  <th className="px-6 py-4 text-xs font-bold uppercase text-center">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {daftar.length === 0 ? (
                    <tr><td colSpan="8" className="px-6 py-8 text-center text-slate-500 font-medium">{(expenses || []).length ? 'Tidak ada pengeluaran yang cocok dengan filter.' : 'Belum ada pengeluaran tercatat.'}</td></tr>
                ) : daftar.map((exp) => (
                  <tr key={exp?.id || Math.random()} className="hover:bg-slate-50/80 transition-colors group">
                    <td className="px-6 py-4 font-semibold text-slate-500 text-sm">{exp?.id}</td>
                    <td className="px-6 py-4 text-slate-600 text-sm font-medium">{exp?.date}</td>
                    <td className="px-6 py-4 text-slate-800 text-sm font-medium">{exp?.desc}</td>
                    <td className="px-6 py-4">
                      <span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${exp?.category === 'HPP' ? 'bg-orange-50 border-orange-100 text-orange-700':'bg-purple-50 border-purple-100 text-purple-700'}`}>{exp?.category === 'HPP' ? 'Pembelian (HPP)' : 'Operasional'}</span>
                      {exp?.nonDeductible && <span className="ml-1.5 px-2 py-1 rounded-md text-[10px] font-bold border bg-slate-100 border-slate-200 text-slate-600" title="Tidak dapat dikurangkan secara pajak (koreksi fiskal positif)">Non-deductible</span>}
                      <span className={`block mt-1.5 text-xs font-semibold ${exp?.jenis ? 'text-slate-500' : 'text-amber-600'}`}>{exp?.jenis || JENIS_KOSONG}</span>
                      {exp?.sumber === 'NVP Operasional' && <span className="inline-block mt-1.5 px-2 py-0.5 rounded-md text-[10px] font-bold border bg-blue-50 border-blue-100 text-blue-700" title="Dicatat otomatis saat Direktur membayar di aplikasi">Dari aplikasi NVP Operasional</span>}
                      {exp?.buktiUrl && <a href={exp.buktiUrl} target="_blank" rel="noopener" className="block mt-1 text-[11px] font-bold text-blue-700 underline">Lihat bukti bayar</a>}
                      {exp?.stokItem && num(exp?.stokQty) > 0 && (() => { const it = stok.items.find(i => i.id === exp.stokItem); return it ? <span className="block mt-1 text-[11px] font-bold text-orange-700">→ stok: +{fmtQty(exp.stokQty)} {satuanStok(it)} {it.nama}</span> : null; })()}
                    </td>
                    <td className="px-6 py-4 text-right font-bold text-rose-600">{formatIDR(exp?.amount)}</td>
                    <td className="px-6 py-4 text-right text-sm text-slate-600">{num(exp?.ppnMasukan) ? formatIDR(exp.ppnMasukan) : '—'}</td>
                    <td className="px-6 py-4">
                      {exp?.paymentStatus === 'campuran'
                        ? <><span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${exp?.paidDate ? 'bg-slate-50 border-slate-200 text-slate-600' : 'bg-sky-50 border-sky-200 text-sky-700'}`}>Kas + talangan</span>
                            <span className="block mt-1 text-[11px] font-semibold text-slate-500 whitespace-nowrap">{AKUN_KAS[expAkunLangsung(exp)].label} {formatIDR(expKasLangsung(exp))}</span>
                            <span className="block text-[11px] font-semibold text-violet-700 whitespace-nowrap">Talangan {formatIDR(expTalanganNominal(exp))} · {exp?.talanganDari}{exp?.paidDate ? ` · dikembalikan ${exp.paidDate}` : ''}</span></>
                        : exp?.paymentStatus === 'talangan'
                        ? <><span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${exp?.paidDate ? 'bg-slate-50 border-slate-200 text-slate-600' : 'bg-violet-50 border-violet-200 text-violet-700'}`}>{exp?.paidDate ? 'Talangan dikembalikan' : 'Dana talangan'}</span>
                            <span className="block mt-1 text-[11px] font-semibold text-slate-500">{exp?.talanganDari}{exp?.paidDate ? ` · ${exp.paidDate} · dari ${AKUN_KAS[expAkun(exp)].label}` : ''}</span></>
                        : exp?.paymentStatus === 'utang' && !exp?.paidDate
                        ? <span className="px-2.5 py-1 rounded-md text-xs font-bold bg-amber-50 border border-amber-200 text-amber-700">Utang</span>
                        : <><span className="px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-50 border border-emerald-100 text-emerald-700">Lunas</span><span className="block mt-1 text-[11px] font-semibold text-slate-500 whitespace-nowrap">{AKUN_KAS[expAkun(exp)].label}</span></>}
                    </td>
                    <td className="px-6 py-4 text-center">
                      <div className="flex items-center justify-center gap-1.5 md:opacity-0 md:group-hover:opacity-100">
                        {exp?.sumber === 'NVP Operasional' ? <span className="text-[10px] font-bold text-slate-400" title="Diubah lewat aplikasi NVP Operasional">Terkunci</span> : <>
                        <button onClick={() => handleEdit('expense', exp)} className="p-1.5 text-slate-400 hover:text-amber-500"><IconEdit size={18}/></button>
                        <button onClick={() => setDeleteConfirm({type: 'expense', id: exp?.id})} className="p-1.5 text-slate-400 hover:text-red-600"><IconTrash2 size={18}/></button></>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Modal Beban */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-hidden flex flex-col border border-slate-100">
                <div className="flex justify-between items-center p-6 border-b border-slate-100 bg-slate-50/50">
                  <h3 className="text-xl font-bold text-slate-800">{editingId ? 'Edit Pengeluaran' : 'Catat Pengeluaran Baru'}</h3>
                  <button onClick={() => setExpenseModalOpen(false)} className="p-2 text-slate-400 hover:text-slate-700 rounded-full"><IconX size={24} /></button>
                </div>
                <div className="p-6 space-y-4 bg-white overflow-y-auto">
                  <div><label className="block text-sm font-semibold text-slate-700 mb-1">Tanggal</label><input type="date" value={expenseForm.date} onChange={(e) => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none" /></div>
                  <div><label className="block text-sm font-semibold text-slate-700 mb-1">Deskripsi Beban</label><input type="text" value={expenseForm.desc} onChange={(e) => setExpenseForm({...expenseForm, desc: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none" /></div>
                  <div><label className="block text-sm font-semibold text-slate-700 mb-1">Kategori Akuntansi</label><select value={expenseForm.category} onChange={(e) => setExpenseForm({...expenseForm, category: e.target.value, jenis: ''})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none font-medium cursor-pointer"><option value="Operasional">Beban Operasional (gaji, sewa, listrik, transport, dll.)</option><option value="HPP">Pembelian Barang/Bahan untuk Dijual (HPP)</option></select></div>
                  <div><label htmlFor="jenisBiaya" className="block text-sm font-semibold text-slate-700 mb-1">Jenis Biaya</label><select id="jenisBiaya" value={expenseForm.jenis || ''} onChange={(e) => setExpenseForm({...expenseForm, jenis: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none font-medium cursor-pointer"><option value="">— Pilih jenis biaya —</option>{JENIS_BIAYA[expenseForm.category === 'HPP' ? 'HPP' : 'Operasional'].map(j => <option key={j} value={j}>{j}</option>)}</select></div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-sm font-semibold text-slate-700 mb-1">Nominal (Rp)</label><input type="number" min="0" value={expenseForm.amount} onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none" /></div>
                    <div><label className="block text-sm font-semibold text-slate-700 mb-1">PPN Masukan (Rp)</label><input type="number" min="0" value={expenseForm.ppnMasukan || 0} onChange={(e) => setExpenseForm({...expenseForm, ppnMasukan: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none" /></div>
                  </div>
                  <p className="text-xs text-slate-500 -mt-2">Nominal = harga <b>sebelum PPN</b>. Isi PPN Masukan hanya jika ada faktur pajak dari pemasok (dapat dikreditkan).</p>
                  {expenseForm.category === 'HPP' && (() => { const it = stok.items.find(i => i.id === expenseForm.stokItem); return (
                    <div className="bg-orange-50 border border-orange-200 rounded-xl p-3 space-y-2" data-testid="masuk-stok">
                      <div className="grid grid-cols-2 gap-3">
                        <label className="block"><span className="block text-xs font-semibold text-slate-700 mb-1">Masuk ke stok bahan</span><select aria-label="Masuk ke stok" value={expenseForm.stokItem || ''} onChange={(e) => setExpenseForm({...expenseForm, stokItem: e.target.value})} className="w-full bg-white border rounded-xl px-3 py-2 text-sm outline-none cursor-pointer"><option value="">Tidak masuk stok (langsung jadi HPP)</option>{stok.items.map(i => <option key={i.id} value={i.id}>{i.nama}</option>)}</select></label>
                        {it && <label className="block"><span className="block text-xs font-semibold text-slate-700 mb-1">Jumlah ({satuanStok(it)})</span><input type="number" min="0" step="0.01" aria-label="Jumlah masuk stok" value={expenseForm.stokQty} onChange={(e) => setExpenseForm({...expenseForm, stokQty: e.target.value})} className="w-full bg-white border rounded-xl px-3 py-2 text-sm outline-none" /></label>}
                      </div>
                      {it && num(expenseForm.stokQty) > 0 && <p className="text-xs text-orange-900">Harga per {satuanStok(it)}: <b>{formatIDR(rp(expenseForm.amount) / num(expenseForm.stokQty))}</b> (nominal sebelum PPN ÷ jumlah)</p>}
                    </div>
                  ); })()}
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-sm font-semibold text-slate-700 mb-1">Pembayaran</label><select aria-label="Sumber pembayaran" value={expenseForm.paymentStatus === 'lunas' || !expenseForm.paymentStatus ? 'lunas:' + akunAman(expenseForm.akunKas) : expenseForm.paymentStatus} onChange={(e) => { const [st, ak] = e.target.value.split(':'); setExpenseForm({...expenseForm, paymentStatus: st, akunKas: ak || akunAman(expenseForm.akunKas)}); }} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none cursor-pointer"><option value="lunas:tunai">Lunas — dari Kas Tunai</option><option value="lunas:bank">Lunas — dari Kas Bank</option><option value="campuran">Sebagian dari kas + sebagian dana talangan</option><option value="utang">Belum dibayar (utang ke pemasok)</option><option value="talangan">Seluruhnya dana talangan pihak ketiga (otomatis jadi utang)</option></select></div>
                    {['utang', 'talangan', 'campuran'].includes(expenseForm.paymentStatus) && expenseForm.paidDate && <div className="col-span-2 -mt-1"><label className="block text-sm font-semibold text-slate-700 mb-1">{expenseForm.paymentStatus === 'utang' ? 'Dilunasi dari' : 'Dana talangan dikembalikan dari'}</label><select aria-label="Dibayar dari kas" value={akunAman(expenseForm.akunKas)} onChange={(e) => setExpenseForm({...expenseForm, akunKas: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none cursor-pointer">{Object.entries(AKUN_KAS).map(([k, a]) => <option key={k} value={k}>{namaKas(k)}</option>)}</select></div>}
                    {expenseForm.paymentStatus === 'utang' && <div><label className="block text-sm font-semibold text-slate-700 mb-1">Tanggal Pelunasan</label><input type="date" value={expenseForm.paidDate || ''} onChange={(e) => setExpenseForm({...expenseForm, paidDate: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none" /></div>}
                    {['talangan', 'campuran'].includes(expenseForm.paymentStatus) && <div><label className="block text-sm font-semibold text-slate-700 mb-1">Talangan dikembalikan tgl</label><input type="date" aria-label="Tanggal dikembalikan" value={expenseForm.paidDate || ''} onChange={(e) => setExpenseForm({...expenseForm, paidDate: e.target.value})} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none" /></div>}
                  </div>
                  {expenseForm.paymentStatus === 'campuran' && (() => {
                    const total = rp(expenseForm.amount) + rp(expenseForm.ppnMasukan), dariKas = rp(expenseForm.bayarKas), dariTalangan = Math.max(0, total - dariKas);
                    return (
                      <div className="bg-sky-50 border border-sky-200 rounded-xl p-3 space-y-2 -mt-1" data-testid="bayar-campuran">
                        <p className="text-sm font-bold text-slate-800">Total dibayar {formatIDR(total)} <span className="font-medium text-slate-500">(nominal + PPN masukan)</span></p>
                        <div className="grid grid-cols-2 gap-3">
                          <label className="block"><span className="block text-xs font-semibold text-slate-700 mb-1">Dari kas</span><select aria-label="Kas yang dipakai" value={akunAman(expenseForm.akunKasLangsung)} onChange={(e) => setExpenseForm({...expenseForm, akunKasLangsung: e.target.value})} className="w-full bg-white border rounded-xl px-3 py-2 text-sm outline-none cursor-pointer">{Object.keys(AKUN_KAS).map(k => <option key={k} value={k}>{namaKas(k)}</option>)}</select></label>
                          <label className="block"><span className="block text-xs font-semibold text-slate-700 mb-1">Nominal dari kas (Rp)</span><input type="number" min="0" aria-label="Nominal dari kas" value={expenseForm.bayarKas} onChange={(e) => setExpenseForm({...expenseForm, bayarKas: e.target.value})} className="w-full bg-white border rounded-xl px-3 py-2 text-sm outline-none" /></label>
                        </div>
                        <div className="flex justify-between text-sm bg-white border border-violet-200 rounded-lg px-3 py-2"><span className="font-semibold text-violet-800">Sisa dari dana talangan (jadi utang)</span><b className="tabular-nums text-violet-800" data-testid="sisa-talangan">{formatIDR(dariTalangan)}</b></div>
                      </div>
                    );
                  })()}
                  {['talangan', 'campuran'].includes(expenseForm.paymentStatus) && (
                    <div className="bg-violet-50 border border-violet-200 rounded-xl p-3 space-y-2 -mt-1">
                      <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Nama pihak ketiga yang membayar</span>
                        <input type="text" list="daftarPihakTalangan" placeholder="mis. CV Mitra Jaya / Bapak Andi" value={expenseForm.talanganDari || ''} onChange={(e) => setExpenseForm({...expenseForm, talanganDari: e.target.value})} className="w-full bg-white border rounded-xl px-4 py-2 text-sm outline-none" /></label>
                      <datalist id="daftarPihakTalangan">{[...new Set((expenses || []).filter(x => x && ['talangan', 'campuran'].includes(x.paymentStatus) && x.talanganDari).map(x => x.talanganDari))].map(n => <option key={n} value={n} />)}</datalist>
                      <p className="text-xs text-violet-900">Beban tetap masuk laba rugi penuh. Bagian yang ditalangi <b>tidak mengurangi kas PT</b> dan dicatat sebagai <b>utang dana talangan</b> kepada pihak ini sampai dikembalikan. Kosongkan tanggal dikembalikan jika belum diganti.</p>
                    </div>
                  )}
                  <label className="flex items-start gap-3 bg-slate-50 border rounded-xl p-3 cursor-pointer">
                    <input type="checkbox" checked={!!expenseForm.nonDeductible} onChange={(e) => setExpenseForm({...expenseForm, nonDeductible: e.target.checked})} className="w-4 h-4 mt-0.5" />
                    <span className="text-xs text-slate-600"><b className="text-slate-800 block text-sm">Tidak dapat dikurangkan secara pajak</b>Contoh: sumbangan, sanksi/denda pajak, biaya pribadi, jamuan tanpa daftar nominatif. Tetap tercatat di laba rugi, tetapi dikoreksi positif di perhitungan PPh.</span>
                  </label>
                </div>
                <div className="p-6 border-t bg-slate-50 flex flex-wrap items-center justify-end gap-2">
                  {formError && <p className="text-sm text-rose-600 font-semibold mr-auto">{formError}</p>}
                  <button onClick={() => setExpenseModalOpen(false)} className="px-4 py-2 font-bold text-slate-600 rounded-xl">Batal</button>
                  <button onClick={handleSaveExpense} className="px-6 py-2 bg-rose-600 text-white font-bold rounded-xl">Simpan Beban</button>
                </div>
              </div>
            </div>
          )}
        </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#f8fafc] flex flex-col font-sans relative">
          {deleteConfirm && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 text-center border">
                <div className="w-16 h-16 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-100"><IconAlertCircle size={32} /></div>
                <h3 className="text-xl font-black text-slate-800 mb-1">Hapus Data?</h3>
                <p className="text-sm text-slate-500 mb-6">Data akan dihapus permanen. Nomor dokumen lain tidak berubah.{deleteConfirm.type === 'invoice' && (() => {
                  const linked = [...(suratJalan || []), ...(kwitansi || [])].filter(d => d && d.invoiceId === deleteConfirm.id).map(d => d.id);
                  return linked.length ? <span className="block mt-2 text-rose-600 font-semibold">Ikut terhapus: {linked.join(', ')}</span> : null;
                })()}</p>
                <div className="flex gap-3">
                  <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm">Batal</button>
                  <button onClick={executeDelete} className="flex-1 py-2 bg-rose-600 text-white font-bold rounded-xl text-sm">Hapus</button>
                </div>
              </div>
            </div>
          )}

          {pwForm && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 border">
                <h3 className="text-xl font-black text-slate-800">Ganti password</h3>
                <p className="text-sm text-slate-500 mt-1">Akun: <b>{currentUser?.username}</b></p>
                {pwForm.done ? (
                  <>
                    <p className="mt-4 text-sm bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3">Password berhasil diganti. Gunakan password baru saat masuk berikutnya.</p>
                    <button onClick={() => setPwForm(null)} className="mt-5 w-full py-2 bg-slate-900 text-white font-bold rounded-xl text-sm">Tutup</button>
                  </>
                ) : (
                  <>
                    <div className="space-y-3 mt-4">
                      {[['old', 'Password lama'], ['new1', 'Password baru (min. 8 karakter)'], ['new2', 'Ulangi password baru']].map(([k, l]) => (
                        <label key={k} className="block"><span className="block text-xs font-bold text-slate-600 mb-1">{l}</span>
                          <input type="password" autoComplete={k === 'old' ? 'current-password' : 'new-password'} value={pwForm[k]} onChange={(e) => setPwForm({ ...pwForm, [k]: e.target.value, msg: '' })} className="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-500" /></label>
                      ))}
                    </div>
                    {pwForm.msg && <p className="mt-3 text-sm text-rose-600 font-semibold">{pwForm.msg}</p>}
                    <div className="flex gap-3 mt-5">
                      <button onClick={() => setPwForm(null)} className="flex-1 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm">Batal</button>
                      <button onClick={submitPassword} disabled={pwForm.busy} className="flex-1 py-2 bg-red-600 text-white font-bold rounded-xl text-sm disabled:opacity-60">{pwForm.busy ? 'Menyimpan...' : 'Simpan'}</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          <input ref={restoreInputRef} type="file" accept="application/json,.json" className="hidden" onChange={handleRestoreFile} />
          {restorePreview && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 border">
                <div className="w-14 h-14 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mb-4 border border-amber-100"><IconUpload size={26} /></div>
                <h3 className="text-xl font-black text-slate-800">Pulihkan dari backup?</h3>
                <p className="text-sm text-slate-500 mt-1 break-all">{restorePreview.fileName}</p>
                <div className="grid grid-cols-2 gap-2 mt-4 text-sm">
                  {[['Penawaran', 'penawaran'], ['Invoice', 'invoices'], ['Surat Jalan', 'suratJalan'], ['Kwitansi', 'kwitansi'], ['Pengeluaran', 'expenses']].map(([label, k]) => (
                    <div key={k} className="flex justify-between bg-slate-50 border rounded-lg px-3 py-2"><span className="text-slate-500">{label}</span><b>{Array.isArray(restorePreview.data[k]) ? restorePreview.data[k].length : 0}</b></div>
                  ))}
                </div>
                <p className="text-xs text-rose-600 font-semibold mt-4">Semua data saat ini akan DIGANTI dengan isi file ini{isAPI ? ' dan disimpan ke Google Drive' : ''}. Data saat ini otomatis diunduh dulu sebagai cadangan.</p>
                <div className="flex gap-3 mt-6">
                  <button onClick={() => setRestorePreview(null)} className="flex-1 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm">Batal</button>
                  <button onClick={applyRestore} className="flex-1 py-2 bg-amber-600 text-white font-bold rounded-xl text-sm">Ganti Data</button>
                </div>
              </div>
            </div>
          )}

          <header className="bg-ink-900 border-b border-slate-800 h-16 flex items-center justify-between px-4 md:px-8 shadow-md z-30 sticky top-0">
            <div className="flex items-center gap-3">
              <img src={LOGO_URL} alt="Logo" className="w-10 h-10 object-contain bg-white rounded-md p-1 shadow-sm" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_FALLBACK; }} />
              <div>
                <h1 className="text-white text-sm font-black tracking-wider leading-tight">NURI VIRA PRATAMA</h1>
                <span className="text-red-400 text-[10px] font-bold uppercase tracking-widest">Finance & Admin</span>
              </div>
            </div>
            <div className="flex items-center gap-2 sm:gap-4">
              {isAdmin && <>
              <button onClick={() => handleBackup()} className="flex items-center gap-1.5 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 hover:border-slate-500 px-2.5 sm:px-3 py-1.5 rounded-lg" title="Unduh backup data (JSON)">
                <IconDownload size={15}/> <span className="hidden lg:inline">Backup</span>
              </button>
              <button onClick={() => restoreInputRef.current && restoreInputRef.current.click()} className="flex items-center gap-1.5 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 hover:border-slate-500 px-2.5 sm:px-3 py-1.5 rounded-lg" title="Pulihkan data dari file backup">
                <IconUpload size={15}/> <span className="hidden lg:inline">Pulihkan</span>
              </button>
              </>}
              <button onClick={onBackToSite} className="flex items-center gap-1.5 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 hover:border-slate-500 px-3 py-1.5 rounded-lg" title="Lihat Website">
                <IconGlobe size={15}/> <span className="hidden sm:inline">Website</span>
              </button>
              <div className="hidden sm:block text-right">
                <div className="flex items-center justify-end gap-2">
                  <p className="text-sm font-bold text-slate-100 leading-tight">{currentUser?.name}</p>
                  {isSyncing && <span className="text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full">Menyimpan...</span>}
                  {!isSyncing && syncError && <span className="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded-full">Belum tersimpan</span>}
                </div>
                <p className="text-xs font-medium text-slate-400">{currentUser?.username} · {isAdmin ? 'Admin' : 'Staff'}{isAPI && <> · <button onClick={() => setPwForm({ old: '', new1: '', new2: '', msg: '' })} className="underline hover:text-white">Ganti password</button></>}</p>
              </div>
              <div className="w-9 h-9 bg-red-600 text-white rounded-full flex items-center justify-center font-bold border border-red-500">{currentUser?.initial}</div>
              <button onClick={handleLogout} className="text-slate-400 hover:text-rose-400 p-2 rounded-full hover:bg-slate-800" title="Keluar"><IconLogOut size={20} /></button>
            </div>
          </header>
          <div className="hazard h-1 sticky top-16 z-30"></div>

          <nav className="bg-white border-b border-slate-200 shadow-sm hidden md:flex items-center justify-center z-20 sticky top-[68px]">
            <div className="flex overflow-x-auto w-full max-w-screen-2xl px-4 gap-1">
              <button onClick={() => setActiveTab('dashboard')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'dashboard' ? 'border-blue-600 text-blue-600 bg-blue-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconDashboard size={18}/> Dasbor</button>
              {can('kalender') && <button onClick={() => setActiveTab('kalender')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'kalender' ? 'border-cyan-600 text-cyan-600 bg-cyan-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconCalendar size={18}/> Kalender</button>}
              {can('penawaran') && <button onClick={() => setActiveTab('penawaran')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'penawaran' ? 'border-indigo-600 text-indigo-600 bg-indigo-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconBriefcase size={18}/> Penawaran</button>}
              {can('invoice') && <button onClick={() => setActiveTab('invoice')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'invoice' ? 'border-blue-600 text-blue-600 bg-blue-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconFileText size={18}/> Invoice</button>}
              {can('suratjalan') && <button onClick={() => setActiveTab('suratjalan')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'suratjalan' ? 'border-emerald-600 text-emerald-600 bg-emerald-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconTruck size={18}/> Surat Jalan</button>}
              {can('kwitansi') && <button onClick={() => setActiveTab('kwitansi')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'kwitansi' ? 'border-amber-600 text-amber-600 bg-amber-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconReceipt size={18}/> Kwitansi</button>}
              {can('pengeluaran') && <button onClick={() => setActiveTab('pengeluaran')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'pengeluaran' ? 'border-rose-600 text-rose-600 bg-rose-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconTrendingDown size={18}/> Pengeluaran</button>}
              {can('stok') && <button onClick={() => setActiveTab('stok')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'stok' ? 'border-orange-600 text-orange-600 bg-orange-50/50':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconBox size={18}/> Stok Bahan</button>}
              {MENU_LAPORAN.some(can) && <>
                <span className="w-px bg-slate-200 my-2 mx-1 shrink-0"></span>
                {[['labarugi', 'Laba Rugi', IconBarChart2], ['neraca', 'Neraca', IconLandmark], ['pajak', 'Pajak', IconCalculator], ['bukubesar', 'Buku Besar', IconBook], ['datakeu', 'Data Keuangan', IconClipboard]].filter(([k]) => can(k)).map(([k, l, Ic]) => (
                  <button key={k} onClick={() => setActiveTab(k)} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === k ? 'border-slate-900 text-slate-900 bg-slate-100':'border-transparent text-slate-500 hover:bg-slate-50'}`}><Ic size={18}/> {l}</button>
                ))}
              </>}
              {isAdmin && <button onClick={() => setActiveTab('pengguna')} className={`flex items-center gap-2 px-3 py-3.5 border-b-2 text-sm font-bold whitespace-nowrap ${activeTab === 'pengguna' ? 'border-red-600 text-red-700 bg-red-50/60':'border-transparent text-slate-500 hover:bg-slate-50'}`}><IconUser size={18}/> Pengguna</button>}
            </div>
          </nav>

          <main className="flex-1 overflow-auto p-4 md:p-8 pb-24 md:pb-8">
            <div className="max-w-7xl mx-auto">
              {syncError && (
                <div className="mb-6 flex flex-col sm:flex-row sm:items-center gap-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 text-sm font-semibold">
                  <div className="flex items-start gap-3 flex-1"><IconAlertCircle size={20}/> <span>{syncError}</span></div>
                  <div className="flex gap-2">
                    {isAPI && <button onClick={() => saveToServer({ penawaran, invoices, expenses, suratJalan, kwitansi, assets, cashTx, ledger, stok })} disabled={isSyncing} className="px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold disabled:opacity-60">{isSyncing ? 'Menyimpan...' : 'Coba simpan lagi'}</button>}
                    <button onClick={() => setSyncError('')} className="px-3 py-2 bg-white border border-rose-200 rounded-xl text-xs font-bold">Tutup</button>
                  </div>
                </div>
              )}
              {loadError && (
                <div className="mb-6 flex items-start gap-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 text-sm font-semibold">
                  <IconAlertCircle size={20}/> <span>{loadError}</span>
                </div>
              )}
              {activeTab === 'dashboard' && renderDashboard()}
              {activeTab === 'kalender' && can('kalender') && renderKalender()}
              {activeTab === 'penawaran' && can('penawaran') && renderPenawaran()}
              {activeTab === 'invoice' && can('invoice') && renderInvoice()}
              {activeTab === 'suratjalan' && can('suratjalan') && renderSuratJalan()}
              {activeTab === 'kwitansi' && can('kwitansi') && renderKwitansi()}
              {activeTab === 'pengeluaran' && can('pengeluaran') && renderPengeluaran()}
              {activeTab === 'stok' && can('stok') && renderStok()}
              {MENU_LAPORAN.includes(activeTab) && can(activeTab) && renderLaporan()}
              {activeTab === 'pengguna' && isAdmin && renderPengguna()}
            </div>
          </main>

          <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex overflow-x-auto gap-2 p-2 z-40 text-[10px] font-bold shadow-[0_-4px_6px_-1px_rgb(0,0,0,0.05)] pb-[env(safe-area-inset-bottom)] custom-scrollbar">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'dashboard' ? 'text-blue-600 bg-blue-50':'text-slate-400'}`}><IconDashboard size={20}/> Dasbor</button>
            {can('kalender') && <button onClick={() => setActiveTab('kalender')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'kalender' ? 'text-cyan-600 bg-cyan-50':'text-slate-400'}`}><IconCalendar size={20}/> Kalender</button>}
            {can('penawaran') && <button onClick={() => setActiveTab('penawaran')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'penawaran' ? 'text-indigo-600 bg-indigo-50':'text-slate-400'}`}><IconBriefcase size={20}/> PNW</button>}
            {can('invoice') && <button onClick={() => setActiveTab('invoice')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'invoice' ? 'text-blue-600 bg-blue-50':'text-slate-400'}`}><IconFileText size={20}/> INV</button>}
            {can('suratjalan') && <button onClick={() => setActiveTab('suratjalan')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'suratjalan' ? 'text-emerald-600 bg-emerald-50':'text-slate-400'}`}><IconTruck size={20}/> SJ</button>}
            {can('kwitansi') && <button onClick={() => setActiveTab('kwitansi')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'kwitansi' ? 'text-amber-600 bg-amber-50':'text-slate-400'}`}><IconReceipt size={20}/> KWT</button>}
            {can('pengeluaran') && <button onClick={() => setActiveTab('pengeluaran')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'pengeluaran' ? 'text-rose-600 bg-rose-50':'text-slate-400'}`}><IconTrendingDown size={20}/> Beban</button>}
            {can('stok') && <button onClick={() => setActiveTab('stok')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl ${activeTab === 'stok' ? 'text-orange-600 bg-orange-50':'text-slate-400'}`}><IconBox size={20}/> Stok</button>}
            {[['labarugi', 'Laba Rugi', IconBarChart2], ['neraca', 'Neraca', IconLandmark], ['pajak', 'Pajak', IconCalculator], ['bukubesar', 'Buku Besar', IconBook], ['datakeu', 'Data Keu', IconClipboard]].filter(([k]) => can(k)).map(([k, l, Ic]) => (
              <button key={k} onClick={() => setActiveTab(k)} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl whitespace-nowrap ${activeTab === k ? 'text-slate-900 bg-slate-100':'text-slate-400'}`}><Ic size={20}/> {l}</button>
            ))}
            {isAdmin && <button onClick={() => setActiveTab('pengguna')} className={`flex flex-col items-center justify-center min-w-[70px] gap-1.5 p-2 rounded-xl whitespace-nowrap ${activeTab === 'pengguna' ? 'text-red-700 bg-red-50':'text-slate-400'}`}><IconUser size={20}/> Pengguna</button>}
          </nav>
        </div>
      );
    }

    // =====================================================================
    // ROOT — Website publik + Portal dalam satu file
    // Portal tetap ter-mount setelah dibuka, supaya auto-save yang sedang
    // berjalan tidak terputus saat pengguna kembali ke website.
    // =====================================================================
    function Root() {
      const startInPortal = (window.location.hash || '').toLowerCase() === '#portal';
      const [mode, setMode] = useState(startInPortal ? 'portal' : 'site');
      const [portalMounted, setPortalMounted] = useState(startInPortal);

      const openPortal = () => { setPortalMounted(true); setMode('portal'); window.scrollTo(0, 0); };
      const backToSite = () => { setMode('site'); window.scrollTo(0, 0); };

      return (
        <>
          <div style={{ display: mode === 'site' ? 'block' : 'none' }}>
            <Website onOpenPortal={openPortal} />
          </div>
          {portalMounted && (
            <div style={{ display: mode === 'portal' ? 'block' : 'none' }}>
              <App onBackToSite={backToSite} />
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
