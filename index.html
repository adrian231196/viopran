      // --- LOGIC FUNCTIONS ---
      const validUsers = [
        { username: 'admin', password: 'admin123', name: 'Administrator', initial: 'A', role: 'admin' },
        { username: 'staff', password: 'staff123', name: 'Staff Finance', initial: 'S', role: 'staff', menus: STAFF_DEFAULT_MENUS }
      ];
      // Admin: semua menu. Staff: dokumen & pengeluaran saja (laporan keuangan, saldo awal, backup/pulihkan tertutup).
      const isAdmin = !!currentUser && (currentUser.role ? currentUser.role === 'admin' : currentUser.username === 'admin');
      const MENU_LAPORAN = ['labarugi', 'neraca', 'pajak', 'bukubesar', 'datakeu'];
      const userMenus = !currentUser ? [] : (isAdmin ? MENU_KEYS : (Array.isArray(currentUser.menus) ? currentUser.menus : STAFF_DEFAULT_MENUS));
      const can = (k) => k === 'dashboard' || userMenus.includes(k);

      // --- Kelola pengguna (hanya admin, lewat server) ---
      const pesanServer = (r) => {
        const e = r && r.error;
        if (e === 'AUTH') return 'Sesi tidak berlaku (password akun Anda berubah). Keluar lalu masuk lagi.';
        if (e === 'ACTION_TIDAK_DIKENAL') return 'Server belum diperbarui — pasang Api.gs terbaru di Apps Script lalu buat Versi baru pada deployment.';
        if (e === 'TIDAK_DIIZINKAN') return 'Hanya admin yang dapat mengelola pengguna.';
        return e || 'Respon server tidak valid.';
      };
      const userApi = async (payload) => {
        setUserBusy(true); setUserMsg('');
        try {
          const r = await callApi({ ...payload, ...apiCredsRef.current });
          if (!r || !r.ok) { setUserMsg(pesanServer(r)); return false; }
          if (r.users) setUserList(r.users);
          return true;
        } catch (err) {
          setUserMsg('Koneksi ke server terputus sesaat (' + err.message + '). Klik "Muat daftar akun" untuk mencoba lagi.');
          return false;
        } finally { setUserBusy(false); }
      };
      useEffect(() => {
        if (activeTab === 'pengguna' && isAPI && isAdmin && userList === null && !userBusy) userApi({ action: 'listUsers' });
        if (activeTab === 'pengguna' && isAPI && isAdmin && waInfo === null && !waBusy) waApi({ action: 'waGet' });
      }, [activeTab, isAdmin]);
      const waApi = async (payload, sukses) => {
        setWaBusy(true); if (payload.action !== 'waGet') setWaMsg(null);
        try {
          const r = await callApi({ ...payload, ...apiCredsRef.current });
          if (r && r.wa) setWaInfo(r.wa);
          if (!r || !r.ok) { setWaMsg({ ok: false, text: pesanServer(r) }); if (!r || !r.wa) setWaInfo(w => w || false); return false; }
          if (sukses) setWaMsg({ ok: true, text: sukses });
          return true;
        } catch (err) {
          setWaInfo(w => w || false);
          setWaMsg({ ok: false, text: 'Koneksi ke server terputus sesaat (' + err.message + '). Coba lagi.' });
          return false;
        } finally { setWaBusy(false); }
      };
      const fmtWa = (n) => { const d = String(n || ''); return d.startsWith('62') ? '0' + d.slice(2) : d; };

      const openUserForm = (u) => {
        setUserMsg(''); setUserNotice('');
        setUserForm(u
          ? { isNew: false, username: u.username, name: u.name || '', role: u.role, menus: u.role === 'admin' ? [...STAFF_DEFAULT_MENUS] : [...(u.menus || [])], password: '', showPw: false, wa: fmtWa(u.wa) }
          : { isNew: true, username: '', name: '', role: 'staff', menus: [...STAFF_DEFAULT_MENUS], password: '', showPw: false, wa: '' });
      };
      const saveUserForm = async () => {
        const f = userForm;
        const username = f.username.trim().toLowerCase();
        if (!/^[a-z0-9._-]{3,30}$/.test(username)) { setUserMsg('Username 3–30 karakter: huruf kecil, angka, titik, - atau _ (tanpa spasi).'); return; }
        if (!f.name.trim()) { setUserMsg('Nama wajib diisi.'); return; }
        if ((f.isNew || f.password) && f.password.length < 8) { setUserMsg('Password minimal 8 karakter.'); return; }
        if (f.role === 'staff' && !f.menus.length) { setUserMsg('Centang minimal satu menu.'); return; }
        const waDigit = String(f.wa || '').replace(/\D/g, '');
        if (waDigit && !/^(0|62|8)\d{8,13}$/.test(waDigit)) { setUserMsg('Nomor WhatsApp tidak valid (contoh: 0812 3456 7890).'); return; }
        const ok = await userApi({ action: 'saveUser', isNew: f.isNew, user: { username, name: f.name.trim(), role: f.role, menus: f.role === 'staff' ? f.menus : [], password: f.password || '', wa: f.wa || '' } });
        if (!ok) return;
        const diriSendiri = currentUser && username === currentUser.username;
        if (diriSendiri && f.password) apiCredsRef.current = { ...apiCredsRef.current, password: f.password };
        setUserForm(null);
        setUserNotice(`Akun "${username}" tersimpan.${f.password && !f.isNew ? ' Password baru langsung berlaku.' : ''}${!f.isNew ? ' Perubahan menu berlaku saat akun tersebut masuk lagi.' : ''}`);
      };
      const hapusUser = async () => {
        const target = userDel;
        const ok = await userApi({ action: 'deleteUser', target });
        setUserDel(null);
        if (ok) setUserNotice(`Akun "${target}" dihapus.`);
      };
      const submitPassword = async () => {
        const f = pwForm;
        if (!apiCredsRef.current || f.old !== apiCredsRef.current.password) { setPwForm({ ...f, msg: 'Password lama salah.' }); return; }
        if (f.new1.length < 8) { setPwForm({ ...f, msg: 'Password baru minimal 8 karakter.' }); return; }
        if (f.new1 !== f.new2) { setPwForm({ ...f, msg: 'Ulangi password baru tidak sama.' }); return; }
        setPwForm({ ...f, busy: true, msg: '' });
        try {
          const r = await callApi({ action: 'changePassword', ...apiCredsRef.current, newPassword: f.new1 });
          if (!r || !r.ok) { setPwForm({ ...f, busy: false, msg: pesanServer(r) }); return; }
          apiCredsRef.current = { ...apiCredsRef.current, password: f.new1 };
          setPwForm({ ...f, busy: false, done: true, msg: '' });
        } catch (err) {
          setPwForm({ ...f, busy: false, msg: 'Tidak dapat terhubung ke server: ' + err.message });
        }
      };

      const loginViaApi = async () => {
        setIsLoggingIn(true); setLoginError('');
        const creds = { username: loginFormState.username.trim(), password: loginFormState.password };
        try {
          const r = await callApi({ action: 'load', ...creds });
          if (!r || !r.ok) {
            setLoginError(r && r.error === 'AUTH' ? 'Username atau password salah!' : r && r.error === 'AKUN_APLIKASI' ? 'Akun ini untuk aplikasi NVP Operasional — buka viopran.com/app di HP.' : 'Server: ' + ((r && r.error) || 'respon tidak valid'));
            return;
          }
          let data = {};
          if (r.data) {
            try { data = typeof r.data === 'string' ? JSON.parse(r.data) : r.data; }
            catch (e) { setLoginError('Data di Google Drive tidak dapat dibaca. Hubungi admin.'); return; }
          }
          lastSavedRef.current = JSON.stringify(normalizeDb(data));
          applyLoadedData(data);
          apiCredsRef.current = creds;
          saveAllowedRef.current = true;
          setLoadError(''); setSyncError('');
          const u = r.user || {};
          const uname = u.username || creds.username;
          setCurrentUser({ username: uname, name: u.name || uname, initial: u.initial || (uname[0] || '?').toUpperCase(), role: u.role || (uname === 'admin' ? 'admin' : 'staff'), menus: Array.isArray(u.menus) ? u.menus : undefined });
          authFailedRef.current = false;
          setActiveTab('dashboard');
          setIsLoggedIn(true);
        } catch (err) {
          setLoginError('Tidak dapat terhubung ke server data. Periksa koneksi internet dan API_URL di config.js.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (isAPI) { loginViaApi(); return; }
        const user = validUsers.find(
          u => u.username === loginFormState.username && u.password === loginFormState.password
        );
        if (user) { setIsLoggedIn(true); setCurrentUser(user); setLoginError(''); setActiveTab('dashboard'); }
        else { setLoginError('Username atau password salah!'); }
      };

      const handleLogout = async () => {
        if (isAPI && apiCredsRef.current) {
          // Simpan dulu perubahan yang belum terkirim, baru kosongkan data dari memori browser.
          const pending = { penawaran, invoices, expenses, suratJalan, kwitansi, assets, cashTx, ledger, stok };
          if (saveAllowedRef.current && JSON.stringify(pending) !== lastSavedRef.current) {
            const ok = await saveToServer(pending);
            if (!ok && !authFailedRef.current) return; // tetap login agar data tidak hilang
          }
          saveAllowedRef.current = false;
          apiCredsRef.current = null;
          lastSavedRef.current = null;
          setPenawaran([]); setInvoices([]); setExpenses([]); setSuratJalan([]); setKwitansi([]);
          setAssets([]); setCashTx([]); setLedger(normalizeLedger(null));
          setActiveTab('dashboard');
        }
        setActiveTab('dashboard');
        setUserList(null); setUserForm(null); setUserDel(null); setPwForm(null); setUserMsg(''); setUserNotice('');
        setWaInfo(null); setWaMsg(null); setWaForm({ token: '', target: '' });
        setIsLoggedIn(false); setCurrentUser(null); setLoginFormState({ username: '', password: '' });
      };

      const executeDelete = () => {
        if (!deleteConfirm) return;
        const { type, id } = deleteConfirm;
        // Nomor dokumen lain TIDAK digeser — nomor yang dihapus menjadi celah (jejak audit tetap utuh)
        if (type === 'penawaran') setPenawaran((penawaran||[]).filter(i => i?.id !== id));
        else if (type === 'invoice') {
          setInvoices((invoices||[]).filter(i => i?.id !== id));
          if ((suratJalan||[]).some(d => d?.invoiceId === id)) setSuratJalan((suratJalan||[]).filter(d => d?.invoiceId !== id));
          if ((kwitansi||[]).some(d => d?.invoiceId === id)) setKwitansi((kwitansi||[]).filter(d => d?.invoiceId !== id));
        }
        else if (type === 'sj') setSuratJalan((suratJalan||[]).filter(i => i?.id !== id));
        else if (type === 'kwitansi') setKwitansi((kwitansi||[]).filter(i => i?.id !== id));
        else if (type === 'expense') setExpenses((expenses||[]).filter(i => i?.id !== id));
        else if (type === 'asset') setAssets((assets||[]).filter(i => i?.id !== id));
        else if (type === 'cashTx') setCashTx((cashTx||[]).filter(i => i?.id !== id));
        else if (type === 'stokItem') setStok(st => ({ ...st, items: st.items.filter(i => i.id !== id) }));
        else if (type === 'stokMutasi') setStok(st => ({ ...st, mutasi: st.mutasi.filter(m => m.id !== id) }));
        setDeleteConfirm(null);
      };

      const handleEdit = (type, item) => {
        setFormError('');
        setEditingId(item.id);
        if (type === 'penawaran') { setPenawaranForm({...emptyPenawaranForm, ...item, items: item.items||[]}); setPenawaranModalOpen(true); }
        else if (type === 'invoice') { setInvoiceForm({...emptyInvoiceForm, ...item, bayarKe: invRek(item), pphJenis: item.pphJenis || '', pphNominal: item.pphJenis ? String(item.pphPotong || '') : '', items: item.items||[]}); setInvoiceModalOpen(true); }
        else if (type === 'sj') { setSjForm({...emptySjForm, ...item, items: item.items||[]}); setSJModalOpen(true); }
        else if (type === 'kwitansi') { setKwitansiForm({...emptyKwitansiForm, ...item}); setKwitansiModalOpen(true); }
        else if (type === 'expense') { setExpenseForm({...emptyExpenseForm, ...item, akunKas: akunAman(item.akunKas)}); setExpenseModalOpen(true); }
      };

      const openNewModal = (type) => {
        setFormError('');
        setEditingId(null);
        if (type === 'penawaran') { setPenawaranForm(emptyPenawaranForm); setPenawaranModalOpen(true); }
        else if (type === 'invoice') { setInvoiceForm(emptyInvoiceForm); setInvoiceModalOpen(true); }
        else if (type === 'sj') { setSjForm(emptySjForm); setSJModalOpen(true); }
        else if (type === 'kwitansi') { setKwitansiForm(emptyKwitansiForm); setKwitansiModalOpen(true); }
        else if (type === 'expense') { setExpenseForm(emptyExpenseForm); setExpenseModalOpen(true); }
      };

      // Hitung nilai dokumen penjualan: PPN = 12% × DPP nilai lain (11/12), dibulatkan ke rupiah
      const hitungNilaiDokumen = (form) => {
        const subtotal = (form.items||[]).reduce((sum, item) => sum + (num(item?.qty) * num(item?.price)), 0);
        if (form.usePpn) return hitungPPN(subtotal);
        return { subtotal: rp(subtotal), dppNilaiLain: 0, ppn: 0, total: rp(subtotal) };
      };
      const validasiItem = (form, label) => {
        if (!form.date) return `Tanggal ${label} wajib diisi.`;
        if (!String(form.customer || '').trim()) return 'Nama pelanggan wajib diisi.';
        const items = (form.items || []).filter(it => String(it?.desc || '').trim());
        if (!items.length) return 'Tambahkan minimal satu baris barang/jasa.';
        if (items.some(it => !(num(it.qty) > 0) || num(it.price) < 0)) return 'Qty harus lebih dari 0 dan harga tidak boleh negatif.';
        return '';
      };

      const handleSavePenawaran = () => {
        const err = validasiItem(penawaranForm, 'penawaran'); if (err) { setFormError(err); return; }
        const completeItem = { ...penawaranForm, items: (penawaranForm.items||[]).filter(it => String(it?.desc || '').trim()), ...hitungNilaiDokumen(penawaranForm) };
        const id = editingId ? keepOrRenumber(penawaran, 'PNW', true, editingId, completeItem) : nextDocNumber(penawaran, 'PNW', true, completeItem);
        const newArray = editingId ? (penawaran||[]).map(p => p?.id === editingId ? { ...completeItem, id } : p) : [...(penawaran||[]), { ...completeItem, id }];
        setPenawaran(sortByDateDesc(newArray));
        setPenawaranModalOpen(false);
      };

      const handleSaveInvoice = () => {
        const err = validasiItem(invoiceForm, 'invoice'); if (err) { setFormError(err); return; }
        if (invoiceForm.paidDate && invoiceForm.paidDate < invoiceForm.date) { setFormError('Tanggal pelunasan tidak boleh sebelum tanggal invoice.'); return; }
        if (!REKENING[invoiceForm.bayarKe]) { setFormError('Pilih rekening pembayaran (BCA atau Bank DKI).'); return; }
        if ((invoiceForm.items || []).some(it => it && String(it.desc || '').trim() && KERJA[it.kerja] && !(num(it.kap) > 0))) { setFormError('Isi kapasitas APAR (kg/liter per tabung) pada baris yang memakai stok.'); return; }
        const completeItem = { ...invoiceForm, items: (invoiceForm.items||[]).filter(it => String(it?.desc || '').trim()), ...hitungNilaiDokumen(invoiceForm) };
        delete completeItem.rekManual;
        completeItem.ppnDipungut = !!(completeItem.usePpn && invoiceForm.ppnDipungut);
        const jenisPph = PPH_POTONG[invoiceForm.pphJenis] ? invoiceForm.pphJenis : '';
        const pphAuto = jenisPph ? Math.floor(num(completeItem.subtotal) * PPH_POTONG[jenisPph].tarif) : 0;
        const pphIsi = String(invoiceForm.pphNominal ?? '') !== '' ? rp(invoiceForm.pphNominal) : pphAuto;
        if (jenisPph && !(pphIsi > 0)) { setFormError('Isi nominal PPh yang dipotong pembeli.'); return; }
        completeItem.pphJenis = jenisPph; completeItem.pphPotong = jenisPph ? pphIsi : 0;
        delete completeItem.pphNominal;
        const id = editingId ? keepOrRenumber(invoices, 'INV', true, editingId, completeItem) : nextDocNumber(invoices, 'INV', true, completeItem);
        const inv = editingId ? { ...completeItem, id } : { ...completeItem, id, autoDocs: true };
        const newArray = editingId ? (invoices||[]).map(i => i?.id === editingId ? inv : i) : [...(invoices||[]), inv];
        setInvoices(sortByDateDesc(newArray));
        // Invoice baru: surat jalan dibuat otomatis; kwitansi dibuat saat invoice lunas.
        const r = syncInvoiceDocs(inv, editingId, suratJalan, kwitansi, { createSJ: !editingId, createKwt: !!inv.autoDocs });
        if (r.changedSJ) setSuratJalan(r.sj);
        if (r.changedKW) setKwitansi(r.kw);
        setInvoiceModalOpen(false);
      };
      // Buat surat jalan / kwitansi untuk invoice yang belum punya (mis. invoice lama)
      const buatDokumenDariInvoice = (inv, jenis) => {
        const r = syncInvoiceDocs(inv, null, suratJalan, kwitansi, { createSJ: jenis === 'sj', createKwt: jenis === 'kwt' });
        if (r.changedSJ) setSuratJalan(r.sj);
        if (r.changedKW) setKwitansi(r.kw);
      };

      const markInvoicePaid = (inv, date) => {
        const upd = { ...inv, paidDate: date ? maxDate(inv.date, date) : '' };
        setInvoices((invoices||[]).map(i => i?.id === inv.id ? upd : i));
        const r = syncInvoiceDocs(upd, inv.id, suratJalan, kwitansi, { createKwt: !!upd.autoDocs });
        if (r.changedSJ) setSuratJalan(r.sj);
        if (r.changedKW) setKwitansi(r.kw);
      };
      const bulkMarkPaid = (until) => {
        if (!until) return;
        setInvoices((invoices||[]).map(i => (i && i.date && !i.paidDate && i.date <= until) ? { ...i, paidDate: i.date } : i));
      };

      const handleSaveSJ = () => {
        if (!sjForm.date) { setFormError('Tanggal pengiriman wajib diisi.'); return; }
        const id = editingId ? keepOrRenumber(suratJalan, 'SJ', false, editingId, sjForm) : nextDocNumber(suratJalan, 'SJ', false, sjForm);
        const newArray = editingId ? (suratJalan||[]).map(s => s?.id === editingId ? { ...sjForm, id } : s) : [...(suratJalan||[]), { ...sjForm, id }];
        setSuratJalan(sortByDateDesc(newArray));
        setSJModalOpen(false);
      };

      const handleSaveKwitansi = () => {
        if (!kwitansiForm.date) { setFormError('Tanggal kwitansi wajib diisi.'); return; }
        if (!(num(kwitansiForm.amount) > 0)) { setFormError('Jumlah uang harus lebih dari 0.'); return; }
        const completeItem = { ...kwitansiForm, amount: rp(kwitansiForm.amount) };
        const id = editingId ? keepOrRenumber(kwitansi, 'KWT', false, editingId, completeItem) : nextDocNumber(kwitansi, 'KWT', false, completeItem);
        const newArray = editingId ? (kwitansi||[]).map(k => k?.id === editingId ? { ...completeItem, id } : k) : [...(kwitansi||[]), { ...completeItem, id }];
        setKwitansi(sortByDateDesc(newArray));
        setKwitansiModalOpen(false);
      };

      const handleSaveExpense = () => {
        if (!expenseForm.date) { setFormError('Tanggal wajib diisi.'); return; }
        if (!String(expenseForm.desc || '').trim()) { setFormError('Deskripsi beban wajib diisi.'); return; }
        if (!(num(expenseForm.amount) > 0)) { setFormError('Nominal harus lebih dari 0.'); return; }
        if (!(JENIS_BIAYA[expenseForm.category === 'HPP' ? 'HPP' : 'Operasional'] || []).includes(expenseForm.jenis)) { setFormError('Pilih jenis biaya.'); return; }
        if (num(expenseForm.ppnMasukan) < 0) { setFormError('PPN masukan tidak boleh negatif.'); return; }
        const kStok = expenseForm.category === 'HPP' && stok.items.some(i => i.id === expenseForm.stokItem) ? expenseForm.stokItem : '';
        if (kStok && !(num(expenseForm.stokQty) > 0)) { setFormError('Isi jumlah barang yang masuk ke stok.'); return; }
        const status = ['utang', 'talangan', 'campuran'].includes(expenseForm.paymentStatus) ? expenseForm.paymentStatus : 'lunas';
        const belumDariKas = status !== 'lunas';
        const adaTalangan = status === 'talangan' || status === 'campuran';
        const totalBayar = rp(expenseForm.amount) + rp(expenseForm.ppnMasukan);
        if (status === 'campuran' && !(rp(expenseForm.bayarKas) > 0 && rp(expenseForm.bayarKas) < totalBayar)) { setFormError(`Isi nominal dari kas: lebih dari 0 dan kurang dari total ${formatIDR(totalBayar)}. Jika seluruhnya dari kas, pilih "Lunas".`); return; }
        if (adaTalangan && !String(expenseForm.talanganDari || '').trim()) { setFormError('Isi nama pihak ketiga yang menalangi pembayaran.'); return; }
        if (belumDariKas && expenseForm.paidDate && expenseForm.paidDate < expenseForm.date) { setFormError(status === 'talangan' ? 'Tanggal pengembalian tidak boleh sebelum tanggal beban.' : 'Tanggal pelunasan tidak boleh sebelum tanggal beban.'); return; }
        const completeItem = { ...expenseForm, amount: rp(expenseForm.amount), ppnMasukan: rp(expenseForm.ppnMasukan), paymentStatus: status, paidDate: belumDariKas ? (expenseForm.paidDate || '') : '',
          talanganDari: adaTalangan ? String(expenseForm.talanganDari).trim().slice(0, 80) : '', akunKas: akunAman(expenseForm.akunKas),
          stokItem: kStok, stokQty: kStok ? num(expenseForm.stokQty) : 0, bayarKas: status === 'campuran' ? rp(expenseForm.bayarKas) : 0, akunKasLangsung: status === 'campuran' ? akunAman(expenseForm.akunKasLangsung) : '', nonDeductible: !!expenseForm.nonDeductible };
        if (editingId) { setExpenses(sortByDateDesc((expenses||[]).map(e => e?.id === editingId ? { ...completeItem, id: e.id } : e))); }
        else {
          const newId = `EXP-${Date.now().toString(36).toUpperCase()}`;   // unik (dulu acak 4 digit, bisa bentrok)
          setExpenses(sortByDateDesc([{ ...completeItem, id: newId }, ...(expenses||[])]));
        }
        setExpenseModalOpen(false);
      };

      // Aset tetap & transaksi kas lain
      const handleAddAsset = () => {
        if (!assetForm.date || !String(assetForm.name).trim() || !(num(assetForm.cost) > 0)) { setFormError('Lengkapi tanggal perolehan, nama aset, dan harga perolehan.'); return; }
        setFormError('');
        setAssets(sortByDateDesc([...(assets||[]), { ...assetForm, cost: rp(assetForm.cost), id: `AST-${Date.now().toString(36).toUpperCase()}` }]));
        setAssetForm(emptyAssetForm);
      };
      const handleAddCash = () => {
        if (!cashForm.date || !JENIS_KAS[cashForm.type] || !(num(cashForm.amount) > 0)) { setFormError('Lengkapi tanggal, jenis, dan jumlah transaksi kas.'); return; }
        setFormError('');
        setCashTx(sortByDateDesc([...(cashTx||[]), { ...cashForm, amount: rp(cashForm.amount), id: `KAS-${Date.now().toString(36).toUpperCase()}` }]));
        setCashForm(emptyCashForm);
      };
      const setOpening = (k, v) => setLedger(l => ({ ...l, opening: { ...l.opening, [k]: num(v) } }));
      const setSaldoBank = (y, akun, v) => setLedger(l => {
        const sb = { ...(l.saldoBank || {}) };
        const o = { ...(sb[y] || {}) };
        if (v === '' || v === null) delete o[akun]; else o[akun] = num(v);
        if (Object.keys(o).length) sb[y] = o; else delete sb[y];
        return { ...l, saldoBank: sb };
      });
      // Pengembalian dana talangan ke pihak ketiga (kas PT berkurang pada tanggal ini)
      const kembalikanTalangan = (ids, tgl, akun) => {
        if (!tgl) return;
        setExpenses(sortByDateDesc((expenses || []).map(e => e && ids.includes(e.id) ? { ...e, paidDate: maxDate(e.date, tgl), akunKas: akunAman(akun) } : e)));
      };
      const setClosingInventory = (y, v) => setLedger(l => {
        const ci = { ...l.closingInventory };
        if (v === '' || v === null) delete ci[y]; else ci[y] = num(v);
        return { ...l, closingInventory: ci };
      });

      const handlePrintAllPenawaran = (downloadPdf = false) => {
        let filtered = penawaran || [];
        if (filterPrintPnw === 'ppn') filtered = filtered.filter(p => p?.usePpn);
        if (filterPrintPnw === 'non_ppn') filtered = filtered.filter(p => p && !p.usePpn);
        setPrintData({ type: 'penawaran', item: filtered, autoDownload: downloadPdf });
      };

      const handlePrintAllInvoice = (downloadPdf = false) => {
        let filtered = invoices || [];
        if (filterPrintInv === 'ppn') filtered = filtered.filter(i => i?.usePpn);
        if (filterPrintInv === 'non_ppn') filtered = filtered.filter(i => i && !i.usePpn);
        setPrintData({ type: 'invoice', item: filtered, autoDownload: downloadPdf });
      };

      // --- BACKUP & PULIHKAN DATA (file JSON) ---
      const handleBackup = (label) => {
        const data = { penawaran, invoices, expenses, suratJalan, kwitansi, assets, cashTx, ledger, stok };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nvp-backup-${new Date().toISOString().slice(0, 10)}${typeof label === 'string' ? '-' + label : ''}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      const handleRestoreFile = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const d = JSON.parse(reader.result);
            const keys = ['penawaran', 'invoices', 'expenses', 'suratJalan', 'kwitansi'];
            if (!d || !keys.some(k => Array.isArray(d[k]))) throw new Error('format');
            setRestorePreview({ fileName: file.name, data: d });
          } catch (err) {
            setSyncError('File tidak valid. Pilih file backup JSON dari portal ini (berisi penawaran, invoices, expenses, suratJalan, kwitansi).');
          }
        };
        reader.readAsText(file);
      };

      const applyRestore = () => {
        if (!restorePreview) return;
        const d = restorePreview.data;
        const arr = (x) => Array.isArray(x) ? x : [];
        handleBackup('sebelum-pulihkan'); // cadangan otomatis data saat ini
        setPenawaran(arr(d.penawaran)); setInvoices(arr(d.invoices)); setExpenses(arr(d.expenses));
        setSuratJalan(arr(d.suratJalan)); setKwitansi(arr(d.kwitansi));
        setAssets(arr(d.assets)); setCashTx(arr(d.cashTx)); setLedger(normalizeLedger(d.ledger)); setStok(normalizeStok(d.stok));
        saveAllowedRef.current = true;
        setLoadError('');
        setRestorePreview(null);
      };

      // --- EARLY RETURNS (Tampilan Layar Tunggal) ---
      if (!isDataLoaded) {
        return (
          <div className="min-h-screen bg-[#f8fafc] flex flex-col items-center justify-center p-4 font-sans text-slate-800">
             <div className="w-12 h-12 border-4 border-t-red-600 border-slate-200 rounded-full animate-spin mb-5"></div>
             <h2 className="text-xl font-bold tracking-tight">Terhubung ke Google Drive...</h2>
             <p className="text-sm text-slate-500 mt-2 font-medium">Sinkronisasi data sistem keuangan PT Nuri Vira Pratama.</p>
          </div>
        );
      }

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen hero-bg relative flex items-center justify-center p-4 font-sans">
            <div className="absolute inset-0 grid-lines pointer-events-none"></div>
            <button onClick={onBackToSite} className="absolute top-5 left-5 flex items-center gap-2 text-slate-300 hover:text-white text-sm font-bold bg-white/5 border border-white/10 px-4 py-2 rounded-xl">
              <IconChevronLeft size={16}/> Kembali ke Website
            </button>
            <div className="relative bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
              <div className="text-center mb-8">
                <div className="w-24 h-24 bg-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-sm border border-slate-100">
                  <img src={LOGO_URL} alt="Logo" className="w-16 h-16 object-contain" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_FALLBACK; }} />
                </div>
                <h1 className="text-2xl font-black text-slate-800 tracking-tight leading-tight">PT NURI VIRA PRATAMA</h1>
                <p className="text-red-600 font-bold text-[10px] tracking-[0.25em] uppercase mt-2">Finance & Admin Portal</p>
              </div>
              {loginError && (
                <div className="bg-rose-50 text-rose-600 px-4 py-3 rounded-xl text-sm mb-6 border border-rose-100 flex items-center justify-center font-medium">
                  {loginError}
                </div>
              )}
              <form onSubmit={handleLogin} className="space-y-5">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">Username</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><IconUser size={18} /></div>
                    <input type="text" required value={loginFormState.username} onChange={(e) => setLoginFormState({...loginFormState, username: e.target.value})} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500 outline-none" placeholder="Masukkan username" />
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">Password</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><IconLock size={18} /></div>
                    <input type="password" required value={loginFormState.password} onChange={(e) => setLoginFormState({...loginFormState, password: e.target.value})} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500 outline-none" placeholder="••••••••" />
                  </div>
                </div>
                <button type="submit" disabled={isLoggingIn} className="w-full bg-red-600 text-white font-bold py-3.5 rounded-xl hover:bg-red-700 disabled:opacity-60 disabled:cursor-wait transition-all duration-200 mt-6">{isLoggingIn ? 'Memeriksa akun...' : 'Masuk ke Portal'}</button>
              </form>
              {isAPI ? (
                <div className="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 text-center font-medium flex items-center justify-center gap-2">
                  <IconLock size={14}/> Terhubung ke server data perusahaan (Google Drive)
                </div>
              ) : (
                <div className="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 text-center font-medium">
                  {!isGAS && (
                    <div className="mb-4 text-left bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 leading-relaxed">
                      <b>Mode lokal:</b> data hanya tersimpan di browser ini. Isi <code className="bg-amber-100 px-1 rounded">API_URL</code> di <code className="bg-amber-100 px-1 rounded">config.js</code> untuk memakai data Google Drive.
                    </div>
                  )}
                  <p>Akun Demo Tersedia:</p>
                  <div className="flex justify-center gap-3 mt-3">
                    <span className="bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">admin / admin123</span>
                    <span className="bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">staff / staff123</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ---------- Buku besar: tampilan bersama (layar & cetak)
      const fmtSaldo = (v, normal) => { const x = Math.round(v || 0); if (Math.abs(x) < 1) return formatIDR(0); const pos = x > 0 ? 'D' : 'K'; return `${formatIDR(Math.abs(x))} ${pos}`; };
      const tabelBukuAkun = (b, cetak) => (
        <div key={b.kode} className={cetak ? 'mb-5 avoid-break' : ''}>
          <div className={`flex flex-wrap items-baseline justify-between gap-2 ${cetak ? 'border-b-2 border-slate-900 pb-1 mb-1' : 'mb-2'}`}>
            <b className={cetak ? 'text-[11px]' : 'text-base text-slate-900'}>{b.kode} · {b.nama}</b>
            <span className={cetak ? 'text-[9px] text-slate-500' : 'text-xs text-slate-500'}>Saldo normal: {b.normal === 'D' ? 'Debit' : 'Kredit'}</span>
          </div>
          <table className={`w-full ${cetak ? 'text-[9.5px]' : 'text-sm min-w-[720px]'}`}>
            <thead><tr className={`text-left ${cetak ? 'bg-slate-50' : 'text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-200'}`}><th className="py-1.5 pl-1">Tanggal</th><th>No. jurnal</th><th>Keterangan</th><th className="text-right">Debit</th><th className="text-right">Kredit</th><th className="text-right pr-1">Saldo</th></tr></thead>
            <tbody className="divide-y divide-slate-100">
              <tr className="text-slate-500 italic"><td className="py-1.5 pl-1" colSpan="5">Saldo awal 1 Januari</td><td className="text-right pr-1 tabular-nums">{fmtSaldo(b.saldoAwal)}</td></tr>
              {b.rows.map((r, n) => (
                <tr key={n}><td className="py-1.5 pl-1 whitespace-nowrap tabular-nums">{r.date}</td><td className="whitespace-nowrap text-slate-500">{r.no}</td><td className="pr-2">{r.ket}{r.ref && !/^(SALDO|PENY|PERS|PPH)/.test(r.ref) && !String(r.ket).includes(r.ref) ? <span className="text-slate-400"> · {r.ref}</span> : null}</td>
                  <td className="text-right tabular-nums">{r.d ? formatIDR(r.d) : ''}</td><td className="text-right tabular-nums">{r.k ? formatIDR(r.k) : ''}</td><td className="text-right pr-1 tabular-nums font-semibold whitespace-nowrap">{fmtSaldo(r.saldo)}</td></tr>
              ))}
              <tr className="font-bold border-t-2 border-slate-800"><td className="py-1.5 pl-1" colSpan="3">Jumlah mutasi & saldo akhir 31 Desember</td><td className="text-right tabular-nums">{formatIDR(b.mutasiD)}</td><td className="text-right tabular-nums">{formatIDR(b.mutasiK)}</td><td className="text-right pr-1 tabular-nums whitespace-nowrap">{fmtSaldo(b.saldoAkhir)}</td></tr>
            </tbody>
          </table>
        </div>
      );
      const tabelNeracaSaldo = (bb, cetak) => (
        <table className={`w-full ${cetak ? 'text-[10px]' : 'text-sm min-w-[560px]'}`}>
          <thead><tr className={`text-left ${cetak ? 'bg-slate-50 border-y-2 border-slate-900' : 'text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-200'}`}><th className="py-1.5 pl-1">Kode</th><th>Nama akun</th><th className="text-right">Debit</th><th className="text-right pr-1">Kredit</th></tr></thead>
          <tbody className="divide-y divide-slate-100">
            {bb.neracaSaldo.filter(r => Math.abs(r.debit) >= 1 || Math.abs(r.kredit) >= 1).map(r => (
              <tr key={r.kode}><td className="py-1.5 pl-1 tabular-nums text-slate-500">{r.kode}</td><td>{r.nama}</td><td className="text-right tabular-nums">{r.debit >= 1 ? formatIDR(r.debit) : ''}</td><td className="text-right pr-1 tabular-nums">{r.kredit >= 1 ? formatIDR(r.kredit) : ''}</td></tr>
            ))}
            <tr className="font-black border-t-2 border-slate-900"><td className="py-2 pl-1" colSpan="2">JUMLAH</td><td className="text-right tabular-nums">{formatIDR(bb.totalD)}</td><td className="text-right pr-1 tabular-nums">{formatIDR(bb.totalK)}</td></tr>
          </tbody>
        </table>
      );
      const tabelJurnal = (jurnal, cetak) => (
        <table className={`w-full ${cetak ? 'text-[9.5px]' : 'text-sm min-w-[760px]'}`}>
          <thead><tr className={`text-left ${cetak ? 'bg-slate-50 border-y-2 border-slate-900' : 'text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-200'}`}><th className="py-1.5 pl-1">Tanggal</th><th>No. jurnal</th><th>Akun / keterangan</th><th className="text-right">Debit</th><th className="text-right pr-1">Kredit</th></tr></thead>
          {jurnal.map(j => (
            <tbody key={j.no} className={`border-b border-slate-200 ${cetak ? 'avoid-break' : ''}`}>
              {j.lines.map((l, n) => {
                const a = (daftarAkunCache.find(x => x.kode === l.akun) || { nama: l.akun });
                return (
                  <tr key={n}>
                    <td className="pt-1.5 pl-1 align-top whitespace-nowrap tabular-nums">{n === 0 ? j.date : ''}</td>
                    <td className="pt-1.5 align-top whitespace-nowrap text-slate-500">{n === 0 ? j.no : ''}</td>
                    <td className={`pt-1.5 ${l.k ? 'pl-8' : ''}`}><span className="text-slate-400 tabular-nums">{l.akun}</span> {a.nama}</td>
                    <td className="pt-1.5 text-right tabular-nums">{l.d ? formatIDR(l.d) : ''}</td>
                    <td className="pt-1.5 text-right pr-1 tabular-nums">{l.k ? formatIDR(l.k) : ''}</td>
                  </tr>
                );
              })}
              <tr><td></td><td></td><td className="pb-2 pt-0.5 text-[11px] italic text-slate-500" colSpan="3">({j.ket}{j.ref && !/^(SALDO|PENY|PERS|PPH)/.test(j.ref) && !String(j.ket).includes(j.ref) ? ` · ${j.ref}` : ''})</td></tr>
            </tbody>
          ))}
        </table>
      );
      const dbKeuangan = () => ({ invoices, expenses, assets, cashTx, ledger, stok });

      // === TAMPILAN KHUSUS CETAK & PDF ===
      if (printData) {
        const { type, item } = printData;
        if (type === 'lapkeu') {
          const R = item, lr = R.lr, A = R.aset, Lb = R.liabilitas, E = R.ekuitas;
          const part = printData.part || 'semua';
          const tampil = (p) => p === 'bukubesar' ? part === 'bukubesar' : (part === 'semua' || part === p);
          const row = (label, value, o = {}) => (
            <tr key={o.key || label} className={`${o.total ? 'font-bold border-t border-slate-400' : ''} ${o.grand ? 'font-black border-t-2 border-slate-900 bg-slate-50' : ''} ${o.sub ? 'text-slate-500 text-[10px]' : ''}`}>
              <td className={`py-1 ${o.sub ? 'pl-8' : o.indent ? 'pl-4' : 'pl-1'}`}>{o.sub ? '· ' : ''}{label}</td>
              <td className="py-1 pr-1 text-right whitespace-nowrap">{o.neg ? paren(value) : formatIDR(value)}</td>
            </tr>
          );
          const head = (label) => <tr key={'h' + label}><td colSpan="2" className="pt-3 pb-0.5 pl-1 font-black uppercase tracking-wider text-[9px] text-slate-600">{label}</td></tr>;
          const kop = (judul) => (
            <div className="flex justify-between items-center border-b-[3px] border-slate-900 pb-3 mb-4">
              <div className="w-[70%] flex items-center gap-4">

                        <div><span className="text-slate-500 text-[9px] block mb-0.5 uppercase font-bold">Plat Kendaraan</span><span className="font-bold text-[12px] bg-white px-2 py-0.5 rounded border">{doc?.vehicle}</span></div>
                      </div>
                      <table className="w-full text-left mb-4 border-collapse">
                        <thead className="bg-slate-50 border-y-2 border-slate-800">
                          <tr><th className="py-1.5 px-2 w-12 text-center">No</th><th className="py-1.5 px-2">Daftar Barang Muatan</th><th className="py-1.5 px-2 text-center w-24">Kuantitas</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {(doc?.items||[]).map((it, idx) => (
                            <tr key={idx} className="avoid-break"><td className="py-2 px-2 text-center text-slate-400 font-bold">{idx + 1}</td><td className="py-2 px-2 font-bold text-slate-800">{it?.desc}</td><td className="py-2 px-2 text-center font-black text-sm bg-slate-50/50">{it?.qty}</td></tr>
                          ))}
                        </tbody>
                      </table>

                  {type === 'kwitansi' && (
                    <div className="space-y-4 text-[11px]">
                      <div className="bg-slate-50 p-4 rounded-xl border flex justify-between items-center avoid-break">
                        <div><div className="text-[9px] font-bold text-slate-500 uppercase mb-0.5">Telah Terima Dari</div><div className="text-lg font-black text-slate-900">{doc?.receivedFrom}</div></div>
                        <div className="text-right"><div className="text-[9px] font-bold text-slate-500 uppercase mb-0.5">Tanggal</div><div className="font-bold text-[13px]">{doc?.date}</div></div>
                      </div>
                      <div className="p-4 border rounded-xl space-y-3 avoid-break">
                        <div><div className="text-[9px] font-bold text-slate-500 uppercase mb-0.5">Untuk Pembayaran</div><div className="font-semibold text-slate-800 text-[13px] leading-relaxed">{doc?.purpose}</div></div>
                        <div><div className="text-[9px] font-bold text-slate-500 uppercase mb-0.5">Sejumlah Uang</div><div className="font-black text-lg bg-amber-50 border border-amber-200 text-amber-700 px-4 py-1.5 rounded-lg inline-block">{formatIDR(doc?.amount)}</div></div>
                      </div>
                    </div>

                  <div className="mt-8 flex justify-between text-[11px] avoid-break">
                    {type === 'sj' ? (
                      <>
                        <div className="text-center w-40"><p className="mb-10 text-slate-500">Penerima Barang,</p><div className="h-0.5 bg-slate-800 w-full mt-2"></div></div>
                        <div className="text-center w-40"><p className="mb-10 text-slate-500">Pengemudi / Kurir,</p><p className="font-bold border-b border-slate-800 pb-0.5">{doc?.driver}</p></div>
                      </>
                    ) : null}
                    <div className="text-center w-40 ml-auto">
                      <p className="mb-10 text-slate-500">{type==='kwitansi'?'Penerima Pembayaran,':'Hormat Kami,'}</p>
                      <p className="font-bold border-b border-slate-800 pb-0.5">{doc?.signerName || '__________________'}</p>
                      <p className="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-wider">{doc?.signerRole}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // --- 3. MAIN RENDER TAB SCREENS ---
      // Baris tabel laporan (dipakai dasbor, tab laporan, dan cetak)

      const lrRow = (label, value, o = {}) => (
        <tr key={o.key || label} className={`${o.total ? 'border-t border-slate-300 font-bold text-slate-900' : o.sub ? 'text-slate-500' : 'text-slate-700'} ${o.grand ? 'border-t-2 border-slate-900 bg-slate-50' : ''}`}>
          <td className={`${o.sub ? 'py-1 pl-10 text-xs' : 'py-2'} ${o.sub ? '' : o.indent ? 'pl-5' : 'pl-1'} ${o.grand ? 'font-black py-3' : ''}`}>{o.sub ? '· ' : ''}{label}{o.note && <span className="block text-[11px] text-slate-400 font-medium">{o.note}</span>}</td>
          <td className={`${o.sub ? 'py-1 text-xs' : 'py-2'} pr-1 text-right tabular-nums whitespace-nowrap ${o.neg ? 'text-rose-600' : ''} ${o.grand ? 'font-black py-3 ' + (value >= 0 ? 'text-emerald-700' : 'text-rose-700') : ''}`}>{o.neg ? paren(value) : formatIDR(value)}</td>
        </tr>

      const lrHead = (label) => (<tr key={'h-' + label}><td colSpan="2" className="pt-5 pb-1 pl-1 text-[11px] font-black uppercase tracking-widest text-slate-500">{label}</td></tr>);
      const yearSelect = (cls = '') => (
        <select value={lapYear} onChange={(e) => setLapYear(e.target.value)} className={`border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold bg-white text-slate-700 cursor-pointer outline-none focus:ring-2 focus:ring-slate-400 ${cls}`}>
          {availableYears.map(y => <option key={y} value={y}>Tahun {y}</option>)}
        </select>
      );

      const renderDashboardStaff = () => {
        const y = currentYearStr;
        const invTahun = (invoices || []).filter(i => i && (i.date || '').startsWith(y));
        const belum = (invoices || []).filter(i => i && i.date && !i.paidDate);
        const sjBulan = (suratJalan || []).filter(d => d && (d.date || '').startsWith(todayStr().slice(0, 7)));
        const expTahun = (expenses || []).filter(e => e && (e.date || '').startsWith(y));
        const tanpaSJ = (invoices || []).filter(i => i && i.autoDocs && !(suratJalan || []).some(d => d && d.invoiceId === i.id));
        const kartu = (judul, nilai, sub, Icon, tone, onClick) => (
          <button key={judul} onClick={onClick} className="text-left bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-slate-300">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <h3 className="text-slate-500 font-semibold tracking-wide uppercase text-xs">{judul}</h3>
              <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tone}`}><Icon size={20} /></div>
            </div>
            <div className="mt-5 text-2xl font-extrabold text-slate-800 tabular-nums">{nilai}</div>
            <p className="text-xs font-medium text-slate-400 mt-2">{sub}</p>
          </button>
        );
        return (
          <div className="space-y-8">
            <div>
              <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Ringkasan Operasional</h2>
              <p className="text-sm text-slate-500 mt-1">Selamat bekerja, {currentUser?.name}. Menu yang tampil sesuai izin dari admin.</p>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">
              {(can('invoice') || can('kalender')) && kartu(`Invoice ${y}`, invTahun.length, 'Dokumen invoice tahun ini', IconFileText, 'bg-blue-50 text-blue-600', () => setActiveTab(can('invoice') ? 'invoice' : 'kalender'))}
              {(can('invoice') || can('kalender')) && kartu('Belum lunas', belum.length, `Tagihan ${formatIDR(belum.reduce((a, i) => a + invTagihan(i), 0))}`, IconWallet, 'bg-amber-50 text-amber-600', () => setActiveTab(can('invoice') ? 'invoice' : 'kalender'))}
              {(can('suratjalan') || can('invoice')) && kartu('Surat jalan bulan ini', sjBulan.length, 'Termasuk yang dibuat otomatis dari invoice', IconTruck, 'bg-emerald-50 text-emerald-600', () => setActiveTab(can('suratjalan') ? 'suratjalan' : 'invoice'))}
              {can('pengeluaran') && kartu(`Pengeluaran ${y}`, expTahun.length, 'Catatan beban tahun ini', IconTrendingDown, 'bg-rose-50 text-rose-600', () => setActiveTab('pengeluaran'))}
            </div>
            {(can('invoice') || can('kalender')) && <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-6 py-5 border-b border-slate-100"><h2 className="text-lg font-bold text-slate-800">Invoice belum lunas</h2></div>
              <div className="overflow-x-auto"><table className="w-full text-sm min-w-[560px]">
                <tbody className="divide-y divide-slate-100">
                  {belum.length === 0 ? <tr><td className="px-6 py-6 text-center text-slate-400">Semua invoice sudah lunas.</td></tr> : belum.slice(0, 10).map(i => (
                    <tr key={i.id}><td className="px-6 py-3 font-bold text-blue-700">{i.id}</td><td className="px-6 py-3">{i.date}</td><td className="px-6 py-3 font-semibold">{i.customer}</td><td className="px-6 py-3 text-right font-bold tabular-nums">{formatIDR(i.total)}</td></tr>
                  ))}
                </tbody>
              </table></div>
            </div>}

          </div>
        );
      };

      const renderDashboard = () => {
        if (!(isAdmin || (can('labarugi') && can('neraca') && can('pajak')))) return renderDashboardStaff();
        const R = ledgerResult, lr = R.lr;
        const bebanTotal = lr.hpp + lr.bebanOperasional + lr.penyusutan;
        const ppnTahun = R.ppnMasa.reduce((a, m) => ({ k: a.k + m.keluaran, m: a.m + m.masukan }), { k: 0, m: 0 });
        const card = (title, value, sub, tone, Icon) => (
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <h3 className="text-slate-500 font-semibold tracking-wide uppercase text-xs">{title}</h3>
              <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tone}`}><Icon size={20} /></div>

            <p className="text-xs font-medium text-slate-400 mt-2">{sub}</p>

        <div className="space-y-8">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

              <p className="text-sm text-slate-500 mt-1">Basis akrual · seluruh penjualan (PPN &amp; non-PPN) · tahun buku {lapYear}</p>
            </div>
            {yearSelect()}
          </div>

          {R.peringatan.length > 0 && (
            <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 text-sm space-y-1">
              {R.peringatan.map((t, k) => <div key={k} className="flex items-start gap-2"><IconAlertCircle size={16}/> <span>{t}</span></div>)}
              {can('datakeu') && <button onClick={() => setActiveTab('datakeu')} className="mt-2 text-xs font-bold underline">Lengkapi di menu Data Keuangan</button>}
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">
            {card(`Pendapatan Usaha ${lapYear}`, lr.pendapatanUsaha, `PPN ${formatIDR(lr.penjualanPPN)} · Non-PPN ${formatIDR(lr.penjualanNonPPN)}`, 'bg-blue-50 text-blue-600', IconWallet)}
            {card('Total Beban', bebanTotal, 'HPP + operasional + penyusutan', 'bg-rose-50 text-rose-600', IconTrendingDown)}
            {card('Laba Bersih', lr.labaBersih, 'Setelah estimasi PPh Badan', 'bg-emerald-50 text-emerald-600', IconCalculator)}
            {card('Kas & Bank', R.aset.kas, `Kas Tunai ${formatIDR(R.aset.kasTunai)} · Kas Bank ${formatIDR(R.aset.kasBank)}`, 'bg-slate-100 text-slate-700', IconLandmark)}
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 overflow-hidden">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4">
              <div>
                <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                  <IconBarChart2 size={20} className="text-blue-600" /> Penjualan Bersih per Bulan
                </h2>
                <p className="text-sm text-slate-500 mt-1 font-medium">Nilai invoice sebelum PPN (DPP), {lapYear} vs {Number(lapYear) - 1}.</p>
              </div>
              <div className="flex gap-4 text-xs font-bold uppercase tracking-wider bg-slate-50 px-4 py-2 rounded-lg border border-slate-100">
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-blue-600"></div> {lapYear}</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-slate-300"></div> {Number(lapYear) - 1}</div>
              </div>
            </div>
            <div className="overflow-x-auto">
            <div className="h-72 flex items-end gap-2 sm:gap-4 border-b border-slate-200 pb-2 relative w-full min-w-[500px]">
              <div className="absolute top-0 left-0 w-full h-px bg-slate-100"></div>
              <div className="absolute top-1/4 left-0 w-full h-px bg-slate-100"></div>
              <div className="absolute top-2/4 left-0 w-full h-px bg-slate-100"></div>
              <div className="absolute top-3/4 left-0 w-full h-px bg-slate-100"></div>
              {monthlyRevenueData.map((data, idx) => (
                <div key={idx} className="flex-1 flex flex-col items-center justify-end h-full relative z-10 group cursor-pointer">
                  <div className="opacity-0 group-hover:opacity-100 absolute -top-14 bg-slate-800 text-white text-xs py-2 px-3 rounded-lg shadow-xl whitespace-nowrap transition-opacity pointer-events-none z-20 font-medium">
                    <div className="font-bold text-slate-300 mb-1 border-b border-slate-600 pb-1">{data.month}</div>
                    <div className="flex justify-between gap-4"><span className="text-blue-300">{lapYear}</span> <span>{formatIDR(data.curr)}</span></div>
                    <div className="flex justify-between gap-4"><span className="text-slate-400">{Number(lapYear) - 1}</span> <span>{formatIDR(data.prev)}</span></div>
                  </div>
                  <div className="flex items-end justify-center w-full gap-1 sm:gap-2 h-full pb-1">
                    <div className="w-1/2 max-w-[24px] bg-slate-200 rounded-t-sm transition-all duration-700" style={{ height: `${(data.prev / maxChartValue) * 100}%`, minHeight: data.prev > 0 ? '4px' : '0' }}></div>
                    <div className="w-1/2 max-w-[24px] bg-blue-600 rounded-t-sm transition-all duration-700 shadow-sm" style={{ height: `${(data.curr / maxChartValue) * 100}%`, minHeight: data.curr > 0 ? '4px' : '0' }}></div>
                  </div>
                  <span className="text-xs font-bold text-slate-400 mt-3">{data.month}</span>
                </div>
              ))}
            </div>
            </div>
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-start gap-3">
                <div>
                  <h2 className="text-lg font-bold text-slate-800">Laba Rugi {lapYear}</h2>
                  <p className="text-sm text-slate-500 mt-1">Ringkasan — rincian per jenis biaya di menu Laba Rugi.</p>
                </div>
                <button onClick={() => setActiveTab('labarugi')} className="text-sm font-bold text-blue-600 hover:underline whitespace-nowrap">Lihat lengkap →</button>
              </div>
              <div className="px-6 pb-6 overflow-x-auto">
                <table className="w-full text-sm min-w-[360px]"><tbody>
                  {lrRow('Pendapatan usaha', lr.pendapatanUsaha)}
                  {lrRow('Harga pokok penjualan', lr.hpp, { neg: true })}
                  {lrRow('Laba kotor', lr.labaKotor, { total: true })}
                  {lrRow('Beban usaha (termasuk penyusutan)', lr.bebanOperasional + lr.penyusutan, { neg: true })}
                  {lrRow('Pendapatan lain-lain', lr.pendapatanLain + lr.bungaBank)}
                  {lrRow('Laba sebelum pajak', lr.labaSebelumPajak, { total: true })}
                  {lrRow('Beban PPh Badan (estimasi)', lr.bebanPajak, { neg: true })}
                  {lrRow('Laba bersih tahun berjalan', lr.labaBersih, { grand: true })}
                </tbody></table>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-start gap-3">
                <div>
                  <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><IconLandmark size={20} className="text-emerald-600" /> Pajak {lapYear}</h2>
                  <p className="text-sm text-slate-500 mt-1">PPN dari invoice PPN; PPh Badan dari seluruh peredaran usaha.</p>
                </div>
                <button onClick={() => setActiveTab('pajak')} className="text-sm font-bold text-emerald-700 hover:underline whitespace-nowrap">Rincian →</button>
              </div>
              <div className="px-6 pb-6 overflow-x-auto">
                <table className="w-full text-sm min-w-[360px]"><tbody>
                  {lrHead('PPN')}
                  {lrRow('PPN keluaran', ppnTahun.k, { indent: true })}
                  {lrRow('PPN masukan (dapat dikreditkan)', ppnTahun.m, { indent: true, neg: true })}
                  {lrRow('PPN kurang (lebih) bayar', ppnTahun.k - ppnTahun.m, { total: true })}
                  {lrHead('PPh Badan')}
                  {lrRow('Peredaran bruto', lr.peredaranBruto, { indent: true })}
                  {lrRow('Penghasilan kena pajak', lr.pkp, { indent: true })}
                  {lrRow('PPh Badan terutang (estimasi)', lr.pph.pph, { total: true, note: lr.pph.metode })}
                </tbody></table>
              </div>
            </div>
          </div>
        </div>
        );
      };

      const renderKalender = () => {
        const prevMonth = () => {
          if (calendarMonth === 0) { setCalendarMonth(11); setCalendarYear(calendarYear - 1); }
          else { setCalendarMonth(calendarMonth - 1); }
        };
        const nextMonth = () => {
          if (calendarMonth === 11) { setCalendarMonth(0); setCalendarYear(calendarYear + 1); }
          else { setCalendarMonth(calendarMonth + 1); }
        };

        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const dayNames = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
        const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        const firstDayOfMonth = new Date(calendarYear, calendarMonth, 1).getDay();

        return (
          <div className="space-y-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Kalender Proyek</h2>
                <p className="text-sm text-slate-500 mt-1">Pantau jadwal aktivitas dan pemasukan proyek Anda.</p>
              </div>
              <div className="flex items-center gap-4 bg-white border border-slate-200 rounded-2xl shadow-sm p-2">
                <button onClick={prevMonth} className="p-2 text-slate-500 hover:bg-blue-50 rounded-xl"><IconChevronLeft size={20} /></button>
                <div className="w-40 text-center font-bold text-slate-800">{monthNames[calendarMonth]} {calendarYear}</div>
                <button onClick={nextMonth} className="p-2 text-slate-500 hover:bg-blue-50 rounded-xl"><IconChevronRight size={20} /></button>
              </div>
            </div>
            <div className="flex gap-4 items-center text-xs font-semibold text-slate-500">
              <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-blue-500"></span> Proyek PPN</div>
              <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-slate-300"></span> Proyek Non-PPN</div>
            </div>
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="overflow-x-auto">
                <div className="min-w-[800px]">
                  <div className="grid grid-cols-7 bg-slate-50 border-b border-slate-200">
                    {dayNames.map(day => <div key={day} className="py-3 text-center text-xs font-black text-slate-500 uppercase tracking-widest border-r border-slate-200">{day}</div>)}
                  </div>
                  <div className="grid grid-cols-7 bg-slate-100 gap-px border-b border-slate-200">
                    {Array.from({ length: firstDayOfMonth }).map((_, i) => <div key={`empty-${i}`} className="bg-slate-50 min-h-[120px]"></div>)}
                    {Array.from({ length: daysInMonth }).map((_, i) => {
                      const day = i + 1;
                      const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                      const dayEvents = calendarEvents[dateStr] || [];
                      const isToday = dateStr === todayStr();
                      return (
                        <div key={day} className={`bg-white min-h-[130px] p-2 flex flex-col gap-1.5 ${isToday ? 'bg-blue-50/20' : ''}`}>
                          <div className={`text-xs font-bold self-end w-7 h-7 flex items-center justify-center rounded-full ${isToday ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400'}`}>{day}</div>
                          <div className="flex-1 flex flex-col gap-1.5 overflow-y-auto max-h-[90px] custom-scrollbar pr-1">
                            {dayEvents.map((ev, idx) => (
                              <div key={idx} className={`text-[10px] p-1.5 rounded border truncate font-bold ${ev.usePpn ? 'bg-blue-50 border-blue-100 text-blue-700' : 'bg-slate-100 border-slate-200 text-slate-700'}`}>{ev?.customer}</div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderPenawaran = () => (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Manajemen Penawaran</h2>
            </div>
            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto p-2 bg-white border border-slate-200 rounded-2xl shadow-sm">
              <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-50 rounded-xl border border-slate-100">
                <IconFilter size={16} className="text-slate-500" />
                <select value={filterPrintPnw} onChange={(e) => setFilterPrintPnw(e.target.value)} className="text-sm bg-transparent font-bold outline-none cursor-pointer">
                  <option value="all">Semua Kategori</option><option value="ppn">Hanya PPN</option><option value="non_ppn">Hanya Non-PPN</option>
                </select>
              </div>

                {userMsg && !f && <div className="bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 text-sm font-semibold">{userMsg}</div>}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden overflow-x-auto">
                  <table className="w-full text-left min-w-[760px]">
                    <thead className="bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Nama</th>
                        <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Username</th>
                        <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Peran</th>
                        <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Menu yang dapat dibuka</th>

                      </tr>

                    <tbody className="divide-y divide-slate-100">
                      {userList === null ? (
                        <tr><td colSpan="5" className="px-6 py-8 text-center text-slate-400">{userBusy ? 'Memuat daftar akun...' : <button onClick={() => userApi({ action: 'listUsers' })} className="underline font-bold">Muat daftar akun</button>}</td></tr>
                      ) : userList.map(u => (
                        <tr key={u.username} className="hover:bg-slate-50/80">
                          <td className="px-6 py-4"><div className="flex items-center gap-3"><span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white ${u.role === 'admin' ? 'bg-red-600' : 'bg-slate-500'}`}>{u.initial || (u.name || u.username)[0].toUpperCase()}</span><span className="font-semibold text-slate-800">{u.name}</span>{currentUser && u.username === currentUser.username && <span className="text-[10px] font-bold text-slate-400">(Anda)</span>}</div></td>
                          <td className="px-6 py-4 text-sm text-slate-600 font-mono">{u.username}{u.wa && <span className="flex items-center gap-1 mt-1 text-xs text-emerald-700 font-sans font-semibold"><IconWhatsApp size={13}/>{fmtWa(u.wa)}</span>}</td>
                          <td className="px-6 py-4"><span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${u.role === 'admin' ? 'bg-red-50 border-red-100 text-red-700' : PERAN_APLIKASI.includes(u.role) ? 'bg-blue-50 border-blue-100 text-blue-700' : 'bg-slate-100 border-slate-200 text-slate-600'}`}>{PERAN_LABEL[u.role] || 'Staff'}</span></td>
                          <td className="px-6 py-4">
                            {u.role === 'admin' ? <span className="text-sm text-slate-500">Semua menu + Pengguna + Backup/Pulihkan</span> : PERAN_APLIKASI.includes(u.role) ? <span className="text-sm text-blue-700 font-semibold">Aplikasi NVP Operasional (viopran.com/app)</span> : (
                              <div className="flex flex-wrap gap-1">{(u.menus || []).map(k => <span key={k} className="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-100 border border-slate-200 text-slate-600">{labelMenu(k)}</span>)}{!(u.menus || []).length && <span className="text-xs text-amber-700">Hanya Dasbor</span>}</div>
                            )}
                          </td>
                          <td className="px-6 py-4 text-center whitespace-nowrap">
                            <button onClick={() => openUserForm(u)} className="p-1.5 text-slate-400 hover:text-amber-500" title="Ubah akun / izin / password"><IconEdit size={18}/></button>
