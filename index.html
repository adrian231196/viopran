    const COMPANY = {

    // --- UTILITIES ---
    const formatIDR = (number) => {

    const renumberDocuments = (array, basePrefix, hasPpn = false) => {
      const safeArray = array || [];
      const sortedArray = [...safeArray].sort((a, b) => new Date(a?.date || 0) - new Date(b?.date || 0));
      const counts = {};
      const renumberedArray = sortedArray.map(item => {
        const year = item?.date ? item.date.substring(0, 4) : new Date().getFullYear().toString();
        let prefix = basePrefix;
        if (hasPpn) {
          prefix = item?.usePpn ? `${basePrefix}-PPN` : `${basePrefix}-NON`;
        }
        const key = `${year}-${prefix}`;
        if (!counts[key]) counts[key] = 0;
        counts[key]++;

        const seq = counts[key].toString().padStart(4, '0');
        const newId = `${seq}/${prefix}/NVP/APK-SERT/${year}`;
        return { ...item, id: newId };
      });
      return renumberedArray.sort((a, b) => new Date(b?.date || 0) - new Date(a?.date || 0));
    };

    // Nomor dokumen PERMANEN: setelah diterbitkan tidak pernah dinomori ulang
    // (sesuai praktik pembukuan & faktur — penghapusan meninggalkan celah nomor, bukan menggeser nomor lain).
    const DOC_ID_RE = /^(\d{4})\/([A-Z]+(?:-[A-Z]+)?)\/NVP\/APK-SERT\/(\d{4})$/;
    const docPrefix = (base, hasPpn, usePpn) => hasPpn ? `${base}-${usePpn ? 'PPN' : 'NON'}` : base;
    function nextDocNumber(list, base, hasPpn, item) {

      let max = 0;
      (list || []).forEach(d => { const m = DOC_ID_RE.exec((d && d.id) || ''); if (m && m[2] === prefix && m[3] === year) max = Math.max(max, Number(m[1])); });
      return `${String(max + 1).padStart(4, '0')}/${prefix}/NVP/APK-SERT/${year}`;
    }
    function keepOrRenumber(list, base, hasPpn, oldId, item) {
      const m = DOC_ID_RE.exec(oldId || '');
      const year = (item.date || '').substring(0, 4);
      if (m && m[2] === docPrefix(base, hasPpn, item.usePpn) && m[3] === year) return oldId;
      return nextDocNumber((list || []).filter(d => d && d.id !== oldId), base, hasPpn, item);
    }
    const sortByDateDesc = (arr) => [...arr].sort((a, b) => String(b?.date || '').localeCompare(String(a?.date || '')));

    // Menu portal yang bisa diizinkan per akun (harus sama dengan NVP_MENUS di Api.gs)
    const MENU_DEF = [

      ['invoice', 'Invoice', 'Termasuk surat jalan & kwitansi otomatis'],
      ['suratjalan', 'Surat Jalan', 'Buat & ubah surat jalan'],
      ['kwitansi', 'Kwitansi', 'Buat & ubah kwitansi'],
      ['pengeluaran', 'Pengeluaran', 'Catat beban & pembelian'],

    const MENU_KEYS = MENU_DEF.map(m => m[0]);
    const STAFF_DEFAULT_MENUS = ['kalender', 'penawaran', 'invoice', 'suratjalan', 'kwitansi', 'pengeluaran'];
    const PERAN_LABEL = { admin: 'Admin', staff: 'Staff', teknisi: 'Teknisi', manager: 'Manager Operasional', direktur: 'Direktur' };
    const PERAN_APLIKASI = ['teknisi', 'manager', 'direktur'];

    // Surat jalan & kwitansi otomatis dari invoice (terhubung lewat field invoiceId)
    const sjItemsFromInvoice = (inv) => (inv.items || []).filter(it => String((it && it.desc) || '').trim()).map(it => ({ desc: it.desc, qty: Number(it.qty) || 0 }));
    const sjFromInvoice = (inv) => ({ date: inv.date, customer: inv.customer, driver: '', vehicle: '', items: sjItemsFromInvoice(inv), signerName: '', signerRole: 'Warehouse Dept.', invoiceId: inv.id });
    const kwtFromInvoice = (inv) => {
      const barang = (inv.items || []).map(it => it && it.desc).filter(Boolean).join(', ');
      const pot = [];
      if (invDipungut(inv)) pot.push(`PPN ${formatIDR(inv.ppn)} dipungut & disetor pembeli`);
      if (invPphPotong(inv)) pot.push(`${PPH_POTONG[inv.pphJenis].pendek} ${formatIDR(invPphPotong(inv))} dipotong pembeli`);
      return { date: inv.paidDate && inv.paidDate > inv.date ? inv.paidDate : inv.date, receivedFrom: inv.customer, amount: Math.round(Number(inv.total) || 0),
        purpose: `Pelunasan Invoice No. ${inv.id}${barang ? ' — ' + barang : ''}${pot.length ? ` (${pot.join('; ')}; diterima bersih ${formatIDR(invDiterima(inv))})` : ''}`, signerName: inv.signerName || '', signerRole: 'Finance Dept.', invoiceId: inv.id };
    };
    // opts.createSJ / opts.createKwt: buat dokumen bila belum ada. Dokumen yang sudah terhubung selalu diselaraskan.
    function syncInvoiceDocs(inv, oldInvId, sjList, kwtList, opts) {
      const o = opts || {};
      const linkId = oldInvId || inv.id;
      let sj = [...(sjList || [])], kw = [...(kwtList || [])];
      let changedSJ = false, changedKW = false;
      const si = sj.findIndex(d => d && d.invoiceId === linkId);
      if (si >= 0) {
        sj[si] = { ...sj[si], invoiceId: inv.id, customer: inv.customer, items: sjItemsFromInvoice(inv) }; changedSJ = true;
      } else if (o.createSJ) {
        const d = sjFromInvoice(inv); sj.push({ ...d, id: nextDocNumber(sj, 'SJ', false, d) }); changedSJ = true;
      }
      const ki = kw.findIndex(d => d && d.invoiceId === linkId);
      if (inv.paidDate) {
        const d = kwtFromInvoice(inv);
        if (ki >= 0) {
          const k = kw[ki];
          kw[ki] = { ...k, ...d, signerName: k.signerName || d.signerName, signerRole: k.signerRole || d.signerRole, id: keepOrRenumber(kw, 'KWT', false, k.id, d) }; changedKW = true;
        } else if (o.createKwt) {
          kw.push({ ...d, id: nextDocNumber(kw, 'KWT', false, d) }); changedKW = true;
        }
      } else if (ki >= 0) {
        kw.splice(ki, 1); changedKW = true;   // invoice batal lunas -> kwitansinya dicabut
      }
      return { sj: changedSJ ? sortByDateDesc(sj) : sjList, kw: changedKW ? sortByDateDesc(kw) : kwtList, changedSJ, changedKW };
    }
    const pad2 = (n) => String(n).padStart(2, '0');
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
    const paren = (v) => `(${formatIDR(Math.abs(v || 0))})`;
    const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    // =====================================================================
    // MESIN PEMBUKUAN (LEDGER) — murni perhitungan, tanpa tampilan
    // Mengikuti SAK EMKM (basis akrual) untuk Laba Rugi & Laporan Posisi Keuangan,
    // serta ketentuan PPN (PMK 131/2024) dan PPh Badan (UU PPh Ps. 17 & 31E,
    // PP 55/2022 jo. PP 20/2026) untuk modul pajak.
    // //LEDGER-START
    const PPN_TARIF = 0.12;            // tarif PPN umum (UU HPP)
    const PPN_DPP_NILAI_LAIN = 11 / 12; // DPP nilai lain untuk barang/jasa non-mewah (PMK 131/2024)
    const PPH_BADAN_TARIF = 0.22;       // Pasal 17 ayat (1) huruf b UU PPh
    const PPH_31E_BATAS_FASILITAS = 4800000000;  // bagian peredaran bruto yang mendapat fasilitas
    const PPH_31E_BATAS_BRUTO = 50000000000;     // fasilitas berlaku s.d. peredaran bruto Rp50 M
    const PPH_FINAL_UMKM = 0.005;       // PP 55/2022 — hanya untuk WP yang masih dalam masa transisi PP 20/2026

    // Kelompok harta untuk penyusutan (Pasal 11 UU PPh, metode garis lurus)
    const KELOMPOK_HARTA = {
      k1:  { label: 'Kelompok 1 (4 thn) — komputer, peralatan kantor kecil', tahun: 4,  tarif: 0.25 },

      k4:  { label: 'Kelompok 4 (20 thn)',                                  tahun: 20, tarif: 0.05 },
      bp:  { label: 'Bangunan permanen (20 thn)',                           tahun: 20, tarif: 0.05 },
      bnp: { label: 'Bangunan tidak permanen (10 thn)',                     tahun: 10, tarif: 0.10 },
      tanah: { label: 'Tanah (tidak disusutkan)',                           tahun: 0,  tarif: 0 },
    };

    // Jenis transaksi kas di luar invoice & beban
    const JENIS_KAS = {
      modal:               { label: 'Setoran modal pemilik',              arah: 1 },
      prive:               { label: 'Prive / dividen ke pemilik',         arah: -1 },
      pinjaman_masuk:      { label: 'Penerimaan pinjaman',                arah: 1 },
      bayar_pinjaman:      { label: 'Pembayaran pokok pinjaman',          arah: -1 },
      setor_ppn:           { label: 'Setor PPN ke kas negara',            arah: -1 },

      terima_piutang_awal: { label: 'Pelunasan piutang saldo awal',       arah: 1 },
      bayar_utang_awal:    { label: 'Pembayaran utang saldo awal',        arah: -1 },
      pindah_kas:          { label: 'Pindah dana antar kas (Tunai ↔ Bank)', arah: 0 },
    };

    // Akun kas perusahaan & rekening tujuan pembayaran invoice
    const AKUN_KAS = {
      tunai: { kode: '1-101', label: 'Kas Tunai', detail: '' },
      bank:  { kode: '1-102', label: 'Kas Bank',  detail: 'Bank DKI 50308011105 a/n PT Nuri Vira Pratama' },
    };
    const REKENING = {
      bca: { bank: 'BCA', norek: '0941426696', an: 'Adrian Anugerah Putra', akun: 'tunai' },
      dki: { bank: 'DKI', norek: '50308011105', an: 'PT Nuri Vira Pratama', akun: 'bank' },
    };
    const akunAman = (a) => (a === 'tunai' ? 'tunai' : 'bank');
    const namaKas = (k) => { const a = AKUN_KAS[akunAman(k)]; return a.detail ? `${a.label} (${a.detail.split(' a/n')[0]})` : a.label; };
    // Invoice lama tanpa pilihan rekening: mengikuti aturan lama (PPN → Bank DKI, non-PPN → BCA)
    const invRek = (inv) => (inv && REKENING[inv.bayarKe]) ? inv.bayarKe : (inv && inv.usePpn ? 'dki' : 'bca');
    const invAkun = (inv) => REKENING[invRek(inv)].akun;
    // PPN dipungut & disetor langsung oleh pembeli (pemungut PPN, mis. instansi pemerintah/BUMN):
    // pembeli hanya mentransfer nilai di luar PPN, dan PPN tsb bukan utang PT.
    const invDipungut = (inv) => !!(inv && inv.usePpn && inv.ppnDipungut && num(inv.ppn) > 0);
    const invTagihan = (inv) => num(inv && inv.total) - (invDipungut(inv) ? num(inv.ppn) : 0);
    const invPpnTerutang = (inv) => invDipungut(inv) ? 0 : num(inv && inv.ppn);
    // PPh yang dipotong pembeli saat membayar (mis. sekolah/instansi pemerintah: PPh 22 1,5%; jasa: PPh 23 2%).
    // Uang yang diterima berkurang, tetapi potongan itu menjadi kredit pajak (mengurangi PPh Badan yang harus disetor).
    const PPH_POTONG = {
      pph22: { label: 'PPh 22 — 1,5% (pembelian barang oleh bendahara pemerintah: sekolah negeri, dinas, dll.)', pendek: 'PPh 22 (1,5%)', tarif: 0.015 },
      pph23: { label: 'PPh 23 — 2% (pembayaran jasa)', pendek: 'PPh 23 (2%)', tarif: 0.02 },
      lain:  { label: 'Lainnya — isi nominal sendiri', pendek: 'PPh dipotong', tarif: 0 },
    };
    const invPphPotong = (inv) => (inv && PPH_POTONG[inv.pphJenis]) ? Math.max(0, Math.min(num(inv.pphPotong), invTagihan(inv))) : 0;
    const invDiterima = (inv) => invTagihan(inv) - invPphPotong(inv);
    const expAkun = (e) => akunAman(e && e.akunKas);
    const asetAkun = (a) => akunAman(a && a.akunKas);
    const txAkun = (t) => akunAman(t && t.akun);
    const txTujuan = (t) => (txAkun(t) === 'tunai' ? 'bank' : 'tunai');

    // Jenis biaya per kategori — memudahkan penelitian beban (rincian di laba rugi & rekap pengeluaran)
    const JENIS_BIAYA = {
      Operasional: ['Gaji & upah karyawan', 'Sewa tempat', 'Listrik, air & internet', 'Telepon & pulsa', 'Transportasi & BBM', 'Pengiriman / ekspedisi', 'ATK & perlengkapan kantor', 'Perawatan & perbaikan', 'Pemasaran & iklan', 'Konsumsi & jamuan', 'Perizinan & sertifikasi usaha', 'Biaya bank & administrasi', 'Pajak & retribusi daerah (bukan PPh)', 'Asuransi', 'Lain-lain'],
      HPP: ['Pembelian tabung APAR', 'Pembelian media pemadam (powder/CO2/foam)', 'Sparepart & aksesoris', 'Jasa uji / sertifikasi pihak ketiga', 'Ongkos angkut pembelian', 'Lain-lain'],
    };
    const JENIS_KOSONG = 'Belum dikategorikan';
    function rekapJenis(list) {
      const m = {};
      (list || []).forEach(e => { const k = (e && e.jenis) || JENIS_KOSONG; m[k] = (m[k] || 0) + num(e && e.amount); });
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    }

    const LEDGER_DEFAULT = {
      opening: { kasTunai: 0, kas: 0, piutang: 0, persediaan: 0, asetTetap: 0, akumPenyusutan: 0, utangUsaha: 0, utangPajak: 0, pinjaman: 0, modal: 0 },
      closingInventory: {},   // { '2026': nilai persediaan akhir hasil stock opname }
      saldoBank: {},          // { '2026': { tunai, bank } } saldo rekening sebenarnya per 31 Des — untuk pencocokan
      pphScheme: 'umum',      // 'umum' (Ps.17 + 31E) | 'final05' (PP 55 — masa transisi)
    };

    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    const rp = (v) => Math.round(num(v));

    function hitungPPN(subtotal) {
      const dpp = rp(subtotal);
      const dppNilaiLain = Math.round(dpp * PPN_DPP_NILAI_LAIN);
      const ppn = Math.round(dppNilaiLain * PPN_TARIF);
      return { subtotal: dpp, dppNilaiLain, ppn, total: dpp + ppn };
    }

    function normalizeLedger(l) {
      const src = (l && typeof l === 'object') ? l : {};
      const opening = { ...LEDGER_DEFAULT.opening };
      Object.keys(opening).forEach(k => { opening[k] = num(src.opening && src.opening[k]); });
      const closingInventory = {};
      if (src.closingInventory && typeof src.closingInventory === 'object') {
        Object.keys(src.closingInventory).forEach(y => {
          const v = src.closingInventory[y];
          if (v !== '' && v !== null && v !== undefined && Number.isFinite(Number(v))) closingInventory[y] = Number(v);
        });
      }
      const saldoBank = {};
      const angka = (v) => v !== '' && v !== null && v !== undefined && Number.isFinite(Number(v));
      if (src.saldoBank && typeof src.saldoBank === 'object') {
        Object.keys(src.saldoBank).forEach(y => {
          const v = src.saldoBank[y];
          if (angka(v)) saldoBank[y] = { bank: Number(v) };   // format lama: satu angka
          else if (v && typeof v === 'object') { const o = {}; ['tunai', 'bank'].forEach(k => { if (angka(v[k])) o[k] = Number(v[k]); }); if (Object.keys(o).length) saldoBank[y] = o; }
        });
      }
      return { opening, closingInventory, saldoBank, pphScheme: src.pphScheme === 'final05' ? 'final05' : 'umum' };
    }

    // Tanggal efektif pelunasan tidak boleh sebelum tanggal transaksi
    const maxDate = (a, b) => (a && b) ? (a > b ? a : b) : (a || b || '');
    const invPaidDate = (inv) => inv && inv.paidDate ? maxDate(inv.date, inv.paidDate) : '';
    const expIsUtang = (e) => e && e.paymentStatus === 'utang';
    // Dana talangan: beban dibayar dulu oleh pihak ketiga → kas PT belum berkurang, PT berutang ke pihak ketiga sampai dikembalikan
    const expIsTalangan = (e) => e && e.paymentStatus === 'talangan';
    // Campuran: sebagian dibayar langsung dari kas, sisanya ditalangi pihak ketiga (menjadi utang dana talangan)
    const expIsCampuran = (e) => e && e.paymentStatus === 'campuran';
    const expAdaTalangan = (e) => expIsTalangan(e) || expIsCampuran(e);
    const expPaidDate = (e) => !e ? '' : ((expIsUtang(e) || expAdaTalangan(e)) ? (e.paidDate ? maxDate(e.date, e.paidDate) : '') : (e.date || ''));
    const namaPihak = (e) => String((e && e.talanganDari) || '').trim() || 'Pihak ketiga (tanpa nama)';
    const expGross = (e) => num(e && e.amount) + num(e && e.ppnMasukan);
    // porsi yang langsung keluar dari kas saat beban dicatat, dan dari kas mana
    const expKasLangsung = (e) => expIsCampuran(e) ? Math.min(expGross(e), Math.max(0, num(e.bayarKas))) : (expIsUtang(e) || expIsTalangan(e)) ? 0 : expGross(e);
    const expAkunLangsung = (e) => expIsCampuran(e) ? akunAman(e.akunKasLangsung) : akunAman(e && e.akunKas);
    // porsi dana talangan (utang ke pihak ketiga) dan utang pemasok; keduanya dibayar kemudian (paidDate) dari kas e.akunKas
    const expTalanganNominal = (e) => expIsTalangan(e) ? expGross(e) : expIsCampuran(e) ? expGross(e) - expKasLangsung(e) : 0;
    const expSisaNominal = (e) => (expIsUtang(e) ? expGross(e) : 0) + expTalanganNominal(e);

    function penyusutanKumulatif(asset, sampaiTahun) {
      const k = KELOMPOK_HARTA[asset && asset.kelompok] || KELOMPOK_HARTA.k1;
      const cost = num(asset && asset.cost);
      if (!asset || !asset.date || !k.tarif || cost <= 0) return 0;
      const y = Number(asset.date.substring(0, 4)), m = Number(asset.date.substring(5, 7));
      if (sampaiTahun < y) return 0;
      const bulan = (sampaiTahun - y) * 12 + (12 - m + 1);   // disusutkan mulai bulan perolehan
      return Math.min(cost, cost * k.tarif / 12 * Math.max(0, bulan));
    }

    function hitungPPhBadan(pkp, bruto, scheme, pendapatanUsaha) {
      if (scheme === 'final05') return { metode: 'PPh Final 0,5% × peredaran bruto (PP 55/2022, masa transisi PP 20/2026)', pph: Math.floor(pendapatanUsaha * PPH_FINAL_UMKM), pkpFasilitas: 0 };
      if (pkp <= 0) return { metode: 'Tidak terutang (PKP nihil / rugi fiskal)', pph: 0, pkpFasilitas: 0 };
      if (bruto <= PPH_31E_BATAS_FASILITAS) return { metode: 'Pasal 31E: seluruh PKP mendapat pengurangan 50% (tarif efektif 11%)', pph: Math.floor(pkp * PPH_BADAN_TARIF * 0.5), pkpFasilitas: pkp };
      if (bruto <= PPH_31E_BATAS_BRUTO) {
        const fas = Math.floor(PPH_31E_BATAS_FASILITAS / bruto * pkp);
        return { metode: 'Pasal 31E: sebagian PKP (Rp4,8 M / peredaran bruto) mendapat pengurangan 50%', pph: Math.floor(fas * PPH_BADAN_TARIF * 0.5 + (pkp - fas) * PPH_BADAN_TARIF), pkpFasilitas: fas };
      }
      return { metode: 'Tarif umum Pasal 17 (22%)', pph: Math.floor(pkp * PPH_BADAN_TARIF), pkpFasilitas: 0 };
    }


    // =====================================================================
    // STOK BAHAN — persediaan bahan isi ulang & tabung (metode rata-rata tertimbang)
    // =====================================================================
    const JENIS_STOK = {
      dcp:    { label: 'Dry Chemical Powder (DCP)', satuan: 'kg' },
      foam:   { label: 'Foam (AFFF)',               satuan: 'liter' },
      n2:     { label: 'Gas N2',                    satuan: 'tabung' },
      tabung: { label: 'Tabung APAR kosong',        satuan: 'unit' },
    };
    const KERJA = {
      refill_dcp:     { label: 'Isi ulang APAR DCP',  media: 'dcp',  tabung: false, satuanKap: 'kg' },
      refill_foam:    { label: 'Isi ulang APAR Foam', media: 'foam', tabung: false, satuanKap: 'liter' },
      pengadaan_dcp:  { label: 'Pengadaan APAR DCP',  media: 'dcp',  tabung: true,  satuanKap: 'kg' },
      pengadaan_foam: { label: 'Pengadaan APAR Foam', media: 'foam', tabung: true,  satuanKap: 'liter' },
    };
    const STOK_DEFAULT_ITEMS = [
      { id: 'STK-DCP', nama: 'Dry Chemical Powder (DCP)', jenis: 'dcp' },
      { id: 'STK-FOAM', nama: 'Foam (AFFF)', jenis: 'foam' },
      { id: 'STK-N2', nama: 'Gas N2', jenis: 'n2' },
    ];
    function normalizeStok(s) {
      const src = (s && typeof s === 'object') ? s : {};
      const items = (Array.isArray(src.items) && src.items.length ? src.items : STOK_DEFAULT_ITEMS).filter(i => i && i.id && JENIS_STOK[i.jenis])
        .map(i => ({ id: String(i.id), nama: String(i.nama || JENIS_STOK[i.jenis].label), jenis: i.jenis, media: i.jenis === 'tabung' ? (i.media === 'foam' ? 'foam' : 'dcp') : '', kapasitas: i.jenis === 'tabung' ? num(i.kapasitas) : 0 }));
      const mutasi = (Array.isArray(src.mutasi) ? src.mutasi : []).filter(m => m && m.id && m.itemId && m.tgl && ['awal', 'penyesuaian'].includes(m.tipe))
        .map(m => ({ id: String(m.id), tgl: String(m.tgl), itemId: String(m.itemId), tipe: m.tipe, qty: num(m.qty), nilai: num(m.nilai), ket: String(m.ket || '') }));
      return { items, mutasi, n2Kap: num(src.n2Kap) > 0 ? num(src.n2Kap) : 60 };
    }
    const satuanStok = (it) => (JENIS_STOK[it && it.jenis] || {}).satuan || '';
    const fmtQty = (q) => (Math.round(num(q) * 1000) / 1000).toLocaleString('id-ID', { maximumFractionDigits: 3 });
    // Bahan yang dipakai satu baris invoice (jenis pekerjaan × kapasitas × jumlah tabung)
    function kebutuhanBahan(stok, item) {
      const k = KERJA[item && item.kerja]; const qty = num(item && item.qty), kap = num(item && item.kap);
      if (!k || !(qty > 0)) return [];
      const S = stok || normalizeStok(null);
      const cari = (fn) => S.items.find(fn) || null;
      const out = [];
      if (k.tabung) { const t = cari(i => i.jenis === 'tabung' && i.media === k.media && Math.abs(i.kapasitas - kap) < 1e-9); out.push({ item: t, jenis: 'tabung', qty, label: `Tabung APAR ${k.media === 'dcp' ? 'DCP' : 'Foam'} ${fmtQty(kap)} ${k.satuanKap}` }); }
      if (kap > 0) { const m = cari(i => i.jenis === k.media); out.push({ item: m, jenis: k.media, qty: kap * qty, label: JENIS_STOK[k.media].label }); }
      const n2 = cari(i => i.jenis === 'n2'); out.push({ item: n2, jenis: 'n2', qty: qty / S.n2Kap, label: 'Gas N2' });
      return out;
    }
    const stokAktif = (db) => {
      const S = normalizeStok(db && db.stok);
      return S.mutasi.length > 0 || (db.expenses || []).some(e => e && e.stokItem && num(e.stokQty) > 0) || (db.invoices || []).some(i => (i && i.items || []).some(it => it && KERJA[it.kerja]));
    };
    // Kartu stok s.d. tanggal batas: saldo per barang, mutasi berjalan, HPP bahan per invoice
    function hitungStok(db, batas) {
      const S = normalizeStok(db && db.stok);
      const ev = [];
      S.mutasi.forEach(m => ev.push({ tgl: m.tipe === 'awal' ? '0000-00-00' : m.tgl, tglAsli: m.tgl, urut: m.tipe === 'awal' ? 0 : 2, itemId: m.itemId, tipe: m.tipe, qty: m.qty, nilai: m.nilai, ref: m.tipe === 'awal' ? 'Stok awal' : 'Penyesuaian', ket: m.ket, id: m.id }));
      (db.expenses || []).forEach(e => { if (e && e.date && e.category === 'HPP' && e.stokItem && num(e.stokQty) > 0) ev.push({ tgl: e.date, tglAsli: e.date, urut: 1, itemId: String(e.stokItem), tipe: 'beli', qty: num(e.stokQty), nilai: num(e.amount), ref: e.id || 'Pembelian', ket: e.desc || '' }); });
      (db.invoices || []).forEach(inv => { if (!inv || !inv.date) return; (inv.items || []).forEach((it, n) => { kebutuhanBahan(S, it).forEach(b => ev.push({ tgl: inv.date, tglAsli: inv.date, urut: 3, itemId: b.item ? b.item.id : null, label: b.label, tipe: 'pakai', qty: b.qty, ref: inv.id, invId: inv.id, ket: `${(KERJA[it.kerja] || {}).label} ${fmtQty(it.kap)} ${(KERJA[it.kerja] || {}).satuanKap} × ${fmtQty(it.qty)} — ${inv.customer || ''}` })); }); });
      ev.sort((a, b) => a.tgl.localeCompare(b.tgl) || a.urut - b.urut || String(a.ref).localeCompare(String(b.ref)));
      const saldo = Object.fromEntries(S.items.map(i => [i.id, { qty: 0, nilai: 0, avg: 0 }]));
      const mutasi = [], hppInvoice = {}, tanpaBarang = [];
      ev.forEach(e => {
        if (batas && e.tglAsli > batas && e.tipe !== 'awal') return;
        if (!e.itemId || !saldo[e.itemId]) { if (e.tipe === 'pakai') tanpaBarang.push({ invId: e.invId, label: e.label, qty: e.qty }); return; }
        const sd = saldo[e.itemId];
        let masuk = 0, keluar = 0, biaya = 0;
        if (e.tipe === 'awal' || e.tipe === 'beli') { masuk = e.qty; sd.qty += e.qty; sd.nilai += e.nilai; biaya = e.nilai; }
        else if (e.tipe === 'penyesuaian' && e.qty > 0) { masuk = e.qty; biaya = e.qty * sd.avg; sd.qty += e.qty; sd.nilai += biaya; }
        else { keluar = Math.abs(e.qty); biaya = keluar * sd.avg; sd.qty -= keluar; sd.nilai -= biaya; }
        if (sd.qty > 1e-9) sd.avg = sd.nilai / sd.qty; else if (Math.abs(sd.qty) <= 1e-9) sd.nilai = 0;
        if (e.tipe === 'pakai') { const h = hppInvoice[e.invId] = hppInvoice[e.invId] || { total: 0, rincian: [] }; h.total += biaya; h.rincian.push({ itemId: e.itemId, qty: keluar, biaya }); }
        mutasi.push({ tgl: e.tglAsli, itemId: e.itemId, tipe: e.tipe, ref: e.ref, ket: e.ket, masuk, keluar, biaya, saldoQty: sd.qty, saldoNilai: sd.nilai, avg: sd.avg, id: e.id });
      });
      const items = S.items.map(i => ({ ...i, satuan: satuanStok(i), ...saldo[i.id] }));
      return { stok: S, items, mutasi, hppInvoice, tanpaBarang, nilai: items.reduce((a, i) => a + i.nilai, 0), nilaiAwal: S.mutasi.filter(m => m.tipe === 'awal').reduce((a, m) => a + m.nilai, 0) };
    }

    // Saldo awal pembukuan; persediaan awal mengikuti nilai stok awal bila modul stok dipakai
    function saldoAwalPembukuan(db) {
      const L = normalizeLedger(db && db.ledger);
      const S = normalizeStok(db && db.stok);
      return S.mutasi.some(m => m.tipe === 'awal') ? { ...L.opening, persediaan: S.mutasi.filter(m => m.tipe === 'awal').reduce((a, m) => a + m.nilai, 0) } : L.opening;
    }
    function computeLedger(db, year) {
      const Y = Number(year);
      const invoices = (db.invoices || []).filter(i => i && i.date);
      const expenses = (db.expenses || []).filter(e => e && e.date);
      const assets = (db.assets || []).filter(a => a && a.date);
      const cashTx = (db.cashTx || []).filter(t => t && t.date && JENIS_KAS[t.type]);
      const L = normalizeLedger(db.ledger);
      const pakaiStok = stokAktif(db);
      // Bila modul stok dipakai, persediaan awal pembukuan = nilai stok awal
      const O = saldoAwalPembukuan(db);

      const years = [];
      [...invoices, ...expenses, ...assets, ...cashTx].forEach(x => years.push(Number(x.date.substring(0, 4))));
      const firstYear = Math.min(Y, ...(years.length ? years : [Y]));
      const inYear = (d, y) => d && Number(d.substring(0, 4)) === y;

      // Persediaan akhir: hasil stock opname (diisi manual) atau otomatis dari kartu stok
      const stokCache = {};
      const persAkhir = (y) => (L.closingInventory[String(y)] !== undefined ? num(L.closingInventory[String(y)])
        : pakaiStok ? (stokCache[y] = stokCache[y] !== undefined ? stokCache[y] : hitungStok(db, `${y}-12-31`).nilai) : 0);
      const persAwal = (y) => (y <= firstYear ? O.persediaan : persAkhir(y - 1));
      const sumTx = (type, pred) => cashTx.filter(t => t.type === type && pred(t.date)).reduce((s, t) => s + num(t.amount), 0);

      function labaRugi(y) {
        const inv = invoices.filter(i => inYear(i.date, y));
        const exp = expenses.filter(e => inYear(e.date, y));
        const penjualanPPN = inv.filter(i => i.usePpn).reduce((s, i) => s + num(i.subtotal), 0);
        const penjualanNonPPN = inv.filter(i => !i.usePpn).reduce((s, i) => s + num(i.subtotal), 0);
        const pendapatanUsaha = penjualanPPN + penjualanNonPPN;
        const pembelian = exp.filter(e => e.category === 'HPP').reduce((s, e) => s + num(e.amount), 0);
        const pembelianPerJenis = rekapJenis(exp.filter(e => e.category === 'HPP'));
        const bebanPerJenis = rekapJenis(exp.filter(e => e.category !== 'HPP'));
        const pAwal = persAwal(y), pAkhir = persAkhir(y);
        const hpp = pAwal + pembelian - pAkhir;
        const labaKotor = pendapatanUsaha - hpp;
        const bebanOperasional = exp.filter(e => e.category !== 'HPP').reduce((s, e) => s + num(e.amount), 0);
        const penyusutan = assets.reduce((s, a) => s + penyusutanKumulatif(a, y) - penyusutanKumulatif(a, y - 1), 0);
        const labaUsaha = labaKotor - bebanOperasional - penyusutan;
        const pendapatanLain = sumTx('pendapatan_lain', d => inYear(d, y));
        const bungaBank = sumTx('bunga_bank', d => inYear(d, y));
        const labaSebelumPajak = labaUsaha + pendapatanLain + bungaBank;

        // Rekonsiliasi fiskal
        const koreksiPositif = exp.filter(e => e.nonDeductible).reduce((s, e) => s + num(e.amount), 0);
        const koreksiNegatif = bungaBank; // penghasilan yang sudah dikenai PPh final
        const penghasilanNetoFiskal = labaSebelumPajak + koreksiPositif - koreksiNegatif;
        const pkp = penghasilanNetoFiskal > 0 ? Math.floor(penghasilanNetoFiskal / 1000) * 1000 : 0;
        const peredaranBruto = pendapatanUsaha + pendapatanLain;
        const pph = hitungPPhBadan(pkp, peredaranBruto, L.pphScheme, pendapatanUsaha);
        const labaBersih = labaSebelumPajak - pph.pph;

        return { year: y, penjualanPPN, penjualanNonPPN, pendapatanUsaha, persAwal: pAwal, pembelian, persAkhir: pAkhir, persAkhirDiisi: L.closingInventory[String(y)] !== undefined || pakaiStok, persAkhirOtomatis: L.closingInventory[String(y)] === undefined && pakaiStok, pembelianPerJenis, bebanPerJenis, hpp, labaKotor, bebanOperasional, penyusutan, labaUsaha, pendapatanLain, bungaBank, labaSebelumPajak, koreksiPositif, koreksiNegatif, penghasilanNetoFiskal, pkp, peredaranBruto, pph, bebanPajak: pph.pph, labaBersih };
      }

      const lr = labaRugi(Y);
      const D = `${Y}-12-31`;
      const upTo = (d) => d && d <= D;

      // ---------- Neraca per 31 Desember Y ----------
      const invTerbit = invoices.filter(i => upTo(i.date));
      const invLunas = invTerbit.filter(i => upTo(invPaidDate(i)));
      const expTercatat = expenses.filter(e => upTo(e.date));
      const expDibayar = expTercatat.filter(e => upTo(expPaidDate(e)));
      const asetDibeli = assets.filter(a => upTo(a.date));
      const kasMasukTx = cashTx.filter(t => upTo(t.date) && JENIS_KAS[t.type].arah > 0).reduce((s, t) => s + num(t.amount), 0);
      const kasKeluarTx = cashTx.filter(t => upTo(t.date) && JENIS_KAS[t.type].arah < 0).reduce((s, t) => s + num(t.amount), 0);

      // Saldo per akun kas s.d. tanggal tertentu (beban talangan/utang baru mengurangi kas saat dibayar/dikembalikan)
      const kasAkunSampai = (batas, akun) => {
        const sd = (d) => d && d <= batas;
        return (akun === 'tunai' ? O.kasTunai : O.kas)
          + invoices.filter(i => invAkun(i) === akun && sd(invPaidDate(i))).reduce((s, i) => s + invDiterima(i), 0)
          - expenses.reduce((s, e) => s + (expAkunLangsung(e) === akun && sd(e.date) ? expKasLangsung(e) : 0)
              + (expAkun(e) === akun && expSisaNominal(e) && sd(e.paidDate ? maxDate(e.date, e.paidDate) : '') ? expSisaNominal(e) : 0), 0)
          - assets.filter(a => asetAkun(a) === akun && sd(a.date)).reduce((s, a) => s + num(a.cost), 0)
          + cashTx.filter(t => sd(t.date)).reduce((s, t) => {
            if (t.type === 'pindah_kas') return s + (txTujuan(t) === akun ? num(t.amount) : txAkun(t) === akun ? -num(t.amount) : 0);
            return s + (txAkun(t) === akun ? JENIS_KAS[t.type].arah * num(t.amount) : 0);
          }, 0);
      };
      const kasSampai = (batas) => kasAkunSampai(batas, 'tunai') + kasAkunSampai(batas, 'bank');
      const kasTunai = kasAkunSampai(D, 'tunai'), kasBank = kasAkunSampai(D, 'bank');
      const kas = kasTunai + kasBank;
      const piutang = O.piutang - sumTx('terima_piutang_awal', upTo)
        + invTerbit.filter(i => !upTo(invPaidDate(i))).reduce((s, i) => s + invTagihan(i), 0);
      const persediaan = persAkhir(Y);
      const ppnKeluaranKum = invTerbit.reduce((s, i) => s + invPpnTerutang(i), 0);
      const ppnMasukanKum = expTercatat.reduce((s, e) => s + num(e.ppnMasukan), 0);
      const ppnNet = ppnKeluaranKum - ppnMasukanKum - sumTx('setor_ppn', upTo);
      const hargaPerolehan = O.asetTetap + asetDibeli.reduce((s, a) => s + num(a.cost), 0);
      const akumulasi = O.akumPenyusutan + assets.reduce((s, a) => s + penyusutanKumulatif(a, Y), 0);

      const utangUsaha = O.utangUsaha - sumTx('bayar_utang_awal', upTo)
        + expTercatat.filter(e => expIsUtang(e) && !upTo(expPaidDate(e))).reduce((s, e) => s + expGross(e), 0);
      // Utang dana talangan per pihak ketiga
      const talanganMap = {};
      expenses.filter(e => expAdaTalangan(e) && upTo(e.date) && expTalanganNominal(e) > 0).forEach(e => {
        const k = namaPihak(e); const t = talanganMap[k] = talanganMap[k] || { nama: k, total: 0, kembali: 0, sisa: 0, jumlah: 0 };
        const n = expTalanganNominal(e);
        t.total += n; t.jumlah += 1;
        if (upTo(expPaidDate(e))) t.kembali += n; else t.sisa += n;
      });
      const talanganPerPihak = Object.values(talanganMap).sort((a, b) => b.sisa - a.sisa || b.total - a.total);
      const utangTalangan = talanganPerPihak.reduce((s, t) => s + t.sisa, 0);
      let pphTerutangKum = 0, labaDitahanSebelum = 0;
      for (let y = firstYear; y <= Y; y++) {
        const r = y === Y ? lr : labaRugi(y);
        pphTerutangKum += r.bebanPajak;
        if (y < Y) labaDitahanSebelum += r.labaBersih;
      }
      const pphDipotongKum = invoices.filter(i => upTo(invPaidDate(i))).reduce((s, i) => s + invPphPotong(i), 0);
      const pphDipotongTahun = invoices.filter(i => inYear(invPaidDate(i), Y)).reduce((s, i) => s + invPphPotong(i), 0);
      const pphNet = O.utangPajak + pphTerutangKum - sumTx('setor_pph', upTo) - pphDipotongKum;
      const pinjaman = O.pinjaman + sumTx('pinjaman_masuk', upTo) - sumTx('bayar_pinjaman', upTo);
      const modal = O.modal + sumTx('modal', upTo);

      const openingAset = O.kasTunai + O.kas + O.piutang + O.persediaan + O.asetTetap - O.akumPenyusutan;
      const openingKewajiban = O.utangUsaha + O.utangPajak + O.pinjaman;
      const saldoLabaAwal = openingAset - openingKewajiban - O.modal;   // saldo penyeimbang
      const priveSebelum = sumTx('prive', d => d && d < `${Y}-01-01`);
      const priveTahunIni = sumTx('prive', d => inYear(d, Y));
      const saldoLabaAwalTahun = saldoLabaAwal + labaDitahanSebelum - priveSebelum;
      const saldoLabaAkhir = saldoLabaAwalTahun + lr.labaBersih - priveTahunIni;

      const aset = {
        kas, kasTunai, kasBank, piutang, persediaan,
        ppnLebihBayar: ppnNet < 0 ? -ppnNet : 0,
        pphLebihBayar: pphNet < 0 ? -pphNet : 0,
        hargaPerolehan, akumulasi, asetTetapNeto: hargaPerolehan - akumulasi,
      };
      aset.lancar = aset.kas + aset.piutang + aset.persediaan + aset.ppnLebihBayar + aset.pphLebihBayar;
      aset.total = aset.lancar + aset.asetTetapNeto;
      const liabilitas = { utangUsaha, utangTalangan, talanganPerPihak, utangPPN: ppnNet > 0 ? ppnNet : 0, utangPPh: pphNet > 0 ? pphNet : 0, pinjaman };
      liabilitas.total = liabilitas.utangUsaha + liabilitas.utangTalangan + liabilitas.utangPPN + liabilitas.utangPPh + liabilitas.pinjaman;
      const ekuitas = { modal, saldoLabaAwalTahun, labaTahunBerjalan: lr.labaBersih, priveTahunIni, saldoLabaAkhir };
      ekuitas.total = modal + saldoLabaAkhir;
      const selisih = aset.total - (liabilitas.total + ekuitas.total);

      // ---------- Laporan arus kas tahun Y (metode langsung) ----------
      const inY = (d) => inYear(d, Y);
      const txY = (type) => sumTx(type, inY);
      const bebanKasY = expenses.reduce((s, e) => s + (inY(e.date) ? expKasLangsung(e) : 0) + (expIsUtang(e) && inY(expPaidDate(e)) ? expGross(e) : 0), 0);
      const operasi = {
        dariPelanggan: invoices.filter(i => inY(invPaidDate(i))).reduce((s, i) => s + invDiterima(i), 0) + txY('terima_piutang_awal'),
        lainLain: txY('pendapatan_lain') + txY('bunga_bank'),
        keBebanPembelian: bebanKasY + txY('bayar_utang_awal'),
        pajak: txY('setor_ppn') + txY('setor_pph'),
      };
      operasi.net = operasi.dariPelanggan + operasi.lainLain - operasi.keBebanPembelian - operasi.pajak;
      const investasi = { asetTetap: assets.filter(a => inY(a.date)).reduce((s, a) => s + num(a.cost), 0) };
      investasi.net = -investasi.asetTetap;
      const pendanaan = {
        modal: txY('modal'), prive: txY('prive'), pinjamanMasuk: txY('pinjaman_masuk'), bayarPinjaman: txY('bayar_pinjaman'),
        kembaliTalangan: expenses.filter(e => expAdaTalangan(e) && inY(expPaidDate(e))).reduce((s, e) => s + expTalanganNominal(e), 0),
      };
      pendanaan.net = pendanaan.modal - pendanaan.prive + pendanaan.pinjamanMasuk - pendanaan.bayarPinjaman - pendanaan.kembaliTalangan;
      const kasAwal = kasSampai(`${Y - 1}-12-31`);
      const kasAwalTunai = kasAkunSampai(`${Y - 1}-12-31`, 'tunai'), kasAwalBank = kasAkunSampai(`${Y - 1}-12-31`, 'bank');
      const pindahKas = cashTx.filter(t => t.type === 'pindah_kas' && inY(t.date)).reduce((s, t) => s + num(t.amount), 0);
      const nonKasTalangan = expenses.filter(e => expAdaTalangan(e) && inY(e.date)).reduce((s, e) => s + expTalanganNominal(e), 0);
      const arusKas = { operasi, investasi, pendanaan, kenaikan: operasi.net + investasi.net + pendanaan.net, kasAwal, kasAkhir: kas, nonKasTalangan, kasAwalTunai, kasAwalBank, kasAkhirTunai: kasTunai, kasAkhirBank: kasBank, pindahKas };
      arusKas.cocok = Math.abs(arusKas.kasAwal + arusKas.kenaikan - arusKas.kasAkhir) < 1;

      // ---------- Pencocokan dengan saldo bank sebenarnya ----------
      const saldoAsli = L.saldoBank[String(Y)] || {};
      const cocokBank = ['tunai', 'bank'].filter(k => saldoAsli[k] !== undefined).map(k => ({ akun: k, label: AKUN_KAS[k].label, catatan: k === 'tunai' ? kasTunai : kasBank, saldo: num(saldoAsli[k]), selisih: num(saldoAsli[k]) - (k === 'tunai' ? kasTunai : kasBank) }));

      // ---------- PPN per masa (bulan) tahun Y ----------
      const ppnMasa = Array.from({ length: 12 }, (_, m) => {
        const mm = `${Y}-${String(m + 1).padStart(2, '0')}`;
        const kel = invoices.filter(i => i.date.startsWith(mm)).reduce((s, i) => s + num(i.ppn), 0);
        const dipungut = invoices.filter(i => i.date.startsWith(mm) && invDipungut(i)).reduce((s, i) => s + num(i.ppn), 0);
        const mas = expenses.filter(e => e.date.startsWith(mm)).reduce((s, e) => s + num(e.ppnMasukan), 0);
        const dpp = invoices.filter(i => i.usePpn && i.date.startsWith(mm)).reduce((s, i) => s + num(i.subtotal), 0);
        const setor = cashTx.filter(t => t.type === 'setor_ppn' && t.date.startsWith(mm)).reduce((s, t) => s + num(t.amount), 0);
        return { bulan: m, dpp, keluaran: kel, dipungut, masukan: mas, kurangBayar: kel - dipungut - mas, setor };
      });

      const peringatan = [];
      const belumLunasLama = invoices.filter(i => !i.paidDate && i.date < `${new Date().getFullYear()}-01-01`).length;
      if (belumLunasLama) peringatan.push(`${belumLunasLama} invoice tahun lalu belum ditandai lunas — dianggap masih piutang.`);
      if (!lr.persAkhirDiisi && (lr.pembelian > 0 || lr.persAwal > 0)) peringatan.push(`Persediaan akhir ${Y} belum diisi — seluruh pembelian dianggap terjual (HPP).`);
      if (Math.abs(selisih) >= 1) peringatan.push(`Neraca selisih ${Math.round(selisih)} — periksa saldo awal.`);
      [['tunai', kasTunai], ['bank', kasBank]].forEach(([k, v]) => { if (v < 0) peringatan.push(`${AKUN_KAS[k].label} per 31 Des ${Y} minus (${Math.round(v).toLocaleString('id-ID')}). Periksa pilihan kas pada invoice/pengeluaran, catat pengeluaran yang dibayar pihak ketiga sebagai "Dana talangan", atau isi saldo awal di Data Keuangan.`); });
      cocokBank.forEach(c => { if (Math.abs(c.selisih) >= 1) peringatan.push(`${c.label} menurut catatan berbeda ${Math.round(c.selisih).toLocaleString('id-ID')} dari saldo sebenarnya — cek transaksi yang belum dicatat atau salah pilihan kas.`); });

      return { year: Y, firstYear, lr, aset, liabilitas, ekuitas, selisih, ppnMasa, scheme: L.pphScheme, peringatan, arusKas, cocokBank, pphDipotongTahun };
    }

    // =====================================================================
    // BUKU BESAR — jurnal berpasangan (debit = kredit) dari seluruh transaksi
    // =====================================================================
    // jenis: aset/beban → saldo normal debit; liabilitas/ekuitas/pendapatan → saldo normal kredit
    function daftarAkun() {
      const A = [
        ['1-101', 'Kas Tunai', 'aset'],
        ['1-102', 'Kas Bank (Bank DKI 50308011105 a/n PT Nuri Vira Pratama)', 'aset'],
        ['1-103', 'Piutang usaha', 'aset'],
        ['1-104', 'Persediaan barang', 'aset'],
        ['1-201', 'Aset tetap (harga perolehan)', 'aset'],
        ['1-202', 'Akumulasi penyusutan', 'aset'],
        ['2-101', 'Utang usaha', 'liabilitas'],
        ['2-102', 'Utang dana talangan pihak ketiga', 'liabilitas'],
        ['2-103', 'Utang PPN (keluaran − masukan)', 'liabilitas'],
        ['2-104', 'Utang PPh Badan', 'liabilitas'],
        ['2-105', 'Utang pinjaman', 'liabilitas'],
        ['3-101', 'Modal disetor', 'ekuitas'],
        ['3-102', 'Saldo laba', 'ekuitas'],
        ['3-103', 'Prive / dividen', 'prive'],
        ['4-101', 'Penjualan kena PPN', 'pendapatan'],
        ['4-102', 'Penjualan tidak dipungut PPN', 'pendapatan'],
        ['5-101', 'Pembelian barang/bahan', 'beban'],
        ['5-102', 'Penyesuaian persediaan (HPP)', 'beban'],
      ];
      JENIS_BIAYA.Operasional.forEach((j, i) => A.push([`6-1${String(i + 1).padStart(2, '0')}`, 'Beban ' + j.charAt(0).toLowerCase() + j.slice(1), 'beban']));
      A.push(['6-199', 'Beban operasional belum dikategorikan', 'beban']);
      A.push(['6-201', 'Beban penyusutan aset tetap', 'beban']);
      A.push(['7-101', 'Pendapatan lain-lain', 'pendapatan']);
      A.push(['7-102', 'Pendapatan bunga / jasa giro bank', 'pendapatan']);
      A.push(['8-101', 'Beban pajak penghasilan', 'beban']);
      return A.map(([kode, nama, jenis]) => ({ kode, nama, jenis, normal: ['aset', 'beban', 'prive'].includes(jenis) ? 'D' : 'K', nominal: ['pendapatan', 'beban', 'prive'].includes(jenis) }));
    }
    const akunBeban = (e) => {
      if (e && e.category === 'HPP') return '5-101';
      const i = JENIS_BIAYA.Operasional.indexOf(e && e.jenis);
      return i >= 0 ? `6-1${String(i + 1).padStart(2, '0')}` : '6-199';
    };
    const kodeKas = (akun) => AKUN_KAS[akunAman(akun)].kode;

    function jurnalUmum(db, sampaiTahun) {
      const Y = Number(sampaiTahun), D = `${Y}-12-31`;
      const upTo = (d) => d && d <= D;
      const invoices = (db.invoices || []).filter(i => i && i.date);
      const expenses = (db.expenses || []).filter(e => e && e.date);
      const assets = (db.assets || []).filter(a => a && a.date);
      const cashTx = (db.cashTx || []).filter(t => t && t.date && JENIS_KAS[t.type]);
      const L = normalizeLedger(db.ledger), O = saldoAwalPembukuan(db);
      const years = [];
      [...invoices, ...expenses, ...assets, ...cashTx].forEach(x => years.push(Number(x.date.substring(0, 4))));
      const firstYear = Math.min(Y, ...(years.length ? years : [Y]));
      const J = [];
      const tambah = (date, ref, ket, baris, urut) => {
        const lines = baris.filter(b => b && (Math.abs(num(b[1])) >= 0.005 || Math.abs(num(b[2])) >= 0.005)).map(([akun, d, k]) => ({ akun, d: num(d), k: num(k) }));
        if (lines.length && upTo(date)) J.push({ date, ref, ket, lines, urut: urut || 5 });
      };
      // saldo awal
      const sl = (O.kasTunai + O.kas + O.piutang + O.persediaan + O.asetTetap - O.akumPenyusutan) - (O.utangUsaha + O.utangPajak + O.pinjaman) - O.modal;
      tambah(`${firstYear}-01-01`, 'SALDO-AWAL', 'Saldo awal pembukuan', [
        ['1-101', O.kasTunai, 0], ['1-102', O.kas, 0], ['1-103', O.piutang, 0], ['1-104', O.persediaan, 0], ['1-201', O.asetTetap, 0], ['1-202', 0, O.akumPenyusutan],
        ['2-101', 0, O.utangUsaha], ['2-104', 0, O.utangPajak], ['2-105', 0, O.pinjaman], ['3-101', 0, O.modal], sl >= 0 ? ['3-102', 0, sl] : ['3-102', -sl, 0],
      ], 0);
      // invoice: terbit → piutang; lunas → kas sesuai rekening tujuan
      invoices.forEach(i => {
        const ppn = num(i.ppn), tot = invTagihan(i), ppnUtang = invPpnTerutang(i);
        tambah(i.date, i.id, `Penjualan — ${i.customer || ''}${invDipungut(i) ? ' (PPN ' + Math.round(ppn).toLocaleString('id-ID') + ' dipungut & disetor pembeli)' : ''}`, [['1-103', tot, 0], [i.usePpn ? '4-101' : '4-102', 0, num(i.total) - ppn], ['2-103', 0, ppnUtang]], 1);
        const pd = invPaidDate(i);
        if (pd) { const r = REKENING[invRek(i)], pph = invPphPotong(i); tambah(pd, i.id, `Pelunasan invoice ${i.id} — ${i.customer || ''}${pph ? ` (${PPH_POTONG[i.pphJenis].pendek} dipotong pembeli)` : ''}`, [[kodeKas(r.akun), tot - pph, 0], ['2-104', pph, 0], ['1-103', 0, tot]], 2); }
      });
      // beban & pembelian
      expenses.forEach(e => {
        const ket = e.desc || e.jenis || 'Pengeluaran';
        const kasL = expKasLangsung(e), tal = expTalanganNominal(e), utg = expIsUtang(e) ? expGross(e) : 0;
        const ketL = expIsTalangan(e) ? `${ket} (ditalangi ${namaPihak(e)})` : expIsCampuran(e) ? `${ket} (sebagian dari ${AKUN_KAS[expAkunLangsung(e)].label}, sebagian ditalangi ${namaPihak(e)})` : ket;
        tambah(e.date, e.id || 'BEBAN', ketL, [[akunBeban(e), num(e.amount), 0], ['2-103', num(e.ppnMasukan), 0],
          kasL ? [kodeKas(expAkunLangsung(e)), 0, kasL] : null, utg ? ['2-101', 0, utg] : null, tal ? ['2-102', 0, tal] : null], 3);
        const sisa = utg + tal, pd = expPaidDate(e);
        if (sisa && pd) tambah(pd, e.id || 'BEBAN', tal ? `Pengembalian dana talangan ke ${namaPihak(e)} — ${ket}` : `Pelunasan utang — ${ket}`, [[tal ? '2-102' : '2-101', sisa, 0], [kodeKas(expAkun(e)), 0, sisa]], 4);
      });
      // aset tetap
      assets.forEach(a => tambah(a.date, a.id || 'ASET', `Pembelian aset tetap — ${a.name || ''}`, [['1-201', num(a.cost), 0], [kodeKas(asetAkun(a)), 0, num(a.cost)]], 3));
      // transaksi kas lain
      const PASANGAN = { modal: '3-101', prive: '3-103', pinjaman_masuk: '2-105', bayar_pinjaman: '2-105', setor_ppn: '2-103', setor_pph: '2-104', pendapatan_lain: '7-101', bunga_bank: '7-102', terima_piutang_awal: '1-103', bayar_utang_awal: '2-101' };
      cashTx.forEach(t => {
        const n = num(t.amount), ket = `${JENIS_KAS[t.type].label}${t.desc ? ' — ' + t.desc : ''}`;
        if (t.type === 'pindah_kas') { tambah(t.date, t.id || 'KAS', `${ket} (${AKUN_KAS[txAkun(t)].label} → ${AKUN_KAS[txTujuan(t)].label})`, [[kodeKas(txTujuan(t)), n, 0], [kodeKas(txAkun(t)), 0, n]], 3); return; }
        const k = kodeKas(txAkun(t)), p = PASANGAN[t.type];
        tambah(t.date, t.id || 'KAS', ket, JENIS_KAS[t.type].arah > 0 ? [[k, n, 0], [p, 0, n]] : [[p, n, 0], [k, 0, n]], 3);
      });
      // penyesuaian akhir tahun: penyusutan, persediaan, pajak penghasilan
      for (let y = firstYear; y <= Y; y++) {
        const lr = computeLedger(db, y).lr, akhir = `${y}-12-31`;
        tambah(akhir, `PENY-${y}`, `Penyusutan aset tetap tahun ${y}`, [['6-201', lr.penyusutan, 0], ['1-202', 0, lr.penyusutan]], 8);
        tambah(akhir, `PERS-${y}`, `Penyesuaian persediaan ${y}: persediaan awal dibebankan ke HPP`, [['5-102', lr.persAwal, 0], ['1-104', 0, lr.persAwal]], 8);
        tambah(akhir, `PERS-${y}`, `Penyesuaian persediaan ${y}: persediaan akhir (stock opname)`, [['1-104', lr.persAkhir, 0], ['5-102', 0, lr.persAkhir]], 8);
        tambah(akhir, `PPH-${y}`, `Taksiran PPh Badan tahun ${y}`, [['8-101', lr.bebanPajak, 0], ['2-104', 0, lr.bebanPajak]], 9);
      }
      J.sort((a, b) => a.date.localeCompare(b.date) || a.urut - b.urut || String(a.ref).localeCompare(String(b.ref)));
      J.forEach((j, n) => { j.no = `JU-${j.date.slice(0, 4)}-${String(n + 1).padStart(4, '0')}`; });
      return { entries: J, firstYear };
    }

    const daftarAkunCache = daftarAkun();
    function bukuBesar(db, tahun) {
      const Y = Number(tahun), awalTahun = `${Y}-01-01`;
      const { entries } = jurnalUmum(db, Y);
      const akun = daftarAkun();
      const byKode = Object.fromEntries(akun.map(a => [a.kode, a]));
      const nominal = (k) => byKode[k] && byKode[k].nominal;
      // saldo awal (debit positif). Akun nominal & prive ditutup ke saldo laba setiap akhir tahun.
      const awal = Object.fromEntries(akun.map(a => [a.kode, 0]));
      entries.filter(j => j.date < awalTahun).forEach(j => j.lines.forEach(l => {
        const k = nominal(l.akun) ? '3-102' : l.akun;
        awal[k] = (awal[k] || 0) + l.d - l.k;
      }));
      const jurnalTahun = entries.filter(j => j.date >= awalTahun);
      const buku = akun.map(a => {
        let saldo = awal[a.kode] || 0;
        const rows = [];
        jurnalTahun.forEach(j => j.lines.forEach(l => { if (l.akun === a.kode) { saldo += l.d - l.k; rows.push({ date: j.date, no: j.no, ref: j.ref, ket: j.ket, d: l.d, k: l.k, saldo }); } }));
        return { ...a, saldoAwal: awal[a.kode] || 0, rows, saldoAkhir: saldo, mutasiD: rows.reduce((s, r) => s + r.d, 0), mutasiK: rows.reduce((s, r) => s + r.k, 0) };
      });
      const neracaSaldo = buku.map(b => ({ kode: b.kode, nama: b.nama, jenis: b.jenis, debit: b.saldoAkhir > 0 ? b.saldoAkhir : 0, kredit: b.saldoAkhir < 0 ? -b.saldoAkhir : 0 }));
      const totalD = neracaSaldo.reduce((s, r) => s + r.debit, 0), totalK = neracaSaldo.reduce((s, r) => s + r.kredit, 0);
      const tidakSeimbang = jurnalTahun.filter(j => Math.abs(j.lines.reduce((s, l) => s + l.d - l.k, 0)) >= 0.01);
      return { year: Y, akun, jurnal: jurnalTahun, buku, neracaSaldo, totalD, totalK, seimbang: Math.abs(totalD - totalK) < 0.5 && !tidakSeimbang.length };
    }

    async function rk3Token(force) {
      const now = Date.now();
      const s = force ? null : lsGet('rk3_anon');
      if (s && s.idToken && s.exp > now + 60000) return s.idToken;
      let j = null;
      if (s && s.refreshToken) {
        try {
          const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${RK3.apiKey}`, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refreshToken),
          });
          const d = await r.json();
          if (d.id_token) j = { idToken: d.id_token, refreshToken: d.refresh_token, expiresIn: d.expires_in };
        } catch (e) {}
      }
      if (!j) {
        const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${RK3.apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }),
        });
        const d = await r.json();
        if (!d.idToken) throw new Error('login anonim gagal');
        j = { idToken: d.idToken, refreshToken: d.refreshToken, expiresIn: d.expiresIn };
      }
      const saved = { idToken: j.idToken, refreshToken: j.refreshToken, exp: now + (Number(j.expiresIn) || 3600) * 1000 };
      lsSet('rk3_anon', saved);
      return saved.idToken;
    }

    async function loadRk3News() {
      const cached = lsGet('rk3_news');
      if (cached && Array.isArray(cached.items) && cached.t > Date.now() - RK3.cacheMenit * 60000) return cached.items;

      const run = async (token) => {
        const A = 'auth=' + encodeURIComponent(token);
        const get = async (path, extra = '') => {
          const r = await fetch(`${RK3.db}${path}.json?${A}${extra}`);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        };
        const keys = Object.keys((await get('', '&shallow=true')) || {});
        const meta = await Promise.all(keys.map(async (k) => {
          const [kategori, ts] = await Promise.all([get(`/${k}/kategori`), get(`/${k}/timestamp`)]);
          return { id: k, kategori, ts: Number(ts) || 0 };
        }));
        const pilih = meta.filter(m => m.kategori === RK3.kategori).sort((a, b) => b.ts - a.ts).slice(0, RK3.max);
        return Promise.all(pilih.map(async (m) => {
          const [judul, isi, f0] = await Promise.all([get(`/${m.id}/judul`), get(`/${m.id}/isi`), get(`/${m.id}/fotoBase64/0`).catch(() => null)]);
          const isImg = (v) => typeof v === 'string' && /^(data:image\/|https:\/\/)/.test(v);
          let foto = isImg(f0) ? f0 : null;
          if (!foto) { const one = await get(`/${m.id}/fotoBase64`).catch(() => null); if (isImg(one)) foto = one; }
          return { id: m.id, ts: m.ts, judul: String(judul || '').trim(), isi: String(isi || '').trim(), foto };
        }));
      };

      let items;
      try { items = await run(await rk3Token()); }
      catch (e) { lsDel('rk3_anon'); items = await run(await rk3Token(true)); } // token kedaluwarsa → login ulang sekali
      lsSet('rk3_news', { t: Date.now(), items });
      return items;
    }

      const ledgerResult = useMemo(() => computeLedger({ invoices, expenses, assets, cashTx, ledger, stok }, lapYear), [invoices, expenses, assets, cashTx, ledger, stok, lapYear]);

      const availableYears = useMemo(() => {
        const years = new Set([currentYearStr, lapYear]);
        [...(invoices||[]), ...(expenses||[]), ...(assets||[]), ...(cashTx||[])].forEach(x => { if (x?.date) years.add(x.date.substring(0, 4)); });

      }, [invoices, expenses, assets, cashTx, currentYearStr, lapYear]);

      // Grafik: penjualan bersih (DPP, tanpa PPN) per bulan — tahun laporan vs tahun sebelumnya
      const monthlyRevenueData = useMemo(() => {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
        const data = months.map(m => ({ month: m, curr: 0, prev: 0 }));
        const yc = String(lapYear), yp = String(Number(lapYear) - 1);
        (invoices||[]).forEach(inv => {
          if (!inv?.date) return;
          const y = inv.date.substring(0, 4), m = Number(inv.date.substring(5, 7)) - 1;
          if (m < 0 || m > 11) return;
          if (y === yc) data[m].curr += num(inv.subtotal);
          else if (y === yp) data[m].prev += num(inv.subtotal);
        });
        return data;

      const maxChartValue = Math.max(...monthlyRevenueData.flatMap(d => [d.curr, d.prev]), 10000000);

      // --- DATA LOADING & SYNCING (kunci & format data sama persis dengan versi lama) ---
      const applyLoadedData = (data) => {
        if (data.penawaran && Array.isArray(data.penawaran)) setPenawaran(data.penawaran);
        if (data.invoices && Array.isArray(data.invoices)) setInvoices(data.invoices);
        if (data.expenses && Array.isArray(data.expenses)) setExpenses(data.expenses);
        if (data.suratJalan && Array.isArray(data.suratJalan)) setSuratJalan(data.suratJalan);
        if (data.kwitansi && Array.isArray(data.kwitansi)) setKwitansi(data.kwitansi);
        if (data.assets && Array.isArray(data.assets)) setAssets(data.assets);
        if (data.cashTx && Array.isArray(data.cashTx)) setCashTx(data.cashTx);
        setLedger(normalizeLedger(data.ledger));
        setStok(normalizeStok(data.stok));
      };

      // Bentuk data yang disimpan (urutan kunci tetap, agar perbandingan "ada perubahan" akurat)
      const normalizeDb = (data) => {
        const arr = (x) => Array.isArray(x) ? x : [];
        return { penawaran: arr(data.penawaran), invoices: arr(data.invoices), expenses: arr(data.expenses), suratJalan: arr(data.suratJalan), kwitansi: arr(data.kwitansi), assets: arr(data.assets), cashTx: arr(data.cashTx), ledger: normalizeLedger(data.ledger), stok: normalizeStok(data.stok) };
      };

      // --- API (GitHub Pages -> Google Apps Script Web App) ---
      // Body dikirim sebagai text/plain agar tidak memicu CORS preflight.
      // Permintaan baca (aman diulang) dicoba lagi otomatis bila koneksi putus sesaat
      // (mis. Safari: "Load failed" saat tab di latar belakang / server baru bangun).
      const API_BACA = ['load', 'listUsers'];
      const callApi = async (payload) => {
        const ulang = API_BACA.indexOf(payload && payload.action) >= 0 ? 2 : 0;
        for (let i = 0; ; i++) {
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
          } catch (err) {
            if (i >= ulang) throw err;
            await new Promise(r => setTimeout(r, 1500 * (i + 1)));
          }
        }
      };

      const saveToServer = (dataObj) => {
        const json = JSON.stringify(dataObj);
        setIsSyncing(true);
        return callApi({ action: 'save', ...apiCredsRef.current, data: dataObj })
          .then(r => {
            if (r && r.error === 'AUTH') { authFailedRef.current = true; throw new Error('akun/password sudah diubah — keluar lalu masuk lagi'); }
            if (!r || !r.ok) throw new Error((r && r.error) || 'respon tidak valid');
            lastSavedRef.current = json;
            setSyncError('');
            return true;
          })
          .catch(err => {
            setSyncError('Gagal menyimpan ke server (' + err.message + '). Perubahan terakhir belum tersimpan.');
            return false;
          })
          .finally(() => setIsSyncing(false));
      };

      useEffect(() => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(function(response) {
              if (response) {
                try {
                  applyLoadedData(JSON.parse(response));
                  saveAllowedRef.current = true;
                } catch (e) {
                  console.error(e);
                  setLoadError('Data di Google Drive tidak dapat dibaca. Penyimpanan otomatis dinonaktifkan agar data lama tidak tertimpa.');
                }
              } else {
                saveAllowedRef.current = true; // belum ada data sama sekali
              }
              setIsDataLoaded(true);
            })
            .withFailureHandler(function() {
              setLoadError('Gagal terhubung ke Google Drive. Penyimpanan otomatis dinonaktifkan agar data lama tidak tertimpa — muat ulang halaman.');
              setIsDataLoaded(true);
            })
            .loadDataFromDrive();
        } else if (isAPI) {
          // Data dimuat setelah login — server memeriksa username & password.
          setIsDataLoaded(true);
        } else {
          let localData = null;
          try { localData = localStorage.getItem('nvp_data_fallback'); } catch (e) {}
          if (localData) {
            try {
              applyLoadedData(JSON.parse(localData));
              saveAllowedRef.current = true;
            } catch (e) {
              setLoadError('Data lokal tidak dapat dibaca. Penyimpanan otomatis dinonaktifkan agar data lama tidak tertimpa.');
            }
          } else {
            saveAllowedRef.current = true;
          }
          setIsDataLoaded(true);
        }
      }, []);

      useEffect(() => {
        if (!isDataLoaded || !saveAllowedRef.current) return;
        const dataToSave = { penawaran, invoices, expenses, suratJalan, kwitansi, assets, cashTx, ledger, stok };
        if (isAPI && JSON.stringify(dataToSave) === lastSavedRef.current) { setIsSyncing(false); return; } // tidak ada perubahan
        setIsSyncing(true);
        const timeoutId = setTimeout(() => {
          if (isAPI) {
            saveToServer(dataToSave);
          } else if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(() => setIsSyncing(false))
              .withFailureHandler(() => setIsSyncing(false))
              .saveDataToDrive(JSON.stringify(dataToSave));
          } else {
             try { localStorage.setItem('nvp_data_fallback', JSON.stringify(dataToSave)); } catch (e) { console.error(e); }
             setIsSyncing(false);
          }
        }, 1500);
        return () => clearTimeout(timeoutId);
      }, [penawaran, invoices, expenses, suratJalan, kwitansi, assets, cashTx, ledger, stok, isDataLoaded]);

      const handleDownloadPDF = () => {
        const element = document.getElementById('print-container');
        if (!element) return;

        setIsGeneratingPDF(true);
        const namaLap = { labarugi: 'Laba_Rugi', neraca: 'Neraca', pajak: 'Perhitungan_Pajak', bukubesar: 'Buku_Besar' }[printData.part] || 'Laporan_Keuangan';
        const fileName = printData.type === 'lapkeu'

              ? `${String(printData.item.id).replace(/\//g, '-')}.pdf`
              : `Dokumen_${printData.type}_Kolektif.pdf`;

        const opt = {
          margin:       [12, 12, 12, 12],
          filename:     fileName,
          image:        { type: 'jpeg', quality: 0.98 },

      useEffect(() => {

      useEffect(() => {
